<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Learning Test 1 — P&C Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#090b10;color:#f0f0f0;font-family:'IBM Plex Mono',monospace;min-height:100vh;padding-bottom:60px;}

/* ── HEADER ── */
.header{padding:16px 20px;border-bottom:1px solid #1e2330;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#090b10;z-index:10;}
.h-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;color:#c9a227;}
.h-sub{font-size:7px;letter-spacing:3px;color:#4b5563;margin-top:2px;}
.back-link{color:#6b7280;font-size:8px;letter-spacing:2px;text-decoration:none;}
.back-link:hover{color:#c9a227;}

/* ── STATS BAR ── */
.stats-bar{display:flex;gap:0;border-bottom:1px solid #1e2330;}
.stat{flex:1;padding:12px 16px;text-align:center;border-right:1px solid #1e2330;}
.stat:last-child{border-right:none;}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:26px;color:#c9a227;line-height:1;}
.stat-lbl{font-size:7px;letter-spacing:2px;color:#4b5563;margin-top:2px;}

/* ── CONTROLS ── */
.controls{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px solid #1e2330;}
.mode-btns{display:flex;gap:6px;}
.mode-btn{background:#0e1117;border:1px solid #1e2330;color:#6b7280;font-family:'IBM Plex Mono',monospace;font-size:7px;letter-spacing:2px;padding:7px 12px;cursor:pointer;border-radius:2px;transition:all .15s;}
.mode-btn.active{background:#c9a227;border-color:#c9a227;color:#090b10;}
.filter-tags{display:flex;gap:6px;flex-wrap:wrap;}
.tag{background:#0e1117;border:1px solid #1e2330;color:#6b7280;font-size:7px;letter-spacing:1px;padding:5px 10px;border-radius:2px;cursor:pointer;transition:all .15s;}
.tag.active{border-color:#c9a227;color:#c9a227;}
.progress-txt{font-size:8px;letter-spacing:1px;color:#4b5563;}

/* ── FLASHCARD ── */
#flashcard-mode{padding:16px;}
.card-counter{font-size:8px;letter-spacing:2px;color:#4b5563;text-align:center;margin-bottom:12px;}
.flashcard-wrap{perspective:1000px;margin-bottom:16px;cursor:pointer;}
.flashcard{position:relative;width:100%;min-height:220px;transform-style:preserve-3d;transition:transform .45s ease;border-radius:4px;}
.flashcard.flipped{transform:rotateY(180deg);}
.card-face{position:absolute;width:100%;min-height:220px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:4px;padding:24px 20px;display:flex;flex-direction:column;justify-content:center;}
.card-front{background:#0e1117;border:1px solid #1e2330;}
.card-back{background:#0d1a0d;border:1px solid #1e2330;transform:rotateY(180deg);}
.card-face-label{font-size:7px;letter-spacing:3px;color:#4b5563;margin-bottom:12px;}
.card-question{font-size:13px;line-height:1.7;color:#f0f0f0;}
.card-answer{font-size:12px;line-height:1.7;color:#f0f0f0;margin-bottom:12px;}
.card-answer strong{color:#c9a227;}
.memory-trick{background:#0a1a0a;border:1px solid #1a3a1a;border-radius:3px;padding:10px 12px;margin-top:10px;}
.memory-label{font-size:7px;letter-spacing:2px;color:#4b5563;margin-bottom:4px;}
.memory-text{font-size:10px;color:#6fcf6f;line-height:1.6;}
.tap-hint{font-size:7px;letter-spacing:2px;color:#374151;text-align:center;margin-top:8px;}
.card-topic{font-size:7px;letter-spacing:2px;padding:3px 8px;border-radius:2px;display:inline-block;margin-bottom:10px;}

/* topic colors */
.topic-auto{background:#1a1a2e;color:#818cf8;}
.topic-property{background:#1a1200;color:#f59e0b;}
.topic-liability{background:#1a0d0d;color:#f87171;}
.topic-crime{background:#0d1a1a;color:#34d399;}
.topic-general{background:#1a1a1a;color:#9ca3af;}
.topic-workers{background:#1a0d1a;color:#c084fc;}
.topic-state{background:#0d1020;color:#60a5fa;}

.nav-btns{display:flex;gap:8px;justify-content:center;}
.nav-btn{background:#0e1117;border:1px solid #1e2330;color:#f0f0f0;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;padding:10px 28px;cursor:pointer;border-radius:2px;transition:all .15s;}
.nav-btn:hover,.nav-btn:active{border-color:#c9a227;color:#c9a227;}
.nav-btn.primary{background:#c9a227;border-color:#c9a227;color:#090b10;}
.nav-btn:disabled{opacity:0.3;cursor:not-allowed;}

.got-it-wrap{display:flex;gap:8px;justify-content:center;margin-top:12px;}
.got-it-btn{font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:2px;padding:8px 20px;border-radius:2px;cursor:pointer;border:1px solid;}
.btn-knew{background:#0d1a0d;border-color:#2d6a2d;color:#6fcf6f;}
.btn-missed{background:#1a0d0d;border-color:#6a2d2d;color:#f87171;}

/* ── LIST MODE ── */
#list-mode{display:none;padding:14px;}
.list-card{background:#0e1117;border:1px solid #1e2330;border-radius:3px;padding:14px 16px;margin-bottom:8px;}
.list-q{font-size:10px;letter-spacing:1px;color:#9ca3af;margin-bottom:8px;line-height:1.6;}
.list-a{font-size:11px;color:#f0f0f0;margin-bottom:6px;line-height:1.6;}
.list-a strong{color:#c9a227;}
.list-mem{font-size:9px;color:#6fcf6f;border-top:1px solid #1a2a1a;padding-top:8px;margin-top:8px;line-height:1.6;}

/* ── SCORE ── */
#score-screen{display:none;padding:32px 20px;text-align:center;}
.score-big{font-family:'Bebas Neue',sans-serif;font-size:80px;color:#c9a227;line-height:1;}
.score-label{font-size:9px;letter-spacing:3px;color:#4b5563;margin-bottom:24px;}
.score-breakdown{display:flex;gap:12px;justify-content:center;margin-bottom:28px;}
.score-item{background:#0e1117;border:1px solid #1e2330;padding:14px 20px;border-radius:3px;}
.score-item-val{font-family:'Bebas Neue',sans-serif;font-size:28px;color:#f0f0f0;}
.score-item-lbl{font-size:7px;letter-spacing:2px;color:#4b5563;}
.restart-btn{background:#c9a227;border:none;color:#090b10;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:3px;padding:12px 40px;cursor:pointer;border-radius:2px;}

/* ── TOPIC SECTION HEADERS ── */
.topic-header{font-size:8px;letter-spacing:3px;color:#4b5563;padding:16px 0 8px;border-bottom:1px solid #1e2330;margin-bottom:8px;}
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="h-title">LEARNING TEST 1</div>
    <div class="h-sub">29 MISSED QUESTIONS · FLASHCARDS + MEMORY TRICKS</div>
  </div>
  <a class="back-link" href="PC_Dashboard.html">← DASHBOARD</a>
</div>

<div class="stats-bar">
  <div class="stat">
    <div class="stat-val">29</div>
    <div class="stat-lbl">TOTAL</div>
  </div>
  <div class="stat">
    <div class="stat-val" id="known-count">0</div>
    <div class="stat-lbl">KNEW IT</div>
  </div>
  <div class="stat">
    <div class="stat-val" id="missed-count">0</div>
    <div class="stat-lbl">MISSED</div>
  </div>
  <div class="stat">
    <div class="stat-val" id="pct-count">0%</div>
    <div class="stat-lbl">SCORE</div>
  </div>
</div>

<div class="controls">
  <div class="mode-btns">
    <button class="mode-btn active" onclick="setMode('flash')">FLASHCARDS</button>
    <button class="mode-btn" onclick="setMode('list')">REVIEW ALL</button>
  </div>
  <div class="progress-txt" id="progress-txt">Card 1 of 29</div>
</div>

<!-- FLASHCARD MODE -->
<div id="flashcard-mode">
  <div class="card-counter" id="card-counter">1 / 29</div>

  <div class="flashcard-wrap" onclick="flipCard()">
    <div class="flashcard" id="flashcard">
      <div class="card-face card-front" id="card-front"></div>
      <div class="card-face card-back" id="card-back"></div>
    </div>
  </div>
  <div class="tap-hint" id="tap-hint">TAP CARD TO REVEAL ANSWER</div>

  <div class="got-it-wrap" id="got-it-wrap" style="display:none;">
    <button class="got-it-btn btn-missed" onclick="markCard(false)">✕ MISSED IT</button>
    <button class="got-it-btn btn-knew" onclick="markCard(true)">✓ KNEW IT</button>
  </div>

  <div class="nav-btns" style="margin-top:14px;" id="nav-btns">
    <button class="nav-btn" id="prev-btn" onclick="prevCard()" disabled>◀ PREV</button>
    <button class="nav-btn primary" onclick="nextCard()" id="next-btn">NEXT ▶</button>
  </div>
</div>

<!-- LIST MODE -->
<div id="list-mode"></div>

<!-- SCORE -->
<div id="score-screen">
  <div class="score-big" id="score-pct">--</div>
  <div class="score-label">FINAL SCORE</div>
  <div class="score-breakdown">
    <div class="score-item">
      <div class="score-item-val" id="final-known">0</div>
      <div class="score-item-lbl">KNEW IT</div>
    </div>
    <div class="score-item">
      <div class="score-item-val" id="final-missed">0</div>
      <div class="score-item-lbl">STILL LEARNING</div>
    </div>
  </div>
  <button class="restart-btn" onclick="restart()">REVIEW AGAIN</button>
</div>

<script>
const CARDS = [
  {
    topic:'general', topicLabel:'GENERAL',
    q:'What do common carriers do, and who do they serve?',
    a:'<strong>Common carriers transport the property of anyone who hires them.</strong> They are open to the public — no discrimination in who they serve.',
    mem:'Think: "Common" = open to the common public. A taxi can\'t refuse a passenger, a common carrier can\'t refuse cargo.'
  },
  {
    topic:'liability', topicLabel:'LIABILITY',
    q:'What is vicarious liability?',
    a:'<strong>Liability imposed on one party due to the actions of another person.</strong> Examples: employer/employee, parent/child.',
    mem:'"VICarious" = liability VIA someone else\'s actions. You\'re on the hook because of what THEY did.'
  },
  {
    topic:'property', topicLabel:'PROPERTY',
    q:'Which of the following is NOT covered by the condominium unit owners endorsement? (Appliances, Alterations, Fixtures, Furniture)',
    a:'<strong>Furniture is NOT covered.</strong> The endorsement covers Alterations, Appliances, and Fixtures that are part of the building.',
    mem:'"AAF" — Alterations, Appliances, Fixtures = YES. Furniture starts with F but it\'s not attached to the building = NO.'
  },
  {
    topic:'auto', topicLabel:'AUTO',
    q:'Auto policy 25/50/15. Accident with 3 injured: A=$15k, B=$30k, C=$35k. How much does the insurer pay total?',
    a:'<strong>$50,000.</strong> A gets $15k (under $25k per-person limit). B gets $25k (capped). C gets $10k (only $10k left of the $50k per-accident limit).',
    mem:'Per-PERSON cap first, then per-ACCIDENT cap. Work left to right. 25 per person, 50 total. Stop when you hit either ceiling.'
  },
  {
    topic:'property', topicLabel:'PROPERTY',
    q:'Which is NOT settled on ACV basis under business property coverage? Manuscripts / Property of others / Valuable papers & records / Works of art',
    a:'<strong>Valuable papers and records.</strong> They are valued at cost of blank materials + labor to copy — NOT replacement cost minus depreciation.',
    mem:'"Papers aren\'t appraised — they\'re reprinted." Blank paper + labor. Everything else = ACV.'
  },
  {
    topic:'auto', topicLabel:'AUTO',
    q:'In a personal auto policy, theft transportation expenses begin how many hours after the theft?',
    a:'<strong>48 hours</strong> after the theft.',
    mem:'"2 days to prove the car\'s really gone before we rent you one." 48 = 2 days.'
  },
  {
    topic:'property', topicLabel:'PROPERTY',
    q:'To assign a property insurance policy to another party, whose written consent is required?',
    a:'<strong>The insurer\'s written consent</strong> is required for a valid assignment.',
    mem:'"The company holds the keys." You can\'t hand off the policy without the insurer\'s blessing.'
  },
  {
    topic:'auto', topicLabel:'AUTO',
    q:'In a commercial auto policy, where do you find specific information about the policy period?',
    a:'<strong>The Conditions section.</strong> Conditions define coverage in detail: policy period, territory, how coverage applies.',
    mem:'"Conditions condition the when and where." Period = Conditions. Think of conditions as the rules of the game.'
  },
  {
    topic:'crime', topicLabel:'CRIME',
    q:'A masked man pulls a gun and demands cash from a couple in a parking lot. What crime is this?',
    a:'<strong>Robbery.</strong> Property taken under threat of violence = robbery.',
    mem:'ROBBERY = Rough (force/threat). BURGLARY = Breaking in (no one needs to be present). LARCENY = Lifting quietly (no force, no break-in).'
  },
  {
    topic:'auto', topicLabel:'AUTO',
    q:'Transportation expense coverage in a personal auto policy pays how much per day, up to what maximum?',
    a:'<strong>$20 per day, up to a maximum of $600</strong> (30 days following theft, if the auto isn\'t recovered within 48 hours).',
    mem:'"Twenty bucks a day, stops at thirty days. 20 × 30 = $600." Easy math to lock it in.'
  },
  {
    topic:'liability', topicLabel:'LIABILITY',
    q:'Which statement about strict liability is NOT correct? A) Imposed on hazardous activities B) Claimants may need proof a defect caused injury C) Applied in product liability D) Imposed regardless of fault',
    a:'<strong>B is NOT correct.</strong> Strict liability removes the need to prove negligence/fault — but causation (the defect caused the injury) must still be proven.',
    mem:'"Strict = no fault needed, but causation always counts." You still have to show the product caused the harm — just not that anyone was careless.'
  },
  {
    topic:'property', topicLabel:'PROPERTY',
    q:'Which coverage in dwelling/homeowners policies covers indirect losses?',
    a:'<strong>Loss of Use.</strong> It only applies after a direct loss from a covered peril has already occurred.',
    mem:'"Direct hits the house. Indirect hits your wallet." Loss of use = hotel bills, extra expenses = INDIRECT.'
  },
  {
    topic:'property', topicLabel:'PROPERTY',
    q:'Homeowners covers collapse caused by all of the following EXCEPT: Weight of too many people / Foundation cracks / Hidden insect damage / Weight of snow',
    a:'<strong>Foundation cracks are NOT covered.</strong> Collapse must be sudden and unexpected. Cracks take years — plenty of time to find and fix them.',
    mem:'"Sudden = covered. Slow = not covered." Cracks are slow. Snow, bugs, people piling in = all sudden and unexpected.'
  },
  {
    topic:'property', topicLabel:'PROPERTY',
    q:'In property insurance, how is Actual Cash Value (ACV) defined?',
    a:'<strong>Replacement cost at the time of loss, minus depreciation.</strong>',
    mem:'"ACV = RC − D." Replace it today, subtract the age discount. Simple subtraction.'
  },
  {
    topic:'general', topicLabel:'GENERAL',
    q:'What is it called when an in-force insurance policy is terminated before the expiration date?',
    a:'<strong>Cancellation.</strong> Can be initiated by the insured or the insurer, voluntarily or involuntarily.',
    mem:'"Cancel = Cut before the end." Nonrenewal = not renewing at expiration. Rescission = voiding it from the start. Cancellation = cutting it short.'
  },
  {
    topic:'property', topicLabel:'PROPERTY',
    q:'$100k house, 80% coinsurance required, $60k coverage, $40k fire loss. How much does the owner collect?',
    a:'<strong>$30,000.</strong> Need $80k (80% of $100k). Have $60k = 75% of required. 75% × $40k loss = $30,000.',
    mem:'"Coinsurance formula: Have ÷ Need × Loss." Punch it in: 60 ÷ 80 × 40,000 = $30k. If you underinsure, you eat the difference.'
  },
  {
    topic:'liability', topicLabel:'LIABILITY',
    q:'A store employee wrongfully detained someone he believed was shoplifting (was actually the meter reader). What coverage applies?',
    a:'<strong>Personal and advertising injury liability.</strong> This covers false arrest/detention — damage to a person\'s character.',
    mem:'"False arrest = character damage = Personal Injury." Not bodily injury (no physical harm), not crime coverage — it\'s a personal injury liability claim.'
  },
  {
    topic:'general', topicLabel:'GENERAL',
    q:'What modifies the original insurance contract by adding or removing coverage?',
    a:'<strong>Endorsements.</strong> They change original terms, conditions, or coverages. Can add, delete, or correct items.',
    mem:'"Endorse = Modify." Think endorsing a check — you sign off on a change. Conditions are rules; endorsements are edits.'
  },
  {
    topic:'liability', topicLabel:'LIABILITY',
    q:'A cereal company shipped product in faulty containers causing spoilage and illness. Customers sue. What type of claim is this?',
    a:'<strong>Product liability claim.</strong> Covers loss arising from legal liability of a manufacturer/merchant/distributor due to a covered product causing injury.',
    mem:'"Made it, sold it, you\'re on the hook." If the product hurts someone, product liability steps in — regardless of how careful you were.'
  },
  {
    topic:'crime', topicLabel:'CRIME',
    q:'Employee theft bonds may be written in all forms EXCEPT: Single form / Blanket position / Position schedule / Name schedule',
    a:'<strong>Single form does NOT exist.</strong> Valid forms: Individual, Name Schedule, Position Schedule, Commercial Blanket, Blanket Position.',
    mem:'"I Need People Covered, Broadly" — Individual, Name, Position, Commercial blanket, Blanket position. No "single" form.'
  },
  {
    topic:'general', topicLabel:'GENERAL',
    q:'Which act created a federal program sharing the risk of terrorist attack losses with the insurance industry?',
    a:'<strong>TRIA — Terrorism Risk Insurance Act.</strong> Requires all commercial insurers to offer terrorism coverage.',
    mem:'"TRIA = Terror Risk Insurance Act." T-R-I-A. Uncle Sam + insurers split the terror tab. Required for commercial lines.'
  },
  {
    topic:'property', topicLabel:'PROPERTY',
    q:'Which coverage in the dwelling policy covers contents damaged by fire?',
    a:'<strong>Coverage C — Personal Property.</strong> Covers contents of an insured dwelling.',
    mem:'"C for Contents." A = Dwelling structure. B = Other structures. C = Contents. D = Loss of use. A-B-C-D, building out from the structure.'
  },
  {
    topic:'auto', topicLabel:'AUTO',
    q:'Medical payments in a personal auto policy covers all EXCEPT: Insured hit by car crossing street / Insured exiting friend\'s mobile home / Friend driving insured\'s car with permission / Insured\'s child injured when car rolls',
    a:'<strong>A friend driving the insured\'s vehicle with permission is NOT covered by med pay.</strong> Med pay covers the insured and passengers — not other drivers. That\'s what liability covers.',
    mem:'"Med pay = YOU and your riders, not the driver of your car." The friend who borrowed the car? Liability pays if there\'s an injury. Med pay only covers riders and the insured.'
  },
  {
    topic:'auto', topicLabel:'AUTO',
    q:'Driver A (left turn on red) = 80% at fault. Driver B (speeding) = 20% at fault. Under comparative negligence, how much can Driver B collect?',
    a:'<strong>80% of damages.</strong> Under comparative negligence, you recover based on the OTHER party\'s percentage of fault.',
    mem:'"You collect what THEY owe." B is 20% at fault, so B collects 100% − 20% = 80% of damages from A. Your fault reduces your recovery.'
  },
  {
    topic:'workers', topicLabel:'WORKERS COMP',
    q:'Before workers compensation statutes, what did employees have to do to get compensation for work injuries?',
    a:'<strong>Sue the employer and prove fault.</strong> Very few received any payment — the system heavily favored employers.',
    mem:'"Old system = sue and prove or lose." Workers comp was created because the old lawsuit system failed workers. Now it\'s no-fault — you\'re hurt at work, you\'re covered.'
  },
  {
    topic:'property', topicLabel:'PROPERTY',
    q:'What term describes damage where the insured peril is the proximate cause of loss?',
    a:'<strong>Direct loss.</strong> Direct physical damage to buildings/personal property where the covered peril is the proximate (direct) cause.',
    mem:'"Direct = the peril directly caused it." Fire burns the building = direct loss. Hotel bills while displaced = indirect (loss of use).'
  },
  {
    topic:'general', topicLabel:'GENERAL',
    q:'An insurance contract must contain all of the following EXCEPT: Beneficiary\'s consent / Offer & acceptance / Competent parties / Consideration',
    a:'<strong>Beneficiary\'s consent is NOT required.</strong> The 4 elements are: Offer & Acceptance, Consideration, Competent Parties, Legal Purpose.',
    mem:'"OCCP" — Offer, Consideration, Competent parties, Purpose. No beneficiary needed to form the contract. They just receive the benefit.'
  },
  {
    topic:'property', topicLabel:'PROPERTY',
    q:'An insured mows lawn with a borrowed lawnmower. Fuel line ruptures, mower destroyed by fire. How does the HO liability policy respond?',
    a:'<strong>It will cover the damage to the brother\'s mower.</strong> HO liability covers damage to property of others even if the insured is NOT legally liable.',
    mem:'"HO liability = goodwill coverage." Even if it\'s just bad luck (not your fault), HO liability still pays for someone else\'s property you damaged. No fault required.'
  },
  {
    topic:'state', topicLabel:'STATE / FEDERAL',
    q:'What does the Federal Fair Credit Reporting Act regulate?',
    a:'<strong>Consumer reports</strong> (also called consumer investigative reports or credit reports).',
    mem:'"FCRA = Credit Files." Fair Credit = it\'s about your credit/consumer report. Not telemarketing (that\'s TCPA), not money laundering (that\'s BSA). FCRA = reports on YOU.'
  }
];

// ── STATE ──
let current = 0;
let flipped = false;
let scores = new Array(CARDS.length).fill(null); // null=unseen, true=knew, false=missed
let mode = 'flash';

// ── INIT ──
renderCard();
buildListMode();

function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('flashcard-mode').style.display = m==='flash' ? 'block' : 'none';
  document.getElementById('list-mode').style.display = m==='list' ? 'block' : 'none';
  document.getElementById('score-screen').style.display = 'none';
  document.getElementById('progress-txt').style.display = m==='flash' ? 'block' : 'none';
}

function renderCard() {
  if (current >= CARDS.length) { showScore(); return; }
  const c = CARDS[current];
  flipped = false;
  const card = document.getElementById('flashcard');
  card.classList.remove('flipped');

  document.getElementById('card-counter').textContent = `${current+1} / ${CARDS.length}`;
  document.getElementById('progress-txt').textContent = `Card ${current+1} of ${CARDS.length}`;
  document.getElementById('tap-hint').style.display = 'block';
  document.getElementById('got-it-wrap').style.display = 'none';
  document.getElementById('prev-btn').disabled = current === 0;
  document.getElementById('next-btn').textContent = current === CARDS.length - 1 ? 'FINISH' : 'NEXT ▶';

  document.getElementById('card-front').innerHTML = `
    <span class="card-topic topic-${c.topic}">${c.topicLabel}</span>
    <div class="card-face-label">QUESTION</div>
    <div class="card-question">${c.q}</div>
  `;
  document.getElementById('card-back').innerHTML = `
    <span class="card-topic topic-${c.topic}">${c.topicLabel}</span>
    <div class="card-face-label">ANSWER</div>
    <div class="card-answer">${c.a}</div>
    <div class="memory-trick">
      <div class="memory-label">💡 MEMORY TRICK</div>
      <div class="memory-text">${c.mem}</div>
    </div>
  `;
  updateStats();
}

function flipCard() {
  if (flipped) return;
  flipped = true;
  document.getElementById('flashcard').classList.add('flipped');
  document.getElementById('tap-hint').style.display = 'none';
  document.getElementById('got-it-wrap').style.display = 'flex';
}

function markCard(knew) {
  scores[current] = knew;
  updateStats();
  setTimeout(() => { current++; renderCard(); }, 200);
}

function nextCard() {
  if (current >= CARDS.length - 1) { showScore(); return; }
  current++;
  renderCard();
}

function prevCard() {
  if (current <= 0) return;
  current--;
  renderCard();
}

function updateStats() {
  const known = scores.filter(s=>s===true).length;
  const missed = scores.filter(s=>s===false).length;
  const pct = scores.filter(s=>s!==null).length > 0
    ? Math.round(known / scores.filter(s=>s!==null).length * 100) : 0;
  document.getElementById('known-count').textContent = known;
  document.getElementById('missed-count').textContent = missed;
  document.getElementById('pct-count').textContent = pct + '%';
}

function showScore() {
  const known = scores.filter(s=>s===true).length;
  const missed = scores.filter(s=>s===false).length;
  const pct = Math.round(known / CARDS.length * 100);
  document.getElementById('flashcard-mode').style.display = 'none';
  document.getElementById('score-screen').style.display = 'block';
  document.getElementById('score-pct').textContent = pct + '%';
  document.getElementById('final-known').textContent = known;
  document.getElementById('final-missed').textContent = missed;
}

function restart() {
  current = 0;
  scores = new Array(CARDS.length).fill(null);
  flipped = false;
  document.getElementById('score-screen').style.display = 'none';
  document.getElementById('flashcard-mode').style.display = 'block';
  renderCard();
  updateStats();
}

function buildListMode() {
  const topics = [...new Set(CARDS.map(c=>c.topic))];
  let html = '';
  topics.forEach(t => {
    const cards = CARDS.filter(c=>c.topic===t);
    const label = cards[0].topicLabel;
    html += `<div class="topic-header">${label} (${cards.length})</div>`;
    cards.forEach(c => {
      html += `<div class="list-card">
        <div class="list-q">${c.q}</div>
        <div class="list-a">${c.a}</div>
        <div class="list-mem">💡 ${c.mem}</div>
      </div>`;
    });
  });
  document.getElementById('list-mode').innerHTML = html;
}
</script>
</body>
</html>
