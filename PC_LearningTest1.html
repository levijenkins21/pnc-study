<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#090b10;color:#f0f0f0;font-family:'IBM Plex Mono',monospace;min-height:100vh;padding-bottom:60px;}
.header{padding:16px 20px;border-bottom:1px solid #1e2330;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#090b10;z-index:10;}
.h-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;color:#c9a227;}
.h-sub{font-size:7px;letter-spacing:3px;color:#4b5563;margin-top:2px;}
.back-link{color:#6b7280;font-size:8px;letter-spacing:2px;text-decoration:none;}
.back-link:hover{color:#c9a227;}
.stats-bar{display:flex;gap:0;border-bottom:1px solid #1e2330;}
.stat{flex:1;padding:12px 8px;text-align:center;border-right:1px solid #1e2330;}
.stat:last-child{border-right:none;}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:24px;color:#c9a227;line-height:1;}
.stat-lbl{font-size:6px;letter-spacing:2px;color:#4b5563;margin-top:2px;}
.controls{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #1e2330;}
.mode-btns{display:flex;gap:6px;}
.mode-btn{background:#0e1117;border:1px solid #1e2330;color:#6b7280;font-family:'IBM Plex Mono',monospace;font-size:7px;letter-spacing:2px;padding:7px 12px;cursor:pointer;border-radius:2px;transition:all .15s;}
.mode-btn.active{background:#c9a227;border-color:#c9a227;color:#090b10;}
.progress-txt{font-size:8px;letter-spacing:1px;color:#4b5563;}
#flashcard-mode{padding:16px;}
.card-counter{font-size:8px;letter-spacing:2px;color:#4b5563;text-align:center;margin-bottom:12px;}
.flashcard-wrap{perspective:1000px;margin-bottom:12px;cursor:pointer;}
.flashcard{position:relative;width:100%;min-height:220px;transform-style:preserve-3d;transition:transform .45s ease;border-radius:4px;}
.flashcard.flipped{transform:rotateY(180deg);}
.card-face{position:absolute;width:100%;min-height:220px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:4px;padding:20px 18px;display:flex;flex-direction:column;justify-content:center;}
.card-front{background:#0e1117;border:1px solid #1e2330;}
.card-back{background:#0d1a0d;border:1px solid #1e2330;transform:rotateY(180deg);}
.card-face-label{font-size:7px;letter-spacing:3px;color:#4b5563;margin-bottom:10px;}
.card-question{font-size:12px;line-height:1.7;color:#f0f0f0;}
.card-answer{font-size:11px;line-height:1.7;color:#f0f0f0;margin-bottom:10px;}
.card-answer strong{color:#c9a227;}
.memory-trick{background:#0a1a0a;border:1px solid #1a3a1a;border-radius:3px;padding:10px 12px;margin-top:8px;}
.memory-label{font-size:7px;letter-spacing:2px;color:#4b5563;margin-bottom:4px;}
.memory-text{font-size:10px;color:#6fcf6f;line-height:1.6;}
.tap-hint{font-size:7px;letter-spacing:2px;color:#374151;text-align:center;margin-top:6px;}
.card-topic{font-size:7px;letter-spacing:2px;padding:3px 8px;border-radius:2px;display:inline-block;margin-bottom:10px;}
.topic-auto{background:#1a1a2e;color:#818cf8;}
.topic-property{background:#1a1200;color:#f59e0b;}
.topic-liability{background:#1a0d0d;color:#f87171;}
.topic-crime{background:#0d1a1a;color:#34d399;}
.topic-general{background:#1a1a1a;color:#9ca3af;}
.topic-workers{background:#1a0d1a;color:#c084fc;}
.topic-state{background:#0d1020;color:#60a5fa;}
.topic-bop{background:#1a1a0d;color:#fbbf24;}
.nav-btns{display:flex;gap:8px;justify-content:center;}
.nav-btn{background:#0e1117;border:1px solid #1e2330;color:#f0f0f0;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;padding:10px 28px;cursor:pointer;border-radius:2px;transition:all .15s;}
.nav-btn:hover,.nav-btn:active{border-color:#c9a227;color:#c9a227;}
.nav-btn.primary{background:#c9a227;border-color:#c9a227;color:#090b10;}
.nav-btn:disabled{opacity:0.3;cursor:not-allowed;}
.got-it-wrap{display:flex;gap:8px;justify-content:center;margin-top:10px;}
.got-it-btn{font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:2px;padding:8px 20px;border-radius:2px;cursor:pointer;border:1px solid;}
.btn-knew{background:#0d1a0d;border-color:#2d6a2d;color:#6fcf6f;}
.btn-missed{background:#1a0d0d;border-color:#6a2d2d;color:#f87171;}
#list-mode{display:none;padding:14px;}
.list-card{background:#0e1117;border:1px solid #1e2330;border-radius:3px;padding:14px 16px;margin-bottom:8px;}
.list-q{font-size:10px;letter-spacing:1px;color:#9ca3af;margin-bottom:8px;line-height:1.6;}
.list-a{font-size:11px;color:#f0f0f0;margin-bottom:6px;line-height:1.6;}
.list-a strong{color:#c9a227;}
.list-mem{font-size:9px;color:#6fcf6f;border-top:1px solid #1a2a1a;padding-top:8px;margin-top:8px;line-height:1.6;}
.topic-header{font-size:8px;letter-spacing:3px;color:#4b5563;padding:16px 0 8px;border-bottom:1px solid #1e2330;margin-bottom:8px;}
#score-screen{display:none;padding:32px 20px;text-align:center;}
.score-big{font-family:'Bebas Neue',sans-serif;font-size:80px;color:#c9a227;line-height:1;}
.score-label{font-size:9px;letter-spacing:3px;color:#4b5563;margin-bottom:24px;}
.score-breakdown{display:flex;gap:12px;justify-content:center;margin-bottom:28px;}
.score-item{background:#0e1117;border:1px solid #1e2330;padding:14px 20px;border-radius:3px;}
.score-item-val{font-family:'Bebas Neue',sans-serif;font-size:28px;color:#f0f0f0;}
.score-item-lbl{font-size:7px;letter-spacing:2px;color:#4b5563;}
.restart-btn{background:#c9a227;border:none;color:#090b10;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:3px;padding:12px 40px;cursor:pointer;border-radius:2px;}
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="h-title">LEARNING TEST 1</div>
    <div class="h-sub">64 MISSED QUESTIONS · FLASHCARDS + MEMORY TRICKS</div>
  </div>
  <a class="back-link" href="PC_Dashboard.html">← DASHBOARD</a>
</div>

<div class="stats-bar">
  <div class="stat"><div class="stat-val">64</div><div class="stat-lbl">TOTAL</div></div>
  <div class="stat"><div class="stat-val" id="known-count">0</div><div class="stat-lbl">KNEW IT</div></div>
  <div class="stat"><div class="stat-val" id="missed-count">0</div><div class="stat-lbl">MISSED</div></div>
  <div class="stat"><div class="stat-val" id="pct-count">0%</div><div class="stat-lbl">SCORE</div></div>
</div>

<div class="controls">
  <div class="mode-btns">
    <button class="mode-btn active" onclick="setMode('flash',event)">FLASHCARDS</button>
    <button class="mode-btn" onclick="setMode('list',event)">REVIEW ALL</button>
  </div>
  <div class="progress-txt" id="progress-txt">Card 1 of 64</div>
</div>

<div id="flashcard-mode">
  <div class="card-counter" id="card-counter">1 / 46</div>
  <div class="flashcard-wrap" onclick="flipCard()">
    <div class="flashcard" id="flashcard">
      <div class="card-face card-front" id="card-front"></div>
      <div class="card-face card-back" id="card-back"></div>
    </div>
  </div>
  <div class="tap-hint" id="tap-hint">TAP CARD TO REVEAL ANSWER</div>
  <div class="got-it-wrap" id="got-it-wrap" style="display:none;">
    <button class="got-it-btn btn-missed" onclick="markCard(false)">✕ MISSED IT</button>
    <button class="got-it-btn btn-knew" onclick="markCard(true)">✓ KNEW IT</button>
  </div>
  <div class="nav-btns" style="margin-top:14px;">
    <button class="nav-btn" id="prev-btn" onclick="prevCard()" disabled>◀ PREV</button>
    <button class="nav-btn primary" onclick="nextCard()" id="next-btn">NEXT ▶</button>

</div>

<div id="list-mode"></div>

<div id="score-screen">

  <div class="score-label">FINAL SCORE</div>
  <div class="score-breakdown">
    <div class="score-item"><div class="score-item-val" id="final-known">0</div><div class="score-item-lbl">KNEW IT</div></div>
    <div class="score-item"><div class="score-item-val" id="final-missed">0</div><div class="score-item-lbl">STILL LEARNING</div></div>
  </div>
  <button class="restart-btn" onclick="restart()">REVIEW AGAIN</button>
</div>

<script>
const CARDS = [
  // ── GENERAL ──
  {topic:'general',topicLabel:'GENERAL',
   q:'What are common carriers and who do they serve?',
   a:'<strong>Common carriers transport the property of anyone who hires them.</strong> Open to the public — cannot refuse.',
   mem:'"Common" = open to the common public. Like a taxi that can\'t refuse a fare.'},
  {topic:'general',topicLabel:'GENERAL',
   q:'What is it called when an in-force policy is terminated before the expiration date?',
   a:'<strong>Cancellation.</strong> Can be by insured or insurer, voluntary or involuntary.',
   mem:'"Cancel = Cut before the end." Nonrenewal = at expiration. Rescission = void from start. Cancellation = cut short.'},
  {topic:'general',topicLabel:'GENERAL',
   q:'Which would modify the original insurance contract by adding or removing coverage?',
   a:'<strong>Endorsements.</strong> Change original terms, conditions, or coverages. Can add, delete, or correct.',
   mem:'"Endorse = Modify." Conditions are rules; endorsements are edits.'},
  {topic:'general',topicLabel:'GENERAL',
   q:'A legal contract must contain all of the following EXCEPT: Beneficiary\'s consent / Offer & acceptance / Competent parties / Consideration',
   a:'<strong>Beneficiary\'s consent is NOT required.</strong> The 4 elements: Offer & Acceptance, Consideration, Competent Parties, Legal Purpose.',
   mem:'"OCCP" — Offer, Consideration, Competent parties, Purpose. No beneficiary needed to form the contract.'},
  {topic:'general',topicLabel:'GENERAL',
   q:'Which act created a federal program sharing terrorist attack risk with the insurance industry?',
   a:'<strong>TRIA — Terrorism Risk Insurance Act.</strong> Requires all commercial insurers to offer terrorism coverage.',
   mem:'"TRIA = Terror Risk Insurance Act." Uncle Sam + insurers split the terror tab.'},
  {topic:'general',topicLabel:'GENERAL',
   q:'What does the Federal Fair Credit Reporting Act regulate?',
   a:'<strong>Consumer reports</strong> (also called consumer investigative reports or credit reports).',
   mem:'"FCRA = Credit Files." Not telemarketing (TCPA), not money laundering (BSA). FCRA = reports on YOU.'},
  {topic:'general',topicLabel:'GENERAL',
   q:'The part of the policy describing covered perils and the nature of coverage is called the:',
   a:'<strong>Insuring agreement.</strong> Describes the insured perils and method of indemnification.',
   mem:'"Insuring agreement = what we\'re insuring and how we pay." Declarations = who/what/when/how much. Conditions = rules. Exclusions = what\'s out.'},
  {topic:'general',topicLabel:'GENERAL',
   q:'Which is NOT a condition in an insurance policy? Cancellation/nonrenewal / Appraisal / Insuring agreement / Subrogation',
   a:'<strong>Insuring agreement is NOT a condition.</strong> It\'s a separate section of the policy. Conditions state legal obligations and duties.',
   mem:'"Insuring agreement gives coverage. Conditions give rules." They\'re different sections — don\'t mix them up.'},

  // ── LIABILITY ──
  {topic:'liability',topicLabel:'LIABILITY',
   q:'What is vicarious liability?',
   a:'<strong>Liability imposed on one party due to the actions of another person.</strong> Ex: employer/employee, parent/child.',
   mem:'"VICarious = liability VIA someone else." You\'re on the hook for what THEY did.'},
  {topic:'liability',topicLabel:'LIABILITY',
   q:'A store employee wrongfully detained the meter reader thinking he was shoplifting. What coverage applies?',
   a:'<strong>Personal and advertising injury liability.</strong> Covers false arrest/detention — damage to a person\'s character.',
   mem:'"False arrest = character damage = Personal Injury Liability." Not bodily injury, not crime. It\'s about reputation harm.'},
  {topic:'liability',topicLabel:'LIABILITY',
   q:'Which statement about strict liability is NOT correct? A) Imposed for hazardous activities B) Claimants may need proof a defect caused injury C) Applied in product liability D) Imposed regardless of fault',
   a:'<strong>B is NOT correct in the way implied.</strong> Strict liability removes the need to prove negligence — but causation (defect caused the harm) must still be shown.',
   mem:'"Strict = no fault needed, but causation always counts." You don\'t prove carelessness; you still prove the defect caused harm.'},
  {topic:'liability',topicLabel:'LIABILITY',
   q:'A cereal company shipped product in faulty containers causing spoilage and illness. What type of claim?',
   a:'<strong>Product liability claim.</strong> Covers legal liability of a manufacturer/merchant/distributor due to injury from a covered product.',
   mem:'"Made it, sold it, you\'re on the hook." Product liability — regardless of how careful you were in making it.'},
  {topic:'liability',topicLabel:'LIABILITY',
   q:'What does professional liability coverage protect against?',
   a:'<strong>Errors and omissions.</strong> Covers liability from failure to use due care and skill expected in a profession.',
   mem:'"E&O = Errors and Omissions = Professional Liability." Doctors call it malpractice. Everyone else calls it E&O.'},
  {topic:'liability',topicLabel:'LIABILITY',
   q:'CGL Coverage A (BI & PD) will cover which of the following? Liquor liability / Insured\'s negligence / Contractual liability / Damage to insured\'s product',
   a:'<strong>Losses due to the insured\'s negligence.</strong> The others (liquor liability, contractual liability, damage to own product) are exclusions.',
   mem:'"Coverage A = your negligence caused someone else harm." Your product, your contract, your liquor = all excluded.'},
  {topic:'liability',topicLabel:'LIABILITY',
   q:'CGL supplementary payments cover all EXCEPT: $500/day lost earnings + $2,000 bail bonds / Pre & post judgment interest / Bonds to release attachment / $100 gasoline driving witness to court',
   a:'<strong>$500/day for lost earnings and $2,000 bail bonds are wrong.</strong> Actual limits: $250/day lost earnings, $250 for bail bonds.',
   mem:'"$250, not $500. $250, not $2,000." Supplementary payments are modest. Everything else listed IS covered.'},

  // ── AUTO ──
  {topic:'auto',topicLabel:'AUTO',
   q:'Auto policy 25/50/15. Accident: A=$15k, B=$30k, C=$35k injured. Total insurer pays?',
   a:'<strong>$50,000.</strong> A=$15k (under limit). B=$25k (capped at per-person limit). C=$10k (only $10k left of $50k total).',
   mem:'"Per-person cap first, then per-accident cap." 25 per person, 50 total. Stop when you hit either ceiling.'},
  {topic:'auto',topicLabel:'AUTO',
   q:'Theft transportation expenses in a personal auto policy begin how many hours after theft?',
   a:'<strong>48 hours</strong> after the theft.',
   mem:'"2 days before the rental clock starts." 48 hours = 2 days.'},
  {topic:'auto',topicLabel:'AUTO',
   q:'Transportation expense coverage in a PAP: how much per day, what\'s the maximum?',
   a:'<strong>$20 per day, max $600</strong> (up to 30 days following theft).',
   mem:'"$20 × 30 days = $600." Easy math. Lock in $20/$600.'},
  {topic:'auto',topicLabel:'AUTO',
   q:'To assign a property insurance policy, whose written consent is required?',
   a:'<strong>The insurer\'s written consent.</strong>',
   mem:'"The company holds the keys." You can\'t hand off the policy without the insurer\'s blessing.'},
  {topic:'auto',topicLabel:'AUTO',
   q:'In a commercial auto policy, where is the policy period found?',
   a:'<strong>The Conditions section.</strong> Defines policy period, territory, and how coverage applies.',
   mem:'"Conditions = rules of the game, including when and where." Period = Conditions.'},
  {topic:'auto',topicLabel:'AUTO',
   q:'Medical payments in a PAP covers all EXCEPT: Insured hit by car crossing street / Insured exiting friend\'s mobile home / Friend driving insured\'s car with permission / Insured\'s child injured when car rolls',
   a:'<strong>A friend driving the insured\'s vehicle is NOT covered by med pay.</strong> Med pay = insured and passengers only. Other drivers = liability coverage.',
   mem:'"Med pay = YOU and your riders." The person borrowing your car? That\'s a liability situation, not med pay.'},
  {topic:'auto',topicLabel:'AUTO',
   q:'Driver A (left turn on red, 80% at fault) hits Driver B (speeding, 20% at fault). How much can B collect under comparative negligence?',
   a:'<strong>80% of damages.</strong> You recover based on the OTHER party\'s percentage of fault.',
   mem:'"You collect what THEY owe." B is 20% at fault → collects 80%. Your fault % reduces your recovery.'},
  {topic:'auto',topicLabel:'AUTO',
   q:'A $500k liability limit applies to the total of BI and PD combined from one accident. What type of limit is this?',
   a:'<strong>Combined single limit.</strong> One dollar amount covers both bodily injury and property damage together.',
   mem:'"Combined Single = one pot for everything." Split limit = separate buckets for BI per person / BI total / PD.'},

  // ── PROPERTY ──
  {topic:'property',topicLabel:'PROPERTY',
   q:'Which coverage in dwelling/homeowners policies covers indirect losses?',
   a:'<strong>Loss of Use.</strong> Only kicks in after a direct covered loss has occurred.',
   mem:'"Direct hits the house. Indirect hits your wallet." Loss of use = hotel bills, extra expenses.'},
  {topic:'property',topicLabel:'PROPERTY',
   q:'Which is NOT covered by the condo unit owners endorsement? Appliances / Alterations / Fixtures / Furniture',
   a:'<strong>Furniture is NOT covered.</strong> Covers Alterations, Appliances, Fixtures that are part of the building.',
   mem:'"AAF in, Furniture out." Alterations, Appliances, Fixtures are attached to the building. Furniture walks out the door.'},
  {topic:'property',topicLabel:'PROPERTY',
   q:'Which is NOT settled on ACV basis under business property coverage? Manuscripts / Property of others / Valuable papers & records / Works of art',
   a:'<strong>Valuable papers and records.</strong> Valued at cost of blank materials + labor to copy — NOT replacement cost minus depreciation.',
   mem:'"Papers aren\'t appraised — they\'re reprinted." Blank paper + labor. Everything else = ACV.'},
  {topic:'property',topicLabel:'PROPERTY',
   q:'Homeowners covers collapse caused by all EXCEPT: Weight of too many people / Foundation cracks / Hidden insect damage / Weight of snow',
   a:'<strong>Foundation cracks NOT covered.</strong> Collapse must be sudden and unexpected. Cracks develop over years.',
   mem:'"Sudden = covered. Slow = not." Cracks are slow. Snow, bugs, too many people = sudden.'},
  {topic:'property',topicLabel:'PROPERTY',
   q:'How is Actual Cash Value (ACV) defined in property insurance?',
   a:'<strong>Replacement cost at time of loss, minus depreciation.</strong>',
   mem:'"ACV = RC − D." Replace it today, subtract the age discount.'},
  {topic:'property',topicLabel:'PROPERTY',
   q:'$100k house, 80% coinsurance required, $60k coverage, $40k fire loss. How much does owner collect?',
   a:'<strong>$30,000.</strong> Need $80k, have $60k = 75%. 75% × $40k = $30,000.',
   mem:'"Coinsurance: Have ÷ Need × Loss." 60÷80×40,000 = $30k. Underinsure = you eat the gap.'},
  {topic:'property',topicLabel:'PROPERTY',
   q:'Which coverage in the dwelling policy covers contents damaged by fire?',
   a:'<strong>Coverage C — Personal Property.</strong>',
   mem:'"C for Contents." A=Dwelling, B=Other structures, C=Contents, D=Loss of use.'},
  {topic:'property',topicLabel:'PROPERTY',
   q:'Insured mows lawn with borrowed lawnmower. Fuel line ruptures, mower destroyed by fire. How does HO liability respond?',
   a:'<strong>It will cover the damage to the brother\'s mower.</strong> HO liability covers damage to property of others even if the insured is NOT legally liable.',
   mem:'"HO liability = goodwill coverage." Even if it\'s not your fault, HO liability still pays for others\' property you damaged.'},
  {topic:'property',topicLabel:'PROPERTY',
   q:'What type of property valuation pays the full value as specified on the policy regardless of appreciation or depreciation?',
   a:'<strong>Agreed value.</strong> Insurer and insured agree on value at policy inception. That\'s what\'s paid at loss, no questions asked.',
   mem:'"Agreed = locked in." Both sides agree upfront. No depreciation argument. No appraisal fight. Agreed = done.'},
  {topic:'property',topicLabel:'PROPERTY',
   q:'HO-3 vs HO-5 contents coverage: what\'s the difference?',
   a:'<strong>HO-5 = open peril for contents. HO-3 = named peril for contents.</strong> Replacement cost requires an endorsement on either form.',
   mem:'"HO-5 is the Rolls Royce — open peril on structure AND contents." HO-3 is open peril on structure only, named peril on contents.'},
  {topic:'property',topicLabel:'PROPERTY',
   q:'Replacement cost coverage in broad and special form dwelling policies requires what?',
   a:'<strong>Insurance on the dwelling must be at least 80% of its replacement cost at the time of loss.</strong>',
   mem:'"80% at time of loss." Not when written — AT THE TIME OF LOSS. Keep coverage current as values go up.'},
  {topic:'property',topicLabel:'PROPERTY',
   q:'A neighbor\'s tree falls in the insured\'s yard. When will the HO policy pay to remove it?',
   a:'<strong>If the tree is blocking the driveway</strong> (or a handicapped ramp), or if it caused damage to a covered structure. Up to $1,000.',
   mem:'"Blocking the driveway = covered." If it\'s just lying in the yard doing nothing, no coverage. It has to be blocking or damaging.'},
  {topic:'property',topicLabel:'PROPERTY',
   q:'Special form dwelling, $100k Coverage A. Fire: $75k dwelling, $15k garage, 10 trees × $600. How much for trees?',
   a:'<strong>$5,000.</strong> Trees capped at $500 per tree AND max 5% of Coverage A ($100k × 5% = $5,000). 10 trees × $500 = $5,000 (not $6,000).',
   mem:'"Trees: $500 each, 5% of A total." Two caps, both apply. $500/tree AND 5% of Coverage A — use whichever runs out first.'},
  {topic:'property',topicLabel:'PROPERTY',
   q:'Windstorm blocks insured\'s driveway with 2 of insured\'s trees and 2 neighbor\'s trees. 3 trees at $300, 1 tree at $600. How much does insurer pay?',
   a:'<strong>$1,000.</strong> The policy has a $1,000 maximum for tree removal. 3×$300 + 1×$600 = $1,500, but capped at $1,000.',
   mem:'"$1,000 max for tree removal, period." Doesn\'t matter whose trees or how many. Hit $1,000, stop.'},
  {topic:'property',topicLabel:'PROPERTY',
   q:'What term describes direct physical damage where the insured peril is the proximate cause of loss?',
   a:'<strong>Direct loss.</strong> The covered peril directly and physically caused the damage.',
   mem:'"Direct = the peril directly caused it." Fire burns the building = direct. Hotel bills while displaced = indirect.'},
  {topic:'property',topicLabel:'PROPERTY',
   q:'Which coverage in the dwelling policy would provide income protection when an insured RENTAL dwelling is uninhabitable due to a covered loss?',
   a:'<strong>Coverage D — Fair Rental Value.</strong> Pays lost rental income when a covered loss makes the dwelling uninhabitable.',
   mem:'"D for Dollars you\'re not getting from rent." Loss of use for rental income = Coverage D.'},

  // ── CRIME ──
  {topic:'crime',topicLabel:'CRIME',
   q:'A masked man pulls a gun demanding cash from a couple in a parking lot. What crime is this?',
   a:'<strong>Robbery.</strong> Property taken under threat of violence.',
   mem:'"Robbery = Rough (force/threat). Burglary = Breaking in. Larceny = Lifting quietly." Robbery requires a victim present and threatened.'},
  {topic:'crime',topicLabel:'CRIME',
   q:'Employee theft bonds may be written in all forms EXCEPT: Single form / Blanket position / Position schedule / Name schedule',
   a:'<strong>Single form does NOT exist.</strong> Valid forms: Individual, Name Schedule, Position Schedule, Commercial Blanket, Blanket Position.',
   mem:'"I Need People Covered, Broadly" — Individual, Name, Position, Commercial blanket, Blanket position. No "single" form.'},

  // ── WORKERS COMP ──
  {topic:'workers',topicLabel:'WORKERS COMP',
   q:'Before workers compensation statutes, what did employees have to do to be compensated for work injuries?',
   a:'<strong>Sue the employer and prove fault.</strong> Very few received any payment.',
   mem:'"Old system = sue and prove or lose." Workers comp replaced this. Now: injured at work = covered, no fault needed.'},

  // ── BOP / COMMERCIAL ──
  {topic:'bop',topicLabel:'COMMERCIAL / BOP',
   q:'Which is an example of a protective safeguard in a businessowners policy?',
   a:'<strong>Automatic sprinkler system.</strong> Protective safeguards endorsement requires insured to maintain fire alarms, sprinklers, etc. as a condition for coverage.',
   mem:'"Sprinklers, alarms = protective safeguards." Not paperwork — physical systems that reduce loss. Maintain them or lose coverage.'},
  {topic:'bop',topicLabel:'COMMERCIAL / BOP',
   q:'Duties of the insurer in property policy conditions include all EXCEPT: Notify insured of financial difficulty / Pay covered losses / Advance notice of cancellation / Return premiums',
   a:'<strong>Notify insured of financial difficulty is NOT an insurer duty to policyholders.</strong> Insurers report financial conditions to the STATE, not to individual policyholders.',
   mem:'"State monitors the insurer\'s finances, not you." You\'re not entitled to an insurer\'s financial report. The DOI handles that.'},
  {topic:'bop',topicLabel:'COMMERCIAL / BOP',
   q:'Which type of insurance is covered under TRIA? Commercial auto / Workers compensation / Crop insurance / Burglary & theft',
   a:'<strong>Workers compensation is covered under TRIA.</strong> TRIA covers commercial property, liability, excess, workers comp, D&O. Commercial auto, crop, and burglary/theft are excluded.',
   mem:'"TRIA = commercial lines essentials + workers comp." Niche lines like crop and burglary? Not in the terror umbrella.'},
  {topic:'bop',topicLabel:'COMMERCIAL / BOP',
   q:'Which is NOT included in the basic form dwelling policy (DP-1)? Other structures / Dwelling coverage / Loss of fair rental value / Additional living expense',
   a:'<strong>Additional living expense (Coverage E) is NOT in the DP-1.</strong> It\'s automatic only in DP-2 and DP-3. Can be added by endorsement to DP-1.',
   mem:'"DP-1 = bare bones." DP-2 = broad. DP-3 = special. The nicer the form, the more automatic coverages included.'},

  // ── KANSAS STATE LAW ──
  {topic:'state',topicLabel:'KANSAS STATE LAW',
   q:'An excess/surplus lines license permits a producer to do what?',
   a:'<strong>Place insurance risks with unauthorized insurers.</strong> Surplus lines = unauthorized market for risks standard carriers won\'t take.',
   mem:'"Surplus = unauthorized." The whole point of surplus lines is to go outside the admitted market. If it were admitted, you wouldn\'t need the surplus lines license.'},
  {topic:'state',topicLabel:'KANSAS STATE LAW',
   q:'A professional liability policy in force 90+ days may be cancelled for all EXCEPT: Filing of a claim / Nonpayment of premium / Changes in exposure not present at inception / Material misrepresentation',
   a:'<strong>Filing of a claim is NOT grounds for cancellation.</strong> Using your policy as intended cannot be used against you to cancel it.',
   mem:'"Filing a claim ≠ cancellation." You paid for coverage. Using it can\'t be held against you. Nonpayment, misrepresentation, exposure changes — those are legitimate reasons.'},
  {topic:'state',topicLabel:'KANSAS STATE LAW',
   q:'In the context of a producer database maintained by the NAIC, the term "producer" includes which of the following?',
   a:'<strong>Agent.</strong> In the NAIC producer database context, "producer" includes "agent."',
   mem:'"Producer = Agent in the NAIC database." Not insurer, not solicitor. Producer is the umbrella term that includes agents.'},
  {topic:'state',topicLabel:'KANSAS STATE LAW',
   q:'If an insured requests a proof of loss form after fire/tornado damage, the insurer must send it within how many days?',
   a:'<strong>10 days.</strong>',
   mem:'"10 days for proof of loss form." Quick turnaround — insurer can\'t stall. 10 days to get the form to you so you can file.'},
  {topic:'state',topicLabel:'KANSAS STATE LAW',
   q:'Personal lines insurance rates must be filed with the Insurance Department how far in advance?',
   a:'<strong>At least 30 days prior to use.</strong> If disapproved, they may not be used.',
   mem:'"30 days before you use them." File first, wait 30 days, then charge. Department gets a chance to review and disapprove.'},
  {topic:'state',topicLabel:'KANSAS STATE LAW',
   q:'What determines a licensed agent\'s continuing education biennium due date?',
   a:'<strong>Agent\'s year of birth.</strong> Odd birth year = CE due odd years. Even birth year = CE due even years.',
   mem:'"Born odd = study odd years. Born even = study even years." Your birth year locks in your CE cycle for life.'},
  {topic:'state',topicLabel:'KANSAS STATE LAW',
   q:'When an auto policy is cancelled, the insured must be notified of KAIP eligibility EXCEPT when:',
   a:'<strong>The insured requested the cancellation.</strong> Also not required when cancellation is for nonpayment of premium.',
   mem:'"You asked to cancel? You already know you\'re cancelling." KAIP notice is to protect people who didn\'t choose to lose coverage. If you initiated it, no notice needed.'},
  {topic:'state',topicLabel:'KANSAS STATE LAW',
   q:'In Kansas, what would allow an insurer to cancel an auto policy in force more than 50 days?',
   a:'<strong>Conviction of a third moving violation in the past 18 months.</strong> This is grounds for license and insurance suspension.',
   mem:'"Three strikes in 18 months = cancelable." After 50 days, the insurer can\'t cancel for just anything. Three moving violations in 18 months crosses the line.'},
  {topic:'state',topicLabel:'KANSAS STATE LAW',
   q:'Uninsured motorist coverage limits must be what compared to bodily injury liability limits?',
   a:'<strong>The same.</strong> UM coverage limits must equal the BI liability limits on the policy.',
   mem:'"UM = BI. Equal protection." You can\'t offer less UM than BI. You\'re as protected from uninsured drivers as you protect others.'},
  {topic:'state',topicLabel:'KANSAS STATE LAW',
   q:'What is the maximum coverage for a residential dwelling under the Kansas FAIR Plan?',
   a:'<strong>$400,000</strong> (lesser of market value, ACV, or $400,000). Capped to eliminate moral hazard.',
   mem:'"FAIR Plan cap = $400k." Not $500k, not $1M. $400k keeps people from over-insuring a risky property they\'d rather see destroyed.'},
  {topic:'state',topicLabel:'KANSAS STATE LAW',
   q:'Which of the following is NOT false advertising? Using names that disguise a policy / Stating dividends are not guaranteed / Representing a policy as stock / Misrepresenting policy terms',
   a:'<strong>Stating that dividends are not guaranteed is NOT false advertising</strong> — it\'s a truthful, required disclosure.',
   mem:'"Saying dividends aren\'t guaranteed = honest." Everything else is deception. True statements are never false advertising.'},
  {topic:'state',topicLabel:'KANSAS STATE LAW',
   q:'All P&C insurers admitted in Kansas must do what as a condition of their certificate of authority?',
   a:'<strong>Maintain membership in the Kansas Insurance Guaranty Association.</strong>',
   mem:'"Admitted in Kansas = Guaranty Association member. No exceptions." The Guaranty Association protects policyholders if an insurer fails — every admitted insurer must participate.'},
  {topic:'state',topicLabel:'KANSAS STATE LAW',
   q:'Which would NOT be a legal reason for nonrenewal of a personal auto policy in Kansas?',
   a:'<strong>Filing two or more physical damage claims during the policy period.</strong> Claims alone cannot trigger nonrenewal — excessive claims may require higher deductible or surcharge instead.',
   mem:'"Filing claims ≠ nonrenewal." You can\'t lose coverage just for using it. Nonrenewal requires things like moving violations, license loss, or insurer leaving the state.'},
  {topic:'state',topicLabel:'KANSAS STATE LAW',
   q:'What is the FAIR Plan limit for theft coverage on personal property?',
   a:'<strong>$10,000 maximum</strong> for theft of personal property.',
   mem:'"FAIR Plan theft = $10k max." The FAIR Plan is bare-bones. $10k is the ceiling on theft — no more.'},
  {topic:'state',topicLabel:'KANSAS STATE LAW',
   q:'An agent can\'t meet CE requirements due to military service. What can they do?',
   a:'<strong>Request a waiver from the Commissioner.</strong> Military service and other extenuating circumstances qualify for a CE waiver.',
   mem:'"Military = waiver available." You served the country — you get flexibility on CE. Request it from the Commissioner, don\'t just let the license lapse.'},
  {topic:'state',topicLabel:'KANSAS STATE LAW',
   q:'If an applicant can\'t get auto insurance from a standard carrier, where can they apply?',
   a:'<strong>Kansas Automobile Insurance Plan (KAIP).</strong> The assigned risk plan — provides basic auto coverage only.',
   mem:'"Can\'t get standard? KAIP it." Kansas Automobile Insurance Plan = last resort assigned risk pool. Basic coverage only, no frills.'},
  {topic:'state',topicLabel:'KANSAS STATE LAW',
   q:'In an insurance transaction, who is the principal?',
   a:'<strong>The insurer.</strong> The insurer is the principal — the company that issues the policy.',
   mem:'"Principal = the insurer." The agent acts ON BEHALF of the insurer (the principal). Agent = agent. Insurer = principal. Basic agency law.'},
  {topic:'state',topicLabel:'KANSAS STATE LAW',
   q:'Completing an approved motor vehicle accident prevention course entitles the insured to a premium discount for how long?',
   a:'<strong>3 years</strong> following completion of the course.',
   mem:'"Defensive driving = 3-year discount." Not 1, not 2 — 3 years. Take the course, lock in savings for 3 years.'},
  {topic:'general',topicLabel:'GENERAL',
   q:'Which provides coverage on property involved in shipping on navigable waters?',
   a:'<strong>Marine insurance.</strong> Covers property in shipping and transportation on navigable waters.',
   mem:'"Marine = water." Inland marine = land/transit. Ocean/navigable waters = Marine. The name tells you where it goes.'}
];

let current=0, flipped=false, scores=new Array(CARDS.length).fill(null), mode='flash';
const TOTAL=CARDS.length;

renderCard();
buildListMode();

function setMode(m,e){
  mode=m;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  if(e&&e.target)e.target.classList.add('active');
  document.getElementById('flashcard-mode').style.display=m==='flash'?'block':'none';
  document.getElementById('list-mode').style.display=m==='list'?'block':'none';
  document.getElementById('score-screen').style.display='none';
  document.getElementById('progress-txt').style.display=m==='flash'?'block':'none';
}

function renderCard(){
  if(current>=CARDS.length){showScore();return;}
  const c=CARDS[current];
  flipped=false;
  document.getElementById('flashcard').classList.remove('flipped');
  document.getElementById('card-counter').textContent=`${current+1} / ${CARDS.length}`;
  document.getElementById('progress-txt').textContent=`Card ${current+1} of ${CARDS.length}`;
  document.getElementById('tap-hint').style.display='block';
  document.getElementById('got-it-wrap').style.display='none';
  document.getElementById('prev-btn').disabled=current===0;
  document.getElementById('next-btn').textContent=current===CARDS.length-1?'FINISH':'NEXT ▶';
  document.getElementById('card-front').innerHTML=`<span class="card-topic topic-${c.topic}">${c.topicLabel}</span><div class="card-face-label">QUESTION</div><div class="card-question">${c.q}</div>`;
  document.getElementById('card-back').innerHTML=`<span class="card-topic topic-${c.topic}">${c.topicLabel}</span><div class="card-face-label">ANSWER</div><div class="card-answer">${c.a}</div><div class="memory-trick"><div class="memory-label">💡 MEMORY TRICK</div><div class="memory-text">${c.mem}</div></div>`;
  updateStats();
}

function flipCard(){
  if(flipped)return;
  flipped=true;
  document.getElementById('flashcard').classList.add('flipped');
  document.getElementById('tap-hint').style.display='none';
  document.getElementById('got-it-wrap').style.display='flex';
}

function markCard(knew){
  scores[current]=knew;
  updateStats();
  setTimeout(()=>{current++;renderCard();},200);
}

function nextCard(){
  if(current>=CARDS.length-1){showScore();return;}
  current++;renderCard();
}

function prevCard(){
  if(current<=0)return;
  current--;renderCard();
}

function updateStats(){
  const known=scores.filter(s=>s===true).length;
  const missed=scores.filter(s=>s===false).length;
  const seen=scores.filter(s=>s!==null).length;
  const pct=seen>0?Math.round(known/seen*100):0;
  document.getElementById('known-count').textContent=known;
  document.getElementById('missed-count').textContent=missed;
  document.getElementById('pct-count').textContent=pct+'%';
}

function showScore(){
  const known=scores.filter(s=>s===true).length;
  const missed=scores.filter(s=>s===false).length;
  const pct=Math.round(known/CARDS.length*100);
  document.getElementById('flashcard-mode').style.display='none';
  document.getElementById('score-screen').style.display='block';
  document.getElementById('score-pct').textContent=pct+'%';
  document.getElementById('final-known').textContent=known;
  document.getElementById('final-missed').textContent=missed;
}

function restart(){
  current=0;scores=new Array(CARDS.length).fill(null);flipped=false;
  document.getElementById('score-screen').style.display='none';
  document.getElementById('flashcard-mode').style.display='block';
  renderCard();updateStats();
}

function buildListMode(){
  const topics=[...new Set(CARDS.map(c=>c.topic))];
  let html='';
  topics.forEach(t=>{
    const cards=CARDS.filter(c=>c.topic===t);
    html+=`<div class="topic-header">${cards[0].topicLabel} (${cards.length})</div>`;
    cards.forEach(c=>{
      html+=`<div class="list-card"><div class="list-q">${c.q}</div><div class="list-a">${c.a}</div><div class="list-mem">💡 ${c.mem}</div></div>`;
    });
  });
  document.getElementById('list-mode').innerHTML=html;
}
</script>
</body>
</html>
