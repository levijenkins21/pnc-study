<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P&C — Ch8: Uninsured & Underinsured Motorists</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e2e2e2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem}
  .deck{width:100%;max-width:680px}
  .progress-bar{width:100%;height:3px;background:#1a1a1a;border-radius:2px;margin-bottom:1.5rem}
  .progress-fill{height:3px;background:#5b8dee;border-radius:2px;transition:width .4s ease}
  .card{background:#141414;border:1px solid #222;border-radius:20px;padding:2.2rem 2rem;min-height:340px;display:flex;flex-direction:column;justify-content:center;margin-bottom:1.2rem;position:relative}
  .card-label{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:#5b8dee;margin-bottom:.6rem}
  .card-title{font-size:20px;font-weight:700;color:#fff;margin-bottom:.9rem;line-height:1.25}
  .card-body{font-size:14px;color:#aaa;line-height:1.75}
  .card-body strong{color:#e2e2e2;font-weight:600}
  .card-body p+p{margin-top:.7rem}
  .info-grid{display:flex;flex-direction:column;gap:8px;margin-top:.6rem}
  .info-row{background:#1a1a1a;border:1px solid #242424;border-radius:10px;padding:10px 13px}
  .info-label{font-size:11px;font-weight:600;color:#5b8dee;letter-spacing:.5px;margin-bottom:2px;text-transform:uppercase}
  .info-val{font-size:13px;color:#bbb;line-height:1.5}
  .know-box{background:#1c1500;border:2px solid #c8a84b;border-radius:10px;padding:12px 14px;margin-top:.8rem}
  .know-label{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#c8a84b;margin-bottom:5px}
  .know-box p{font-size:13px;color:#f0d080;line-height:1.55}
  .num-card{background:#0d1a2e;border:1px solid #1e3a6e;border-radius:10px;padding:11px 13px;display:flex;align-items:center;gap:12px}
  .num-big{font-size:22px;font-weight:700;color:#5b8dee;flex-shrink:0;min-width:80px;text-align:center;line-height:1.1}
  .num-desc{font-size:13px;color:#aaa;line-height:1.45}
  .num-desc strong{color:#e2e2e2}
  .red-item{background:#1a0a0a;border:1px solid #2e1a1a;border-radius:9px;padding:9px 13px;margin-bottom:6px;font-size:13px;color:#b07070;line-height:1.45}
  .red-item strong{color:#e2e2e2}
  ul.bullet{padding-left:1.1rem;display:flex;flex-direction:column;gap:5px;margin-top:.4rem}
  ul.bullet li{font-size:13px;color:#999;line-height:1.45}
  ul.bullet li strong{color:#ddd}
  .slide-num{position:absolute;top:1.1rem;right:1.4rem;font-size:11px;color:#333}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .nav-btn{padding:11px 28px;font-size:14px;font-weight:500;cursor:pointer;border-radius:10px;border:1px solid #2a2a2a;background:#1a1a1a;color:#e2e2e2;transition:background .15s}
  .nav-btn:hover{background:#252525}
  .nav-btn:disabled{opacity:.3;cursor:default}
  .nav-btn.primary{background:#0d1a2e;border-color:#1e3a6e;color:#5b8dee}
  .nav-btn.primary:hover{background:#112244}
  .counter{font-size:12px;color:#444;text-align:center;flex:1}
</style>
</head>
<body>
<div class="deck">
  <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>
  <div class="card" id="card">
    <div class="slide-num" id="slideNum"></div>
    <div id="content"></div>
  </div>
  <div class="nav">
    <button class="nav-btn" id="prevBtn" onclick="go(-1)">← Back</button>
    <span class="counter" id="counter"></span>
    <button class="nav-btn primary" id="nextBtn" onclick="go(1)">Next →</button>
  </div>
</div>
<a href="PC_Dashboard.html" style="position:fixed;bottom:16px;left:16px;padding:8px 16px;background:#141414;border:1px solid #2a2a2a;border-radius:8px;color:#888;font-size:12px;font-family:-apple-system,sans-serif;text-decoration:none;z-index:999">← Home</a>

<script>
const SLIDES = [
  {
    label: "Chapter 8 · Uninsured Motorist Coverage",
    title: "What Is UM Coverage?",
    body: `<p>Uninsured motorist (UM) coverage entitles the insured to collect under <strong>their own policy</strong> for bodily injuries they would be entitled to recover from an owner or operator who <strong>does not carry required insurance</strong>.</p>
<div class="info-grid" style="margin-top:.8rem">
  <div class="info-row"><div class="info-label">Required in Kansas</div><div class="info-val">All policies insuring bodily injury liability in Kansas <strong>must also include UM coverage</strong>.</div></div>
  <div class="info-row"><div class="info-label">Limit Requirement</div><div class="info-val">The UM limit must be <strong>equal to the bodily injury liability limit</strong> on the policy.</div></div>
  <div class="info-row"><div class="info-label">Insolvent Insurer Counts</div><div class="info-val">An "uninsured motor vehicle" includes an insured vehicle where the <strong>liability insurer is unable to pay due to insolvency</strong>.</div></div>
</div>`
  },
  {
    label: "Chapter 8 · UM Exclusions",
    title: "When UM Coverage May Be Excluded or Limited",
    body: `<p>An insurer may exclude or limit UM coverage when:</p>
<div style="margin-top:.6rem">
  <div class="red-item"><strong>1.</strong> The insured occupies or is struck by an <strong>uninsured vehicle owned or provided for the insured's regular use</strong></div>
  <div class="red-item"><strong>2.</strong> The uninsured vehicle is owned by a <strong>self-insurer or government entity</strong></div>
  <div class="red-item"><strong>3.</strong> There is <strong>no reliable evidence of physical contact</strong> with an uninsured vehicle</div>
  <div class="red-item"><strong>4.</strong> <strong>Workers Compensation benefits</strong> would apply</div>
  <div class="red-item"><strong>5.</strong> A suit is brought against the uninsured motorist <strong>without notice to the insurer</strong></div>
  <div class="red-item"><strong>6.</strong> <strong>Personal injury (PIP) benefits</strong> would apply</div>
</div>`
  },
  {
    label: "Chapter 8 · Underinsured Motorist Coverage",
    title: "Underinsured Motorist (UIM) Coverage",
    body: `<p>UM coverage <strong>must also include underinsured motorist coverage</strong>. UIM provides compensation when an insured is injured by a motorist who has insurance but with <strong>limits less than the insured's own</strong> or insufficient to cover the injuries.</p>
<div class="info-grid" style="margin-top:.8rem">
  <div class="info-row"><div class="info-label">Right to Reject</div><div class="info-val">The insured may <strong>reject UM/UIM coverage in writing</strong>.</div></div>
</div>
<div class="know-box"><div class="know-label">Know This</div><p>UIM kicks in when the at-fault driver <strong>has insurance but not enough</strong>. UM kicks in when they have <strong>no insurance at all</strong> (or their insurer is insolvent). Both are required in Kansas unless the insured rejects in writing.</p></div>`
  },
  {
    label: "Chapter 8 · UIM Settlement Process",
    title: "Settling an Underinsured Motorist Claim",
    body: `<p>When an agreement to settle for the underinsured motorist's <strong>liability limits</strong> is reached:</p>
<div class="info-grid" style="margin-top:.8rem">
  <div class="info-row"><div class="info-label">Written Notice Required</div><div class="info-val">The insured must provide <strong>written notice</strong> to the UIM coverage insurer. Notice must include:<br>• Copies of all <strong>medical bills</strong><br>• Written authorization or a <strong>court order</strong> to obtain reports from employers and medical providers</div></div>
  <div class="num-card"><div class="num-big">60 days</div><div class="num-desc">The UIM insurer must <strong>pay the settlement amount within 60 days</strong> of receiving written notice.</div></div>
  <div class="info-row"><div class="info-label">Subrogation</div><div class="info-val">If the settlement is <strong>not paid to the insured</strong>, the insurer has <strong>no right of subrogation</strong>.</div></div>
</div>`
  }
];

let cur = 0;
function render() {
  const s = SLIDES[cur];
  document.getElementById('content').innerHTML =
    `<div class="card-label">${s.label}</div><div class="card-title">${s.title}</div><div class="card-body">${s.body}</div>`;
  document.getElementById('fill').style.width = ((cur + 1) / SLIDES.length * 100) + '%';
  document.getElementById('counter').textContent = (cur + 1) + ' of ' + SLIDES.length;
  document.getElementById('slideNum').textContent = (cur + 1) + ' / ' + SLIDES.length;
  document.getElementById('prevBtn').disabled = cur === 0;
  document.getElementById('nextBtn').textContent = cur === SLIDES.length - 1 ? '✓ Done' : 'Next →';
  document.getElementById('nextBtn').onclick = cur === SLIDES.length - 1
    ? () => window.location.href = 'PC_Dashboard.html'
    : () => go(1);
}
function go(dir) { cur = Math.max(0, Math.min(SLIDES.length - 1, cur + dir)); render(); }
render();
</script>
</body>
</html>
