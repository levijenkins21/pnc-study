<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P&C — Ch5: Guaranty Association</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e2e2e2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem}
  .deck{width:100%;max-width:680px}
  .progress-bar{width:100%;height:3px;background:#1a1a1a;border-radius:2px;margin-bottom:1.5rem}
  .progress-fill{height:3px;background:#5b8dee;border-radius:2px;transition:width .4s ease}
  .card{background:#141414;border:1px solid #222;border-radius:20px;padding:2.2rem 2rem;min-height:360px;display:flex;flex-direction:column;justify-content:center;margin-bottom:1.2rem;position:relative}
  .card-label{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:#5b8dee;margin-bottom:.6rem}
  .card-title{font-size:20px;font-weight:700;color:#fff;margin-bottom:.9rem;line-height:1.25}
  .card-body{font-size:14px;color:#aaa;line-height:1.75}
  .card-body strong{color:#e2e2e2;font-weight:600}
  .card-body p+p{margin-top:.7rem}
  .info-grid{display:flex;flex-direction:column;gap:8px;margin-top:.6rem}
  .info-row{background:#1a1a1a;border:1px solid #242424;border-radius:10px;padding:10px 13px}
  .info-label{font-size:11px;font-weight:600;color:#5b8dee;letter-spacing:.5px;margin-bottom:2px;text-transform:uppercase}
  .info-val{font-size:13px;color:#bbb;line-height:1.5}
  .know-this{background:#1c1500;border:2px solid #c8a84b;border-radius:12px;padding:13px 15px;margin-top:.8rem}
  .know-this-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#c8a84b;font-weight:700;margin-bottom:5px}
  .know-this p{font-size:14px;color:#f0d080;line-height:1.6}
  .warn-box{background:#1a1200;border:1px solid #3a2a00;border-radius:10px;padding:11px 13px;margin-top:.8rem}
  .warn-box p{font-size:13px;color:#c8a84b;line-height:1.55}
  .num-card{background:#0d1a2e;border:1px solid #1e3a6e;border-radius:10px;padding:11px 13px;display:flex;align-items:center;gap:12px}
  .num-big{font-size:24px;font-weight:700;color:#5b8dee;flex-shrink:0;min-width:80px;text-align:center;line-height:1.1}
  .num-desc{font-size:13px;color:#aaa;line-height:1.45}
  .num-desc strong{color:#e2e2e2}
  ul.bullet{padding-left:1.1rem;display:flex;flex-direction:column;gap:5px;margin-top:.4rem}
  ul.bullet li{font-size:13px;color:#999;line-height:1.45}
  ul.bullet li strong{color:#ddd}
  .slide-num{position:absolute;top:1.1rem;right:1.4rem;font-size:11px;color:#333}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .nav-btn{padding:11px 28px;font-size:14px;font-weight:500;cursor:pointer;border-radius:10px;border:1px solid #2a2a2a;background:#1a1a1a;color:#e2e2e2;transition:background .15s}
  .nav-btn:hover{background:#252525}
  .nav-btn:disabled{opacity:.3;cursor:default}
  .nav-btn.primary{background:#0d1a2e;border-color:#1e3a6e;color:#5b8dee}
  .nav-btn.primary:hover{background:#112244}
  .counter{font-size:12px;color:#444;text-align:center;flex:1}
</style>
</head>
<body>
<div class="deck">
  <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>
  <div class="card" id="card">
    <div class="slide-num" id="slideNum"></div>
    <div id="content"></div>
  </div>
  <div class="nav">
    <button class="nav-btn" id="prevBtn" onclick="go(-1)">← Back</button>
    <span class="counter" id="counter"></span>
    <button class="nav-btn primary" id="nextBtn" onclick="go(1)">Next →</button>
  </div>
</div>
<a href="PC_Dashboard.html" style="position:fixed;bottom:16px;left:16px;padding:8px 16px;background:#141414;border:1px solid #2a2a2a;border-radius:8px;color:#888;font-size:12px;font-family:-apple-system,sans-serif;text-decoration:none;z-index:999">← Home</a>

<script>
const SLIDES = [
  {
    label: "Chapter 5 · Guaranty Association",
    title: "What Is the Kansas Insurance Guaranty Association?",
    body: `<p>The <strong>Kansas Insurance Guaranty Association</strong> is a <strong>nonprofit legal entity</strong> established to protect policyowners, claimants, and beneficiaries if an insurer becomes insolvent.</p>
<div class="info-grid" style="margin-top:.8rem">
  <div class="info-row"><div class="info-label">Membership</div><div class="info-val">All P&C insurers doing business in Kansas must belong to the Association as a <strong>condition of their authority</strong> to transact insurance in this state — no exceptions.</div></div>
  <div class="info-row"><div class="info-label">Governance</div><div class="info-val">Run by a <strong>board of directors selected by member insurers</strong> and approved by the Commissioner.</div></div>
  <div class="info-row"><div class="info-label">Purpose</div><div class="info-val">Protect Kansas residents from losses caused by insurer insolvencies — pays covered claims when an insurer is declared insolvent and placed into liquidation.</div></div>
</div>`
  },
  {
    label: "Guaranty Association · Coverage",
    title: "When & How Claims Are Paid",
    body: `<div class="info-grid">
  <div class="num-card"><div class="num-big">30 days</div><div class="num-desc">Association pays claims arising within <strong>30 days after the determination</strong> of an insurer's insolvency.</div></div>
  <div class="num-card"><div class="num-big">$300,000</div><div class="num-desc"><strong>Maximum per claim</strong> — the Association will not pay more than $300,000 per covered claim.</div></div>
</div>
<div class="know-this" style="margin-top:.8rem">
  <div class="know-this-label">⚠ Know This</div>
  <p><strong>Workers compensation claims are paid in full</strong> — there is no $300,000 cap for WC. All other covered P&C claims are capped at $300,000.</p>
</div>
<div class="warn-box"><p>📝 The Association will <strong>never pay more</strong> than what the insolvent insurer itself would have owed — it steps into the insurer's shoes, nothing more.</p></div>`
  },
  {
    label: "Guaranty Association · Assessments",
    title: "How the Association Is Funded",
    body: `<p>When the Association needs to pay claims, it <strong>assesses member insurers</strong> for the amounts needed.</p>
<div class="info-grid" style="margin-top:.8rem">
  <div class="num-card"><div class="num-big">30 days</div><div class="num-desc">Each insurer must be notified of their assessment <strong>no later than 30 days before it is due</strong>.</div></div>
  <div class="num-card"><div class="num-big">2%</div><div class="num-desc"><strong>Maximum assessment</strong> — no insurer may be assessed more than <strong>2% of their direct written premiums</strong> in the previous calendar year.</div></div>
</div>`
  },
  {
    label: "Guaranty Association · Restriction",
    title: "One Important Restriction",
    body: `<div class="know-this">
  <div class="know-this-label">⚠ Know This</div>
  <p>The <strong>existence of the Guaranty Association cannot be used in marketing or selling insurance</strong>. Agents may not mention or imply the Association as a selling point to attract customers.</p>
</div>
<div class="warn-box" style="margin-top:.9rem"><p>💡 The Association exists as a safety net — not a sales tool. Using it as a reason to buy from a company is a prohibited practice.</p></div>`
  },
  {
    label: "Numbers to Memorize",
    title: "Guaranty Association — Key Numbers",
    body: `<div class="info-grid">
  <div class="num-card"><div class="num-big">30 days</div><div class="num-desc"><strong>After insolvency determination</strong> — window for claims to arise and be covered by the Association</div></div>
  <div class="num-card"><div class="num-big">$300,000</div><div class="num-desc"><strong>Per claim cap</strong> — maximum the Association will pay on any single covered claim (except WC)</div></div>
  <div class="num-card"><div class="num-big">Full</div><div class="num-desc"><strong>Workers compensation claims</strong> are paid in full — no dollar cap applies</div></div>
  <div class="num-card"><div class="num-big">30 days</div><div class="num-desc"><strong>Assessment notice</strong> — insurers notified no later than 30 days before assessment is due</div></div>
  <div class="num-card"><div class="num-big">2%</div><div class="num-desc"><strong>Assessment cap</strong> — maximum any insurer can be assessed is 2% of prior year direct written premiums</div></div>
</div>`
  }
];

let cur = 0;

function render() {
  const s = SLIDES[cur];
  document.getElementById('content').innerHTML =
    `<div class="card-label">${s.label}</div><div class="card-title">${s.title}</div><div class="card-body">${s.body}</div>`;
  document.getElementById('fill').style.width = ((cur + 1) / SLIDES.length * 100) + '%';
  document.getElementById('counter').textContent = (cur + 1) + ' of ' + SLIDES.length;
  document.getElementById('slideNum').textContent = (cur + 1) + ' / ' + SLIDES.length;
  document.getElementById('prevBtn').disabled = cur === 0;
  document.getElementById('nextBtn').textContent = cur === SLIDES.length - 1 ? '✓ Done' : 'Next →';
  document.getElementById('nextBtn').onclick = cur === SLIDES.length - 1
    ? () => window.location.href = 'PC_Dashboard.html'
    : () => go(1);
}

function go(dir) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, cur + dir));
  render();
}

render();
</script>
</body>
</html>
