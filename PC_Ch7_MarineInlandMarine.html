<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P&C — Ch7: Marine & Inland Marine</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e2e2e2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem}
  .deck{width:100%;max-width:680px}
  .progress-bar{width:100%;height:3px;background:#1a1a1a;border-radius:2px;margin-bottom:1.5rem}
  .progress-fill{height:3px;background:#5b8dee;border-radius:2px;transition:width .4s ease}
  .card{background:#141414;border:1px solid #222;border-radius:20px;padding:2.2rem 2rem;min-height:340px;display:flex;flex-direction:column;justify-content:center;margin-bottom:1.2rem;position:relative}
  .card-label{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:#5b8dee;margin-bottom:.6rem}
  .card-title{font-size:20px;font-weight:700;color:#fff;margin-bottom:.9rem;line-height:1.25}
  .card-body{font-size:14px;color:#aaa;line-height:1.75}
  .card-body strong{color:#e2e2e2;font-weight:600}
  .card-body p+p{margin-top:.7rem}
  .info-grid{display:flex;flex-direction:column;gap:8px;margin-top:.6rem}
  .info-row{background:#1a1a1a;border:1px solid #242424;border-radius:10px;padding:10px 13px}
  .info-label{font-size:11px;font-weight:600;color:#5b8dee;letter-spacing:.5px;margin-bottom:2px;text-transform:uppercase}
  .info-val{font-size:13px;color:#bbb;line-height:1.5}
  .know-box{background:#1c1500;border:2px solid #c8a84b;border-radius:10px;padding:12px 14px;margin-top:.8rem}
  .know-label{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#c8a84b;margin-bottom:5px}
  .know-box p{font-size:13px;color:#f0d080;line-height:1.55}
  .warranty-item{background:#1a1a1a;border:1px solid #242424;border-radius:9px;padding:10px 13px;margin-bottom:6px}
  .warranty-name{font-size:12px;font-weight:700;color:#5b8dee;letter-spacing:.5px;text-transform:uppercase;margin-bottom:3px}
  .warranty-desc{font-size:13px;color:#bbb;line-height:1.45}
  .red-item{background:#1a0a0a;border:1px solid #2e1a1a;border-radius:9px;padding:9px 13px;margin-bottom:6px;font-size:13px;color:#b07070;line-height:1.45}
  .green-item{background:#0a1a0a;border:1px solid #1a2e1a;border-radius:9px;padding:9px 13px;margin-bottom:6px;font-size:13px;color:#70b070;line-height:1.45}
  .slide-num{position:absolute;top:1.1rem;right:1.4rem;font-size:11px;color:#333}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .nav-btn{padding:11px 28px;font-size:14px;font-weight:500;cursor:pointer;border-radius:10px;border:1px solid #2a2a2a;background:#1a1a1a;color:#e2e2e2;transition:background .15s}
  .nav-btn:hover{background:#252525}
  .nav-btn:disabled{opacity:.3;cursor:default}
  .nav-btn.primary{background:#0d1a2e;border-color:#1e3a6e;color:#5b8dee}
  .nav-btn.primary:hover{background:#112244}
  .counter{font-size:12px;color:#444;text-align:center;flex:1}
</style>
</head>
<body>
<div class="deck">
  <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>
  <div class="card" id="card">
    <div class="slide-num" id="slideNum"></div>
    <div id="content"></div>
  </div>
  <div class="nav">
    <button class="nav-btn" id="prevBtn" onclick="go(-1)">← Back</button>
    <span class="counter" id="counter"></span>
    <button class="nav-btn primary" id="nextBtn" onclick="go(1)">Next →</button>
  </div>
</div>
<a href="PC_Dashboard.html" style="position:fixed;bottom:16px;left:16px;padding:8px 16px;background:#141414;border:1px solid #2a2a2a;border-radius:8px;color:#888;font-size:12px;font-family:-apple-system,sans-serif;text-decoration:none;z-index:999">← Home</a>

<script>
const SLIDES = [
  {
    label: "Chapter 7 · Marine & Inland Marine",
    title: "Inland Marine — What It Covers",
    body: `<p><strong>Inland marine</strong> designates coverage designed to protect against loss to property that is <strong>mobile in nature</strong> — primarily while the property is <strong>away from the insured's premises</strong> or <strong>being transported on or over land</strong>.</p>
<div class="info-grid" style="margin-top:.8rem">
  <div class="info-row"><div class="info-label">Origin</div><div class="info-val">The perils stem from <strong>ocean marine contracts</strong>, but the coverage applies to property located on land — not on water.</div></div>
  <div class="info-row"><div class="info-label">The Key Distinction</div><div class="info-val">Coverage focuses on <strong>mobile property away from the premises</strong>. Property sitting at a fixed location (stored merchandise, manufacturing inventory) generally does NOT qualify.</div></div>
</div>`
  },
  {
    label: "Chapter 7 · Marine & Inland Marine",
    title: "Ocean Marine — How It Works",
    body: `<p><strong>Marine insurance</strong> covers property involved in shipping and transportation on <strong>navigable waters</strong>.</p>
<div class="info-grid" style="margin-top:.8rem">
  <div class="info-row"><div class="info-label">No Standard Policy</div><div class="info-val">Each company writes its own version — policies often vary from insured to insured. When a policy is developed specifically to fit the insured's and insurer's needs, it is called a <strong>manuscript policy</strong>.</div></div>
  <div class="info-row"><div class="info-label">Coverage Period</div><div class="info-val">From the <strong>point of origination</strong> of the shipment to the <strong>point of destination</strong> — or when <strong>title passes</strong> from seller to buyer.</div></div>
  <div class="info-row"><div class="info-label">Valuation</div><div class="info-val">Policies are written at <strong>full value</strong>.</div></div>
</div>`
  },
  {
    label: "Ocean Marine · Implied Warranties",
    title: "The Three Implied Warranties",
    body: `<p>Marine policies contain <strong>implied warranties</strong> — if violated, they <strong>void the policy</strong>. These were developed from court decisions and are as binding as written contract terms.</p>
<div style="margin-top:.8rem">
  <div class="warranty-item"><div class="warranty-name">1. Legality</div><div class="warranty-desc">The <strong>cargo must be legal</strong>.</div></div>
  <div class="warranty-item"><div class="warranty-name">2. Seaworthiness</div><div class="warranty-desc">The <strong>ship must be seaworthy</strong> and have a <strong>competent crew</strong>.</div></div>
  <div class="warranty-item"><div class="warranty-name">3. Change in Voyage</div><div class="warranty-desc">The ship must sail the <strong>course filed with the insurer</strong> at underwriting. Exception: the ship <strong>may deviate to avoid a storm</strong> that could damage the ship or cargo.</div></div>
</div>`
  },
  {
    label: "Chapter 7 · Kansas Exclusions",
    title: "What Is NOT Considered Marine or Inland Marine in Kansas",
    body: `<p>The following are <strong>excluded</strong> from marine/inland marine classification in Kansas:</p>
<div style="margin-top:.7rem">
  <div class="red-item">Policies covering <strong>storage of the insured's merchandise</strong></div>
  <div class="red-item">Policies insuring merchandise <strong>while being manufactured</strong> on the manufacturer's premises</div>
  <div class="red-item"><strong>Furniture, fixtures, and building improvements</strong></div>
  <div class="red-item"><strong>Money and securities</strong> stored in a safe, vault, or safety deposit box at a bank or at the insured's premises — <em>except while being transported</em></div>
</div>`
  },
  {
    label: "Chapter 7 · What Can Be Insured",
    title: "Property That Qualifies for Marine Coverage",
    body: `<p>Examples of property that <strong>may be insured</strong> under a marine, inland marine, or transportation policy:</p>
<div style="margin-top:.7rem">
  <div class="green-item"><strong>Imported</strong> or <strong>exported</strong> property</div>
  <div class="green-item"><strong>Domestic shipments</strong></div>
  <div class="green-item"><strong>Instrumentalities of transportation or communication</strong> — bridges, tunnels, wharves, docks, radio and television towers, etc.</div>
  <div class="green-item"><strong>Personal property</strong> — jewelry, furs, wedding gifts, fine arts, coins</div>
  <div class="green-item"><strong>Commercial property</strong> — physicians'/surgeons' equipment, patterns and dies, theatrical property, salesmen's samples</div>
</div>`
  }
];

let cur = 0;
function render() {
  const s = SLIDES[cur];
  document.getElementById('content').innerHTML =
    `<div class="card-label">${s.label}</div><div class="card-title">${s.title}</div><div class="card-body">${s.body}</div>`;
  document.getElementById('fill').style.width = ((cur + 1) / SLIDES.length * 100) + '%';
  document.getElementById('counter').textContent = (cur + 1) + ' of ' + SLIDES.length;
  document.getElementById('slideNum').textContent = (cur + 1) + ' / ' + SLIDES.length;
  document.getElementById('prevBtn').disabled = cur === 0;
  document.getElementById('nextBtn').textContent = cur === SLIDES.length - 1 ? '✓ Done' : 'Next →';
  document.getElementById('nextBtn').onclick = cur === SLIDES.length - 1
    ? () => window.location.href = 'PC_Dashboard.html'
    : () => go(1);
}
function go(dir) { cur = Math.max(0, Math.min(SLIDES.length - 1, cur + dir)); render(); }
render();
</script>
</body>
</html>
