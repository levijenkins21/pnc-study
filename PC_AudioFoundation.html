<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>P&amp;C Audio Foundations · Kansas Exam</title>
  <meta name="theme-color" content="#0d0d1a">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d1a;
      --surface: #13132b;
      --border: #1e1e3a;
      --muted: #3a3a6a;
      --text: #e2e2f2;
      --text-dim: #7070a0;
      --blue: #5b7fff;
      --blue-dim: #2a3a80;
      --green: #3ecf7a;
      --green-dim: #1a4030;
      --orange: #ffaa44;
      --orange-dim: #4a3010;
      --purple: #9b6fff;
      --glow: rgba(91, 127, 255, 0.35);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* ── HEADER ── */
    .header {
      padding: 14px 20px 10px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .header-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .header-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ── COUNTER + PROGRESS ── */
    .counter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px 6px;
      flex-shrink: 0;
    }
    .counter {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-dim);
    }
    .section-badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 20px;
    }
    .progress-track {
      height: 3px;
      background: var(--border);
      margin: 0 20px 0;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--blue-dim), var(--blue));
      border-radius: 3px;
      width: 0%;
      transition: width 0.6s ease;
    }

    /* ── PHASE LABEL ── */
    .phase-label {
      text-align: center;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      padding: 10px 20px 4px;
      min-height: 30px;
      flex-shrink: 0;
      color: var(--muted);
      transition: color 0.3s ease;
    }
    .phase-label.q  { color: var(--blue); }
    .phase-label.a  { color: var(--green); }
    .phase-label.h  { color: var(--orange); }
    .phase-label.done { color: var(--purple); }

    /* ── CARD TEXT ── */
    .card-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 28px;
      text-align: center;
      overflow-y: auto;
    }
    .card-text {
      font-size: 17px;
      line-height: 1.65;
      color: var(--text);
      max-width: 580px;
      transition: opacity 0.25s ease;
    }
    .card-text.fade { opacity: 0.3; }

    /* ── CONTROLS PANEL ── */
    .controls {
      flex-shrink: 0;
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom, 0px));
    }

    /* Speed row */
    .speed-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 18px;
    }
    .speed-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .speed-btn:hover { border-color: var(--muted); color: var(--text); }
    .speed-btn.active {
      background: var(--blue-dim);
      border-color: var(--blue);
      color: var(--blue);
    }

    /* Playback controls */
    .playback-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }
    .skip-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .skip-btn:active { background: var(--border); transform: scale(0.93); }

    .play-btn {
      background: linear-gradient(145deg, #4a6fff, #7b5fff);
      border: none;
      color: #fff;
      width: 84px;
      height: 84px;
      border-radius: 50%;
      font-size: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 28px var(--glow), 0 4px 16px rgba(0,0,0,0.5);
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .play-btn:active { transform: scale(0.94); box-shadow: 0 0 12px var(--glow); }
    .play-btn.done {
      background: linear-gradient(145deg, #2a8050, #3ecf7a);
      box-shadow: 0 0 28px rgba(62, 207, 122, 0.35);
    }

    /* Status */
    .status-row {
      text-align: center;
      padding: 10px 0 0;
      font-size: 12px;
      color: var(--muted);
      min-height: 28px;
    }
    .status-row.active { color: var(--blue); }
    .status-row.done { color: var(--green); font-weight: 600; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-title">Kansas P&amp;C — Foundations Review</div>
    <div class="header-sub">35 cards · Policy structure, coverages, Kansas law · Web Speech</div>
  </div>

  <div class="counter-row">
    <div class="counter" id="counter">Card 1 of 35</div>
    <div class="section-badge" id="sectionBadge">Section 1</div>
  </div>

  <div class="progress-track">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="phase-label" id="phaseLabel">Ready</div>

  <div class="card-area">
    <div class="card-text" id="cardText">Tap ▶ to start your foundations listen-through. 35 cards covering policy structure, coverages, floaters, and Kansas law. Completely hands-free.</div>
  </div>

  <div class="controls">
    <div class="speed-row">
      <button class="speed-btn" onclick="setRate(0.8)">0.8×</button>
      <button class="speed-btn active" id="sp1" onclick="setRate(1)">1×</button>
      <button class="speed-btn" onclick="setRate(1.25)">1.25×</button>
      <button class="speed-btn" onclick="setRate(1.5)">1.5×</button>
    </div>
    <div class="playback-row">
      <button class="skip-btn" onclick="skipBack()" title="Previous card">⏮</button>
      <button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
      <button class="skip-btn" onclick="skipForward()" title="Next card">⏭</button>
    </div>
    <div class="status-row" id="statusRow">Tap play to begin</div>
  </div>

<script>
// ─────────────────────────────────────────────
//  CARD DATA
// ─────────────────────────────────────────────
const cards = [

  // ── SECTION 1: POLICY STRUCTURE ──
  {
    q: "What are the 5 main parts of an insurance policy?",
    a: "Declarations, Insuring Agreement, Conditions, Exclusions, and Additional Coverage. Dec page equals facts. Insuring Agreement equals promise. Conditions equals duties. Exclusions equals what's not covered. Additional Coverage equals extra protection at no extra premium.",
    hook: "D I C E A — Dec, Insuring, Conditions, Exclusions, Additional.",
    section: 1
  },
  {
    q: "What does the Declarations page contain?",
    a: "WHO is insured, WHAT property is covered, WHERE it's located, WHEN the policy is in effect, HOW MUCH coverage and premium. It does NOT contain exclusions.",
    hook: "Who, What, Where, When, How Much — that's the Dec page.",
    section: 1
  },
  {
    q: "What does the Insuring Agreement contain?",
    a: "The insurer's promise — what is covered, which perils are insured, parties to the contract, and effective and renewal dates. When you see 'the insurer agrees to pay,' that's the Insuring Agreement.",
    hook: "I A equals the promise. Dec equals the facts.",
    section: 1
  },
  {
    q: "What is a binder?",
    a: "A temporary contract providing coverage before the actual policy is issued. It is legally binding and can be oral or written. It provides immediate protection while the formal policy is being prepared.",
    hook: "Binder equals temporary coverage, immediately binding.",
    section: 1
  },
  {
    q: "What is an endorsement?",
    a: "A written document attached to a policy that modifies, changes, adds, or deletes coverage. It takes precedence over the base policy when there is a conflict.",
    hook: "Endorsement equals modification attached to the policy.",
    section: 1
  },
  {
    q: "What is subrogation?",
    a: "The insurer's right to step into the insured's shoes and recover from a negligent third party after paying a claim. Prevents the insured from collecting twice.",
    hook: "Subrogation equals insurer steps in to sue the person who caused the loss.",
    section: 1
  },
  {
    q: "Actual Cash Value versus Replacement Cost — what's the difference?",
    a: "Actual Cash Value equals replacement cost MINUS depreciation. Replacement Cost pays what it costs to replace the item new, without deducting depreciation. ACV is the standard; Replacement Cost requires an endorsement or specific policy provision.",
    hook: "ACV equals replacement minus wear and tear. RC equals brand new.",
    section: 1
  },

  // ── SECTION 2: DWELLING POLICY ──
  {
    q: "What are the three dwelling policy forms?",
    a: "D P 1 is Basic Form — named perils: fire, lightning, internal explosion. D P 2 is Broad Form — named perils including more causes of loss. D P 3 is Special Form — open perils on the dwelling, named perils on personal property.",
    hook: "1 equals basic, 2 equals broad, 3 equals special open perils.",
    section: 2
  },
  {
    q: "Who is eligible for a dwelling policy?",
    a: "1 to 4 residential units. Tenant-occupied, owner-occupied, in-course-of-construction, and secondary residences all qualify. 5 or more units requires a commercial policy.",
    hook: "Dwelling policy equals max 4 units.",
    section: 2
  },
  {
    q: "What does a dwelling policy NOT include that a homeowners policy does?",
    a: "Liability coverage. Dwelling policies cover the structure and contents only. Homeowners adds Coverage E, personal liability, and Coverage F, medical payments to others.",
    hook: "D P equals no liability. H O equals liability included.",
    section: 2
  },

  // ── SECTION 3: HOMEOWNERS COVERAGES ──
  {
    q: "What are Coverages A, B, C, D, E, and F in a homeowners policy?",
    a: "A equals Dwelling. B equals Other Structures such as detached garage and fence, at 10 percent of A. C equals Personal Property at 50 percent of A. D equals Loss of Use and Additional Living Expense at 20 percent of A. E equals Personal Liability. F equals Medical Payments to Others.",
    hook: "A equals dwelling, B equals other, C equals contents, D equals loss of use, E equals liability, F equals med pay.",
    section: 3
  },
  {
    q: "What personal property is excluded from homeowners Coverage C?",
    a: "Animals, birds, fish. Motor vehicles, except lawn equipment. Aircraft. Business property above $2,500. Property of tenants not related to any insured.",
    hook: "No pets, no cars, no planes — excluded from C.",
    section: 3
  },
  {
    q: "What does Coverage D, Loss of Use, pay for?",
    a: "Additional living expenses when the home is uninhabitable due to a covered loss. Also pays fair rental value if part of the residence is rented out.",
    hook: "Coverage D equals pays for you to live somewhere else after a covered loss.",
    section: 3
  },

  // ── SECTION 4: PERSONAL AUTO POLICY ──
  {
    q: "What are the four main coverage parts of a Personal Auto Policy?",
    a: "Part A equals Liability, both bodily injury and property damage. Part B equals Medical Payments. Part C equals Uninsured and Underinsured Motorist. Part D equals Physical Damage, which includes Comprehensive and Collision.",
    hook: "PAP: A equals Liability, B equals Med Pay, C equals Uninsured, D equals Physical Damage.",
    section: 4
  },
  {
    q: "Comprehensive versus Collision in a PAP — what's the difference?",
    a: "Collision equals damage from your car hitting another vehicle or object. Comprehensive equals everything else: theft, fire, flood, vandalism, hitting an animal, glass breakage. Road hazards causing flat tires are excluded from both.",
    hook: "Collision equals you hit something. Comprehensive equals everything else.",
    section: 4
  },
  {
    q: "What are PAP supplemental payments?",
    a: "Paid IN ADDITION TO liability limits. Cover: bail bonds up to $250, appeal bonds, loss of earnings up to $200 per day for court attendance, and reasonable expenses at the insurer's request. NOT the cost to release a vehicle from impound.",
    hook: "Supplemental payments equal outside limits. No impound fees.",
    section: 4
  },
  {
    q: "Who is an insured under a PAP?",
    a: "Named insured and spouse. Family members residing in the household. Any person using your covered auto with permission. Any person or organization legally responsible for your use.",
    hook: "Named insured plus family plus permissive users equals covered.",
    section: 4
  },

  // ── SECTION 5: COMMERCIAL POLICIES ──
  {
    q: "What is a BOP — Business Owners Policy?",
    a: "Packages property and general liability coverage for small to medium businesses. Includes: building, business personal property, business income, and liability. Does NOT include workers compensation, auto, professional liability, or health insurance.",
    hook: "BOP equals property plus liability for small biz. No workers comp, no auto.",
    section: 5
  },
  {
    q: "What are the three coverage parts of a Commercial General Liability policy?",
    a: "Coverage A equals Bodily Injury and Property Damage Liability. Coverage B equals Personal and Advertising Injury Liability. Coverage C equals Medical Payments, per person, regardless of fault, up to $5,000.",
    hook: "CGL: A equals BI slash PD, B equals Personal slash Ad, C equals Med Pay.",
    section: 5
  },
  {
    q: "What do Commercial Auto Symbols 1, 7, and 9 mean?",
    a: "Symbol 1 equals Any Auto, the broadest. Symbol 7 equals Specifically Described Autos, only listed vehicles. Symbol 9 equals Non-owned Autos Only. Symbol 2 equals Owned Autos Only. Symbol 5 equals Owned Autos Subject to No-Fault.",
    hook: "1 equals any, 2 equals owned, 5 equals no-fault owned, 7 equals listed only, 9 equals non-owned.",
    section: 5
  },

  // ── SECTION 6: INLAND MARINE AND FLOATERS ──
  {
    q: "What is the guiding principle of inland marine coverage?",
    a: "It covers things that MOVE — property in transit, transportation, or that is portable. Think: moving, not fixed buildings. Radio towers and fixed structures are NOT inland marine.",
    hook: "Marine equals moving. Fixed equals not marine.",
    section: 6
  },
  {
    q: "What is a Commercial Articles Floater?",
    a: "Covers photo equipment and musical instruments used commercially — by professional photographers and musicians. Also covers fine arts and other valuable portable items.",
    hook: "Camera plus guitar on the job equals Commercial Articles Floater.",
    section: 6
  },
  {
    q: "What property is excluded from inland marine coverage?",
    a: "Money and securities stored in safes or safety deposit boxes. Also typically excludes accounts receivable from transit losses and contraband.",
    hook: "Cash in a safe equals not inland marine's problem.",
    section: 6
  },
  {
    q: "What is a Contractors Equipment Floater?",
    a: "Covers mobile equipment and tools used by contractors — bulldozers, cranes, forklifts, small tools. Covers the equipment on and off the job site.",
    hook: "Contractor's heavy equipment moving around equals Contractors Equipment Floater.",
    section: 6
  },

  // ── SECTION 7: KEY DEFINITIONS ──
  {
    q: "What is the difference between pure risk and speculative risk?",
    a: "Pure risk equals only the possibility of loss or no loss — no chance of gain. Insurable. Speculative risk equals could result in gain or loss, like gambling. Not insurable.",
    hook: "Pure equals insure. Speculate equals not insurable.",
    section: 7
  },
  {
    q: "What is coinsurance in property insurance?",
    a: "A requirement to insure property to at least 80 percent of its replacement value. If underinsured, the insurer pays only a proportional share of the loss. Formula: insurance carried divided by insurance required, times the loss.",
    hook: "80 percent rule — insure enough or share the loss.",
    section: 7
  },
  {
    q: "What is the difference between an occurrence policy and a claims-made policy?",
    a: "Occurrence equals covers losses that OCCUR during the policy period, regardless of when the claim is filed. Claims-made equals covers claims that are FILED during the policy period, regardless of when the loss occurred.",
    hook: "Occurrence equals when it happened. Claims-made equals when you reported it.",
    section: 7
  },
  {
    q: "What is a hazard versus a peril?",
    a: "Peril equals the CAUSE of loss — fire, theft, wind. Hazard equals a condition that INCREASES the likelihood or severity of a loss. Physical hazard equals tangible, like dry wood. Moral hazard equals intent to cause loss. Morale hazard equals carelessness.",
    hook: "Peril equals what happened. Hazard equals what made it more likely.",
    section: 7
  },

  // ── SECTION 8: ETHICS AND CONDUCT ──
  {
    q: "What is rebating, and what is legal versus illegal?",
    a: "Illegal rebating equals offering cash, gifts, stocks, bonds, or anything of value to induce purchasing a policy. LEGAL exception equals dividends from a mutual insurance company, because they come from profits, not as an inducement.",
    hook: "Gift to sell a policy equals illegal. Mutual dividend equals legal.",
    section: 8
  },
  {
    q: "What is misrepresentation versus defamation?",
    a: "Misrepresentation equals making false statements about a POLICY, its benefits, or terms. Defamation equals making false statements about a competitor, insurance company, or producer. Misrepresentation is about the policy. Defamation is about the person or company.",
    hook: "Misrepresentation equals lying about coverage. Defamation equals lying about a company.",
    section: 8
  },

  // ── SECTION 9: KANSAS LAW ──
  {
    q: "What are the notice requirements for cancellation of a personal lines policy?",
    a: "10 days notice for nonpayment of premium. 30 days notice for all other reasons. Nonrenewal also requires 30 days notice.",
    hook: "Nonpayment equals 10 days. Everything else equals 30 days.",
    section: 9
  },
  {
    q: "What is the Kansas Insurance Guaranty Association — KIGA?",
    a: "A fund that pays covered claims when an insurance company becomes insolvent. Protects policyholders from losing coverage due to insurer insolvency. Does NOT cover workers compensation or life and health claims.",
    hook: "KIGA equals safety net when your insurer goes broke.",
    section: 9
  },
  {
    q: "What is the Kansas Workers Compensation Plan?",
    a: "An assigned risk plan for employers who cannot obtain workers compensation coverage in the voluntary market. NOT the same as KIGA. KIGA equals insolvent insurer. Workers Comp Plan equals can't get workers comp anywhere else.",
    hook: "Workers Comp Plan equals last resort for employers who can't buy workers comp. KIGA equals insurer went broke.",
    section: 9
  },
  {
    q: "What are continuing education requirements for Kansas producers?",
    a: "24 hours per 2-year license period. At least 3 hours must be in ethics. License is suspended for 90 days if CE is not completed by the due date — or until completed, whichever comes first.",
    hook: "24 hours per 2 years, 3 in ethics, 90-day suspension if late.",
    section: 9
  },
  {
    q: "What is required to obtain a nonresident producer license in Kansas?",
    a: "Submit the NAIC Uniform Application, pay the application fee, and be at least 18 years old. A Certification Letter from the home state is NOT required — license status is verified through the NAIC Producer Database.",
    hook: "NAIC app plus fee plus age 18. No cert letter — NAIC PDB checks it.",
    section: 9
  }
];

const TOTAL = cards.length; // 35

// ─────────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────────
let playerState = 'idle';   // 'idle' | 'playing' | 'paused'
let currentIdx  = 0;
let speechRate  = 1.0;
let selectedVoice = null;
let seqId = 0;
let pendingTimer = null;
let introPlayed = false;

// ─────────────────────────────────────────────
//  DOM REFS
// ─────────────────────────────────────────────
const elCounter    = document.getElementById('counter');
const elSection    = document.getElementById('sectionBadge');
const elProgress   = document.getElementById('progressBar');
const elPhase      = document.getElementById('phaseLabel');
const elCardText   = document.getElementById('cardText');
const elPlayBtn    = document.getElementById('playBtn');
const elStatus     = document.getElementById('statusRow');

// ─────────────────────────────────────────────
//  VOICE SETUP
// ─────────────────────────────────────────────
function getBestVoice(voices) {
  const preferred = ['Samantha', 'Ava', 'Karen', 'Moira', 'Victoria'];
  for (const name of preferred) {
    const v = voices.find(v => v.name === name);
    if (v) return v;
  }
  const enhanced = voices.find(v => v.name.includes('Enhanced') || v.name.includes('Premium'));
  if (enhanced) return enhanced;
  return voices.find(v => v.lang.startsWith('en')) || voices[0];
}

function pickVoice() {
  const voices = speechSynthesis.getVoices();
  if (!voices.length) return;
  selectedVoice = getBestVoice(voices);
}
speechSynthesis.onvoiceschanged = pickVoice;
pickVoice();

// ─────────────────────────────────────────────
//  DISPLAY HELPERS
// ─────────────────────────────────────────────
function updateCounter(idx) {
  elCounter.textContent = `Card ${idx + 1} of ${TOTAL}`;
  elProgress.style.width = `${((idx) / TOTAL) * 100}%`;
  const sec = cards[idx].section;
  const sectionNames = {
    1: 'Policy Structure',
    2: 'Dwelling Policy',
    3: 'Homeowners',
    4: 'Personal Auto',
    5: 'Commercial',
    6: 'Inland Marine',
    7: 'Key Definitions',
    8: 'Ethics',
    9: 'Kansas Law'
  };
  elSection.textContent = sectionNames[sec] || `Section ${sec}`;
}

function showPhase(cls, label) {
  elPhase.className = 'phase-label' + (cls ? ' ' + cls : '');
  elPhase.textContent = label;
}

function showText(text) {
  elCardText.textContent = text;
}

function setStatus(text, cls) {
  elStatus.textContent = text;
  elStatus.className = 'status-row' + (cls ? ' ' + cls : '');
}

// ─────────────────────────────────────────────
//  CORE SPEECH ENGINE
// ─────────────────────────────────────────────
function speak(text, onDone) {
  const utt = new SpeechSynthesisUtterance(text);
  utt.rate  = 0.82 * speechRate;
  utt.pitch = 0.92;
  utt.volume = 1;
  if (selectedVoice) utt.voice = selectedVoice;
  utt.onend   = onDone;
  utt.onerror = (e) => {
    if (e.error !== 'interrupted' && e.error !== 'canceled') onDone();
  };
  speechSynthesis.speak(utt);
}

function pause(ms, mySeqId, onDone) {
  pendingTimer = setTimeout(() => {
    pendingTimer = null;
    if (seqId === mySeqId && playerState === 'playing') onDone();
  }, ms);
}

// ─────────────────────────────────────────────
//  INTRO
// ─────────────────────────────────────────────
function playIntro() {
  const myId = ++seqId;
  showPhase('', 'Welcome');
  setStatus('Intro…', 'active');
  showText('Kansas Property and Casualty — Foundations Review. This session covers policy structure, coverage types, key definitions, and Kansas law. Relax and listen.');

  speak(
    "Kansas Property and Casualty — Foundations Review. " +
    "This session covers policy structure, coverage types, key definitions, and Kansas law. " +
    "Relax and listen.",
    () => {
      if (seqId !== myId || playerState !== 'playing') return;
      introPlayed = true;
      pause(3000, myId, () => {
        speakCard(0);
      });
    }
  );
}

// ─────────────────────────────────────────────
//  CARD SEQUENCE
// ─────────────────────────────────────────────
function speakCard(idx) {
  if (playerState !== 'playing') return;
  if (idx >= TOTAL) { playComplete(); return; }

  currentIdx = idx;
  const myId = ++seqId;
  const card = cards[idx];
  const num  = idx + 1;

  updateCounter(idx);
  showPhase('', `Card ${num} of ${TOTAL}`);
  setStatus(`Card ${num} — listening…`, 'active');

  // Step 1: announce card number
  speak(`Card ${num}.`, () => {
    if (seqId !== myId || playerState !== 'playing') return;

    // Step 2: short pause, then show question and speak it
    pause(300, myId, () => {
      showPhase('q', 'Question');
      showText(card.q);

      speak(card.q, () => {
        if (seqId !== myId || playerState !== 'playing') return;

        // Step 3: 3-second think pause
        pause(3000, myId, () => {
          // Step 4: say "Answer." while showing the answer text
          showPhase('a', 'Answer');
          showText(card.a);

          speak('Answer.', () => {
            if (seqId !== myId || playerState !== 'playing') return;

            // Step 5: speak answer text
            speak(card.a, () => {
              if (seqId !== myId || playerState !== 'playing') return;

              // Step 6: say memory hook
              showPhase('h', 'Memory Hook');
              showText('Remember: ' + card.hook);

              speak('Remember: ' + card.hook, () => {
                if (seqId !== myId || playerState !== 'playing') return;

                // Step 7: 4-second pause between cards, then advance
                pause(4000, myId, () => {
                  speakCard(idx + 1);
                });
              });
            });
          });
        });
      });
    });
  });
}

// ─────────────────────────────────────────────
//  COMPLETION
// ─────────────────────────────────────────────
function playComplete() {
  playerState = 'idle';
  seqId++;
  elProgress.style.width = '100%';
  elCounter.textContent = `All ${TOTAL} cards complete`;
  showPhase('done', 'Complete ✓');
  showText("Foundations review complete. 35 cards covered.");
  elPlayBtn.textContent = '✓';
  elPlayBtn.classList.add('done');
  setStatus('Review complete — you know this material!', 'done');

  const fin = new SpeechSynthesisUtterance(
    "Foundations review complete. 35 cards covered. " +
    "You know this material. Slow down on the exam, read every word, and trust your first instinct. " +
    "Good luck tomorrow morning."
  );
  fin.rate  = 0.82 * speechRate;
  fin.pitch = 0.92;
  fin.volume = 1;
  if (selectedVoice) fin.voice = selectedVoice;
  speechSynthesis.speak(fin);
}

// ─────────────────────────────────────────────
//  CANCEL EVERYTHING
// ─────────────────────────────────────────────
function cancelAll() {
  seqId++;
  speechSynthesis.cancel();
  if (pendingTimer) { clearTimeout(pendingTimer); pendingTimer = null; }
}

// ─────────────────────────────────────────────
//  CONTROLS
// ─────────────────────────────────────────────
function togglePlay() {
  if (elPlayBtn.classList.contains('done')) {
    elPlayBtn.classList.remove('done');
    elPlayBtn.textContent = '⏸';
    currentIdx = 0;
    introPlayed = false;
    playerState = 'playing';
    setStatus('Playing…', 'active');
    playIntro();
    return;
  }

  if (playerState === 'playing') {
    cancelAll();
    playerState = 'paused';
    elPlayBtn.textContent = '▶';
    setStatus('Paused — tap ▶ to resume');
    showPhase('', 'Paused');
  } else {
    playerState = 'playing';
    elPlayBtn.textContent = '⏸';
    setStatus('Playing…', 'active');
    if (!selectedVoice) pickVoice();
    if (currentIdx === 0 && !introPlayed) {
      playIntro();
    } else {
      speakCard(currentIdx);
    }
  }
}

function skipForward() {
  const wasPlaying = (playerState === 'playing');
  cancelAll();
  if (currentIdx < TOTAL - 1) {
    currentIdx++;
    updateCounter(currentIdx);
    showPhase('', `Card ${currentIdx + 1} of ${TOTAL}`);
    showText(cards[currentIdx].q);
  }
  if (wasPlaying) {
    playerState = 'playing';
    elPlayBtn.textContent = '⏸';
    setTimeout(() => speakCard(currentIdx), 120);
  } else if (playerState === 'paused') {
    showPhase('q', 'Question');
    showText(cards[currentIdx].q);
    setStatus(`Card ${currentIdx + 1} — tap ▶ to resume`);
  }
}

function skipBack() {
  const wasPlaying = (playerState === 'playing');
  cancelAll();
  if (currentIdx > 0) currentIdx--;
  updateCounter(currentIdx);
  showPhase('', `Card ${currentIdx + 1} of ${TOTAL}`);
  showText(cards[currentIdx].q);
  if (wasPlaying) {
    playerState = 'playing';
    elPlayBtn.textContent = '⏸';
    setTimeout(() => speakCard(currentIdx), 120);
  } else if (playerState === 'paused') {
    showPhase('q', 'Question');
    showText(cards[currentIdx].q);
    setStatus(`Card ${currentIdx + 1} — tap ▶ to resume`);
  }
}

function setRate(r) {
  speechRate = r;
  document.querySelectorAll('.speed-btn').forEach(b => {
    b.classList.toggle('active', parseFloat(b.textContent) === r);
  });
}

// ─────────────────────────────────────────────
//  KEYBOARD SHORTCUTS
// ─────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.code === 'Space')       { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowRight')  skipForward();
  if (e.code === 'ArrowLeft')   skipBack();
});

// ─────────────────────────────────────────────
//  PREVENT SCREEN SLEEP (Wake Lock API)
// ─────────────────────────────────────────────
let wakeLock = null;
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (_) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && playerState === 'playing') {
    requestWakeLock();
  }
});

// Init counter display
updateCounter(0);
</script>
</body>
</html>
