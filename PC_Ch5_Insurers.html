<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P&C — Ch5: Insurers</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e2e2e2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem}
  .deck{width:100%;max-width:680px}
  .progress-bar{width:100%;height:3px;background:#1a1a1a;border-radius:2px;margin-bottom:1.5rem}
  .progress-fill{height:3px;background:#5b8dee;border-radius:2px;transition:width .4s ease}
  .card{background:#141414;border:1px solid #222;border-radius:20px;padding:2.5rem 2rem;min-height:360px;display:flex;flex-direction:column;justify-content:center;margin-bottom:1.2rem;position:relative}
  .card-label{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:#5b8dee;margin-bottom:.6rem}
  .card-title{font-size:21px;font-weight:700;color:#fff;margin-bottom:1rem;line-height:1.25}
  .card-body{font-size:14px;color:#aaa;line-height:1.75}
  .card-body strong{color:#e2e2e2;font-weight:600}
  .card-body p+p{margin-top:.75rem}
  .info-grid{display:flex;flex-direction:column;gap:9px;margin-top:.6rem}
  .info-row{background:#1a1a1a;border:1px solid #242424;border-radius:10px;padding:11px 14px}
  .info-label{font-size:11px;font-weight:600;color:#5b8dee;letter-spacing:.5px;margin-bottom:3px;text-transform:uppercase}
  .info-val{font-size:13px;color:#bbb;line-height:1.55}
  /* KNOW THIS — amber highlight */
  .know-this{background:#1c1500;border:2px solid #c8a84b;border-radius:12px;padding:14px 16px;margin-top:.9rem}
  .know-this-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#c8a84b;font-weight:700;margin-bottom:6px}
  .know-this p{font-size:14px;color:#f0d080;line-height:1.6}
  .warn-box{background:#1a1200;border:1px solid #3a2a00;border-radius:10px;padding:12px 14px;margin-top:.8rem}
  .warn-box p{font-size:13px;color:#c8a84b;line-height:1.55}
  .type-card{border-radius:12px;padding:14px 16px;margin-bottom:8px}
  .type-card.domestic{background:#0a1a0a;border:1px solid #1a3a1a}
  .type-card.foreign{background:#0a0d1a;border:1px solid #1a2a4a}
  .type-card.alien{background:#1a0a1a;border:1px solid #3a1a3a}
  .type-name{font-size:13px;font-weight:700;margin-bottom:4px}
  .type-card.domestic .type-name{color:#4aaa4a}
  .type-card.foreign .type-name{color:#5b8dee}
  .type-card.alien .type-name{color:#c05050}
  .type-def{font-size:13px;color:#999;line-height:1.5}
  .type-ex{font-size:12px;color:#555;margin-top:3px;font-style:italic}
  ul.bullet{padding-left:1.1rem;display:flex;flex-direction:column;gap:5px;margin-top:.5rem}
  ul.bullet li{font-size:13px;color:#999;line-height:1.5}
  ul.bullet li strong{color:#ddd}
  .slide-num{position:absolute;top:1.2rem;right:1.5rem;font-size:11px;color:#333}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .nav-btn{padding:11px 28px;font-size:14px;font-weight:500;cursor:pointer;border-radius:10px;border:1px solid #2a2a2a;background:#1a1a1a;color:#e2e2e2;transition:background .15s}
  .nav-btn:hover{background:#252525}
  .nav-btn:disabled{opacity:.3;cursor:default}
  .nav-btn.primary{background:#0d1a2e;border-color:#1e3a6e;color:#5b8dee}
  .nav-btn.primary:hover{background:#112244}
  .counter{font-size:12px;color:#444;text-align:center;flex:1}
</style>
</head>
<body>
<div class="deck">
  <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>
  <div class="card" id="card">
    <div class="slide-num" id="slideNum"></div>
    <div id="content"></div>
  </div>
  <div class="nav">
    <button class="nav-btn" id="prevBtn" onclick="go(-1)">← Back</button>
    <span class="counter" id="counter"></span>
    <button class="nav-btn primary" id="nextBtn" onclick="go(1)">Next →</button>
  </div>
</div>
<a href="PC_Dashboard.html" style="position:fixed;bottom:16px;left:16px;padding:8px 16px;background:#141414;border:1px solid #2a2a2a;border-radius:8px;color:#888;font-size:12px;font-family:-apple-system,sans-serif;text-decoration:none;z-index:999">← Home</a>

<script>
const SLIDES = [
  {
    label: "Chapter 5 · Insurers",
    title: "What is an Insurer?",
    body: `<p>The <strong>insurer</strong> is the company or organization that issues a policy of insurance. Insurance companies can be classified in multiple ways:</p>
<ul class="bullet" style="margin-top:.8rem">
  <li><strong>Ownership</strong> — who owns the company (stock, mutual, etc.)</li>
  <li><strong>Authority</strong> — whether they are authorized to operate in a state</li>
  <li><strong>Domicile</strong> — where they are incorporated</li>
  <li><strong>Marketing systems</strong> — how they distribute products</li>
  <li><strong>Rating</strong> — financial strength</li>
</ul>
<div class="warn-box"><p>💡 These categories are <strong>not mutually exclusive</strong> — the same company can be classified in multiple ways simultaneously (e.g., domestic + authorized + stock insurer).</p></div>`
  },
  {
    label: "Classification by Domicile",
    title: "Domestic, Foreign & Alien Insurers",
    body: `<p>Insurance companies are classified by their <strong>location of incorporation (domicile)</strong>. This determines how they're referred to in any given state.</p>
<div class="know-this">
  <div class="know-this-label">⚠ Know This</div>
  <p><strong>Domicile</strong> refers to the location where an insurer is <em>incorporated</em> — not necessarily where it conducts business.</p>
</div>
<div class="warn-box" style="margin-top:.8rem"><p>📝 Regardless of domicile, every insurer must obtain a <strong>Certificate of Authority</strong> before transacting insurance in any state.</p></div>`
  },
  {
    label: "Classification by Domicile",
    title: "The Three Types",
    body: `<div class="type-card domestic">
  <div class="type-name">🏠 Domestic Insurer</div>
  <div class="type-def">Incorporated <strong>in this state</strong> (Kansas). Home office is typically in the state of formation.</div>
  <div class="type-ex">Example: A company chartered in Kansas → Domestic in Kansas</div>
</div>
<div class="type-card foreign">
  <div class="type-name">🌐 Foreign Insurer</div>
  <div class="type-def">Incorporated in <strong>another U.S. state, D.C., or a U.S. territory</strong> (American Samoa, Guam, Northern Mariana Islands, Puerto Rico, U.S. Virgin Islands).</div>
  <div class="type-ex">Example: A company chartered in California → Foreign insurer in Kansas</div>
</div>
<div class="type-card alien">
  <div class="type-name">🌍 Alien Insurer</div>
  <div class="type-def">Incorporated <strong>outside the United States</strong> entirely.</div>
  <div class="type-ex">Example: A company chartered in Canada or the UK → Alien insurer in any U.S. state</div>
</div>`
  },
  {
    label: "Domicile · Quick Test",
    title: "How to Classify — Examples",
    body: `<p>The classification always depends on the <strong>state you're asking from</strong>. A company chartered in California:</p>
<div class="info-grid" style="margin-top:.8rem">
  <div class="info-row"><div class="info-label">In California</div><div class="info-val">→ <strong>Domestic</strong> — it was incorporated there</div></div>
  <div class="info-row"><div class="info-label">In Kansas</div><div class="info-val">→ <strong>Foreign</strong> — another U.S. state</div></div>
</div>
<div class="info-grid" style="margin-top:.8rem">
  <div class="info-row"><div class="info-label">Company chartered in Puerto Rico</div><div class="info-val">→ <strong>Foreign</strong> in any U.S. state (U.S. territory)</div></div>
  <div class="info-row"><div class="info-label">Company chartered in Canada</div><div class="info-val">→ <strong>Alien</strong> in any U.S. state (outside the U.S.)</div></div>
</div>`
  },
  {
    label: "Authorized vs. Unauthorized",
    title: "Certificate of Authority",
    body: `<p>Before transacting business in Kansas, insurers must apply for and receive a <strong>Certificate of Authority</strong> from the Kansas Department of Insurance and meet state financial (capital and surplus) requirements.</p>
<div class="know-this">
  <div class="know-this-label">⚠ Know This</div>
  <p>Insurers must obtain a <strong>Certificate of Authority prior to transacting business</strong> in this state.</p>
</div>
<div class="info-grid" style="margin-top:.8rem">
  <div class="info-row"><div class="info-label">Authorized / Admitted</div><div class="info-val">Meets financial requirements and is approved to transact business in Kansas. Fully licensed.</div></div>
  <div class="info-row"><div class="info-label">Unauthorized / Nonadmitted</div><div class="info-val">Has <strong>not</strong> been approved to do business in the state. Most states prohibit unauthorized insurers from conducting business, <strong>except through licensed excess and surplus lines brokers</strong>.</div></div>
</div>`
  },
  {
    label: "Section Summary",
    title: "Insurers — Key Takeaways",
    body: `<div class="info-grid">
  <div class="info-row"><div class="info-label">Domicile = Incorporation, Not Operations</div><div class="info-val">Where a company is chartered determines its classification as domestic, foreign, or alien — not where it does business.</div></div>
  <div class="info-row"><div class="info-label">Domestic</div><div class="info-val">Incorporated in Kansas</div></div>
  <div class="info-row"><div class="info-label">Foreign</div><div class="info-val">Incorporated in another U.S. state, D.C., or U.S. territory</div></div>
  <div class="info-row"><div class="info-label">Alien</div><div class="info-val">Incorporated outside the United States</div></div>
  <div class="info-row"><div class="info-label">Certificate of Authority</div><div class="info-val">Required before any insurer — domestic, foreign, or alien — may transact business in Kansas</div></div>
  <div class="info-row"><div class="info-label">Nonadmitted Exception</div><div class="info-val">Unauthorized insurers may only operate through licensed <strong>excess and surplus lines brokers</strong></div></div>
</div>`
  }
];

let cur = 0;

function render() {
  const s = SLIDES[cur];
  document.getElementById('content').innerHTML =
    `<div class="card-label">${s.label}</div><div class="card-title">${s.title}</div><div class="card-body">${s.body}</div>`;
  document.getElementById('fill').style.width = ((cur + 1) / SLIDES.length * 100) + '%';
  document.getElementById('counter').textContent = (cur + 1) + ' of ' + SLIDES.length;
  document.getElementById('slideNum').textContent = (cur + 1) + ' / ' + SLIDES.length;
  document.getElementById('prevBtn').disabled = cur === 0;
  document.getElementById('nextBtn').textContent = cur === SLIDES.length - 1 ? '✓ Done' : 'Next →';
  document.getElementById('nextBtn').onclick = cur === SLIDES.length - 1
    ? () => window.location.href = 'PC_Dashboard.html'
    : () => go(1);
}

function go(dir) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, cur + dir));
  render();
}

render();
</script>
</body>
</html>
