<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P&C Exam — Study Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e2e2e2; min-height: 100vh; padding: 2rem 1rem; }
  .container { max-width: 720px; margin: 0 auto; }
  .header { margin-bottom: 2rem; }
  .header h1 { font-size: 22px; font-weight: 600; color: #fff; margin-bottom: 4px; }
  .header p { font-size: 13px; color: #555; }
  .progress-summary { background: #141414; border: 1px solid #222; border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 2rem; display: flex; gap: 2rem; }
  .stat { display: flex; flex-direction: column; gap: 3px; }
  .stat-val { font-size: 22px; font-weight: 600; color: #5b8dee; }
  .stat-label { font-size: 11px; color: #555; letter-spacing: 1px; text-transform: uppercase; }
  .chapter { margin-bottom: 1.5rem; }
  .chapter-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; cursor: pointer; user-select: none; }
  .chapter-title { font-size: 13px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: #888; }
  .chapter-progress { font-size: 11px; color: #444; }
  .chapter-body { display: none; }
  .chapter-body.open { display: block; }
  .section-row { display: flex; align-items: center; justify-content: space-between; background: #141414; border: 1px solid #1e1e1e; border-radius: 10px; padding: 12px 14px; margin-bottom: 6px; transition: border-color 0.15s; }
  .section-row:hover { border-color: #2a2a2a; }
  .section-row.done { border-color: #1a3a1a; }
  .section-row.done .section-name { color: #aaa; }
  .section-name { font-size: 14px; color: #e2e2e2; flex: 1; }
  .section-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .badge-done { font-size: 10px; letter-spacing: 1px; color: #3a8a3a; background: #0d1f0d; border: 1px solid #1a3a1a; border-radius: 6px; padding: 3px 8px; }
  .btn { padding: 6px 14px; font-size: 12px; font-weight: 500; cursor: pointer; border-radius: 7px; border: 1px solid #2a2a2a; background: #1a1a1a; color: #e2e2e2; text-decoration: none; display: inline-block; transition: background 0.15s, border-color 0.15s; }
  .btn:hover { background: #222; border-color: #3a3a3a; }
  .btn-blue { border-color: #1e3a6e; background: #0d1a2e; color: #5b8dee; }
  .btn-blue:hover { background: #112040; }
  .btn-sm { padding: 4px 10px; font-size: 11px; }
  .divider { border: none; border-top: 1px solid #1a1a1a; margin: 1.5rem 0; }
  .note { font-size: 12px; color: #444; text-align: center; margin-top: 2rem; line-height: 1.6; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>P&amp;C Licensing Exam</h1>
    <p>Study dashboard — click a chapter to expand, open any completed slideshow</p>
  </div>

  <div class="progress-summary">
    <div class="stat"><span class="stat-val" id="done-count">0</span><span class="stat-label">Sections done</span></div>
    <div class="stat"><span class="stat-val" id="total-count">0</span><span class="stat-label">Total sections</span></div>
    <div class="stat"><span class="stat-val" id="pct">0%</span><span class="stat-label">Complete</span></div>
  </div>

  <div id="chapters"></div>

  <p class="note">Slideshows are HTML files saved in the same folder as this dashboard.<br>Open this file and the slideshows from the same folder and links will work.</p>
</div>

<script>
const CHAPTERS = [
  {
    title: "Chapter 1",
    name: "Chapter 1",
    sections: []
  },
  {
    title: "Chapter 2",
    name: "Chapter 2",
    sections: []
  },
  {
    title: "Chapter 3",
    name: "Chapter 3",
    sections: []
  },
  {
    title: "Chapter 4",
    name: "Chapter 4 · Casualty & Liability Insurance",
    sections: [
      { name: "Introduction", file: "PC_Ch4_Intro.html" },
      { name: "Automotive: Personal Auto & Business Auto", file: "PC_Ch4_Personal_Business_Auto.html" },
      { name: "Commercial General Liability (CGL)", file: "PC_Ch4_CGL.html" },
      { name: "Businessowners Policy (BOP)", file: "PC_Ch4_BOP.html" },
      { name: "Workers Compensation, Employers Liability, and Related Issues", file: "PC_Ch4_WorkersComp.html" },
      { name: "Crime", file: "PC_Ch4_Crime.html" },
      { name: "Professional Liability", file: "PC_Ch4_ProfessionalLiability.html" },
      { name: "Umbrella and Excess Liability", file: "PC_Ch4_UmbrellaExcess.html" },
      { name: "Bonds", file: "PC_Ch4_Bonds.html" }
    ]
  },
  {
    title: "Chapter 5",
    name: "Chapter 5",
    sections: []
  },
  {
    title: "Chapter 6",
    name: "Chapter 6",
    sections: []
  },
  {
    title: "Chapter 7",
    name: "Chapter 7",
    sections: []
  },
  {
    title: "Chapter 8",
    name: "Chapter 8",
    sections: []
  },
  {
    title: "Chapter 9",
    name: "Chapter 9",
    sections: []
  }
];

function getSaved() {
  try { return JSON.parse(localStorage.getItem('pc_done') || '{}'); } catch { return {}; }
}

function markDone(file) {
  const d = getSaved(); d[file] = true;
  localStorage.setItem('pc_done', JSON.stringify(d));
  render();
}

function render() {
  const done = getSaved();
  const el = document.getElementById('chapters');
  let totalSections = 0, doneSections = 0;

  el.innerHTML = CHAPTERS.map((ch, ci) => {
    const hasSections = ch.sections.length > 0;
    const chDone = ch.sections.filter(s => done[s.file]).length;
    totalSections += ch.sections.length;
    doneSections += chDone;

    const rows = ch.sections.map(s => {
      const isDone = done[s.file];
      return `<div class="section-row ${isDone ? 'done' : ''}">
        <span class="section-name">${s.name}</span>
        <div class="section-actions">
          ${isDone ? '<span class="badge-done">✓ DONE</span>' : ''}
          ${s.file ? `<a class="btn btn-blue btn-sm" href="${s.file}" target="_blank">Open →</a>` : '<span style="font-size:11px;color:#333;">No slideshow yet</span>'}
          ${!isDone && s.file ? `<button class="btn btn-sm" onclick="markDone('${s.file}')">Mark done</button>` : ''}
        </div>
      </div>`;
    }).join('');

    const emptyMsg = hasSections ? '' : `<div style="font-size:12px;color:#333;padding:8px 0 12px;">No sections built yet — paste a section to Claude to generate one.</div>`;

    return `<div class="chapter">
      <div class="chapter-header" onclick="toggle(${ci})">
        <span class="chapter-title">${ch.name}</span>
        <span class="chapter-progress">${hasSections ? chDone + '/' + ch.sections.length : ''}</span>
      </div>
      <div class="chapter-body" id="ch-${ci}">
        ${rows}
        ${emptyMsg}
      </div>
    </div><hr class="divider">`;
  }).join('');

  document.getElementById('done-count').textContent = doneSections;
  document.getElementById('total-count').textContent = totalSections;
  document.getElementById('pct').textContent = totalSections ? Math.round((doneSections/totalSections)*100) + '%' : '0%';

  // Auto-open chapter 4 since it has content
  const ch4 = document.getElementById('ch-3');
  if (ch4) ch4.classList.add('open');
}

function toggle(i) {
  const el = document.getElementById('ch-' + i);
  el.classList.toggle('open');
}

render();
</script>
</body>
</html>
