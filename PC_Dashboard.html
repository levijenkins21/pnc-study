<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P&C Exam — Study Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e2e2e2; min-height: 100vh; padding: 2rem 1rem; }
  .container { max-width: 720px; margin: 0 auto; }
  .header { margin-bottom: 2rem; }
  .header h1 { font-size: 22px; font-weight: 600; color: #fff; margin-bottom: 4px; }
  .header p { font-size: 13px; color: #555; }
  .progress-summary { background: #141414; border: 1px solid #222; border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 2rem; display: flex; gap: 2rem; }
  .stat { display: flex; flex-direction: column; gap: 3px; }
  .stat-val { font-size: 22px; font-weight: 600; color: #5b8dee; }
  .stat-label { font-size: 11px; color: #555; letter-spacing: 1px; text-transform: uppercase; }
  .chapter { margin-bottom: 1.5rem; }
  .chapter-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; cursor: pointer; user-select: none; }
  .chapter-title { font-size: 13px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: #888; }
  .chapter-progress { font-size: 11px; color: #444; }
  .chapter-body { display: none; }
  .chapter-body.open { display: block; }
  .section-row { display: flex; align-items: center; justify-content: space-between; background: #141414; border: 1px solid #1e1e1e; border-radius: 10px; padding: 12px 14px; margin-bottom: 6px; transition: border-color 0.15s; }
  .section-row:hover { border-color: #2a2a2a; }
  .section-row.done { border-color: #1a3a1a; }
  .section-row.done .section-name { color: #aaa; }
  .section-name { font-size: 14px; color: #e2e2e2; flex: 1; }
  .section-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .badge-done { font-size: 10px; letter-spacing: 1px; color: #3a8a3a; background: #0d1f0d; border: 1px solid #1a3a1a; border-radius: 6px; padding: 3px 8px; }
  .btn { padding: 6px 14px; font-size: 12px; font-weight: 500; cursor: pointer; border-radius: 7px; border: 1px solid #2a2a2a; background: #1a1a1a; color: #e2e2e2; text-decoration: none; display: inline-block; transition: background 0.15s, border-color 0.15s; }
  .btn:hover { background: #222; border-color: #3a3a3a; }
  .btn-blue { border-color: #1e3a6e; background: #0d1a2e; color: #5b8dee; }
  .btn-blue:hover { background: #112040; }
  .btn-sm { padding: 4px 10px; font-size: 11px; }
  .divider { border: none; border-top: 1px solid #1a1a1a; margin: 1.5rem 0; }
  .note { font-size: 12px; color: #444; text-align: center; margin-top: 2rem; line-height: 1.6; }
  /* notes section */
  .notes-section { margin-bottom: 2rem; }
  .notes-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; cursor: pointer; user-select: none; }
  .notes-title { font-size: 13px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: #888; }
  .notes-body { display: none; }
  .notes-body.open { display: block; }
  .notes-card { background: #141414; border: 1px solid #222; border-radius: 12px; padding: 1rem 1.1rem; }
  .notes-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; flex-wrap: wrap; gap: 8px; }
  .notes-add-row { display: flex; gap: 8px; }
  .notes-input { flex: 1; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; color: #e2e2e2; font-size: 13px; padding: 8px 12px; font-family: inherit; outline: none; transition: border-color .15s; }
  .notes-input:focus { border-color: #3a3a3a; }
  .notes-add-btn { padding: 8px 16px; font-size: 12px; font-weight: 500; cursor: pointer; border-radius: 8px; border: 1px solid #1e3a6e; background: #0d1a2e; color: #5b8dee; white-space: nowrap; }
  .notes-add-btn:hover { background: #112040; }
  .notes-list { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
  .note-item { display: flex; align-items: flex-start; gap: 10px; background: #1a1a1a; border: 1px solid #242424; border-radius: 8px; padding: 10px 12px; }
  .note-dot { width: 6px; height: 6px; border-radius: 50%; background: #5b8dee; flex-shrink: 0; margin-top: 5px; }
  .note-text { font-size: 13px; color: #ccc; line-height: 1.5; flex: 1; word-break: break-word; }
  .note-meta { font-size: 10px; color: #444; white-space: nowrap; flex-shrink: 0; margin-top: 2px; }
  .note-del { font-size: 14px; color: #333; cursor: pointer; flex-shrink: 0; line-height: 1; padding: 0 2px; transition: color .15s; }
  .note-del:hover { color: #c05050; }
  .notes-empty { font-size: 12px; color: #333; padding: 8px 0; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>P&amp;C Licensing Exam</h1>
    <p>Study dashboard — click a chapter to expand, open any completed slideshow</p>
  </div>

  <div class="progress-summary">
    <div class="stat"><span class="stat-val" id="done-count">0</span><span class="stat-label">Sections done</span></div>
    <div class="stat"><span class="stat-val" id="total-count">0</span><span class="stat-label">Total sections</span></div>
    <div class="stat"><span class="stat-val" id="pct">0%</span><span class="stat-label">Complete</span></div>
  </div>

  <!-- Notes Section -->
  <div class="notes-section">
    <div class="notes-header" onclick="toggleNotes()">
      <span class="notes-title">📋 My Notes</span>
      <span id="notes-toggle-icon" style="font-size:11px;color:#444">▼</span>
    </div>
    <div class="notes-body" id="notesBody">
      <div class="notes-card">
        <div class="notes-add-row">
          <input class="notes-input" id="noteInput" type="text" placeholder="Add a note, reminder, or anything on your mind…" onkeydown="if(event.key==='Enter')addNote()">
          <button class="notes-add-btn" onclick="addNote()">+ Add</button>
        </div>
        <div class="notes-list" id="notesList"></div>
      </div>
    </div>
  </div>
  <hr class="divider" style="margin-top:0">

  <div id="chapters"></div>

  <p class="note">Slideshows are HTML files saved in the same folder as this dashboard.<br>Open this file and the slideshows from the same folder and links will work.</p>
</div>

<script>
const CHAPTERS = [
  {
    title: "Chapter 1",
    name: "Chapter 1",
    sections: []
  },
  {
    title: "Chapter 2",
    name: "Chapter 2",
    sections: []
  },
  {
    title: "Chapter 3",
    name: "Chapter 3",
    sections: []
  },
  {
    title: "Chapter 4",
    name: "Chapter 4 · Types of Casualty, Policies, Bonds, and Related Terms",
    sections: [
      { name: "Introduction", file: "PC_Ch4_Intro.html" },
      { name: "Automotive: Personal Auto & Business Auto", file: "PC_Ch4_Personal_Business_Auto.html" },
      { name: "Commercial General Liability (CGL)", file: "PC_Ch4_CGL.html" },
      { name: "Businessowners Policy (BOP)", file: "PC_Ch4_BOP.html" },
      { name: "Workers Compensation, Employers Liability, and Related Issues", file: "PC_Ch4_WorkersComp.html" },
      { name: "Crime", file: "PC_Ch4_Crime.html" },
      { name: "Professional Liability", file: "PC_Ch4_ProfessionalLiability.html" },
      { name: "Umbrella and Excess Liability", file: "PC_Ch4_UmbrellaExcess.html" },
      { name: "Bonds", file: "PC_Ch4_Bonds.html" }
    ],
    tools: [
      { name: "Chapter 4 Flashcards (78 cards)", file: "PC_Ch4_Flashcards.html", icon: "🃏" },
      { name: "Chapter 4 Quiz (40 questions)", file: "PC_Ch4_Quiz.html", icon: "📝" },
      { name: "FX Recap Flashcards (55 cards)", file: "PC_Ch4_FX_Recap_Flashcards.html", icon: "📖" },
      { name: "FX Chapter Exam (15 questions)", file: "PC_Ch4_FX_Quiz_Flashcards.html", icon: "🎯" }
    ]
  },
  {
    title: "Chapter 5",
    name: "Chapter 5 · Kansas Statutes and Regulations Common to All Lines",
    sections: [
      { name: "Introduction & Key Terms", file: "PC_Ch5_Intro.html" },
      { name: "Commissioner of Insurance", file: "PC_Ch5_Commissioner.html" },
      { name: "Insurers", file: "PC_Ch5_Insurers.html" }
    ]
  },
  {
    title: "Chapter 6",
    name: "Chapter 6",
    sections: []
  },
  {
    title: "Chapter 7",
    name: "Chapter 7",
    sections: []
  },
  {
    title: "Chapter 8",
    name: "Chapter 8",
    sections: []
  },
  {
    title: "Chapter 9",
    name: "Chapter 9",
    sections: []
  }
];

function getSaved() {
  try { return JSON.parse(localStorage.getItem('pc_done') || '{}'); } catch { return {}; }
}

function markDone(file) {
  const d = getSaved(); d[file] = true;
  localStorage.setItem('pc_done', JSON.stringify(d));
  render();
}

function render() {
  const done = getSaved();
  const el = document.getElementById('chapters');
  let totalSections = 0, doneSections = 0;

  el.innerHTML = CHAPTERS.map((ch, ci) => {
    const hasSections = ch.sections.length > 0;
    const chDone = ch.sections.filter(s => done[s.file]).length;
    totalSections += ch.sections.length;
    doneSections += chDone;

    const rows = ch.sections.map(s => {
      const isDone = done[s.file];
      return `<div class="section-row ${isDone ? 'done' : ''}">
        <span class="section-name">${s.name}</span>
        <div class="section-actions">
          ${isDone ? '<span class="badge-done">✓ DONE</span>' : ''}
          ${s.file ? `<a class="btn btn-blue btn-sm" href="${s.file}" target="_blank">Open →</a>` : '<span style="font-size:11px;color:#333;">No slideshow yet</span>'}
          ${!isDone && s.file ? `<button class="btn btn-sm" onclick="markDone('${s.file}')">Mark done</button>` : ''}
        </div>
      </div>`;
    }).join('');

    const toolRows = (ch.tools || []).map(t =>
      `<div class="section-row" style="border-color:#1a2e1a">
        <span class="section-name">${t.icon || '🔧'} ${t.name}</span>
        <div class="section-actions">
          <a class="btn btn-sm" href="${t.file}" target="_blank" style="border-color:#1a3a1a;background:#0a1f0a;color:#4aaa4a">Open →</a>
        </div>
      </div>`
    ).join('');

    const emptyMsg = hasSections ? '' : `<div style="font-size:12px;color:#333;padding:8px 0 12px;">No sections built yet — paste a section to Claude to generate one.</div>`;

    return `<div class="chapter">
      <div class="chapter-header" onclick="toggle(${ci})">
        <span class="chapter-title">${ch.name}</span>
        <span class="chapter-progress">${hasSections ? chDone + '/' + ch.sections.length : ''}</span>
      </div>
      <div class="chapter-body" id="ch-${ci}">
        ${rows}
        ${toolRows}
        ${emptyMsg}
      </div>
    </div><hr class="divider">`;
  }).join('');

  document.getElementById('done-count').textContent = doneSections;
  document.getElementById('total-count').textContent = totalSections;
  document.getElementById('pct').textContent = totalSections ? Math.round((doneSections/totalSections)*100) + '%' : '0%';

  // Auto-open chapter 4 since it has content
  const ch4 = document.getElementById('ch-3');
  if (ch4) ch4.classList.add('open');
}

function toggle(i) {
  const el = document.getElementById('ch-' + i);
  el.classList.toggle('open');
}

// ── Notes ──────────────────────────────────────────────────────
function getNotes() {
  try { return JSON.parse(localStorage.getItem('pc_notes') || '[]'); } catch { return []; }
}
function saveNotes(arr) {
  localStorage.setItem('pc_notes', JSON.stringify(arr));
}
function addNote() {
  const input = document.getElementById('noteInput');
  const text = input.value.trim();
  if (!text) return;
  const notes = getNotes();
  const now = new Date();
  const label = (now.getMonth()+1) + '/' + now.getDate() + ' ' + now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  notes.unshift({ text, ts: label, id: Date.now() });
  saveNotes(notes);
  input.value = '';
  renderNotes();
}
function deleteNote(id) {
  const notes = getNotes().filter(n => n.id !== id);
  saveNotes(notes);
  renderNotes();
}
function renderNotes() {
  const notes = getNotes();
  const el = document.getElementById('notesList');
  if (!el) return;
  if (notes.length === 0) {
    el.innerHTML = '<div class="notes-empty">No notes yet — add your first one above.</div>';
    return;
  }
  el.innerHTML = notes.map(n =>
    `<div class="note-item">
      <div class="note-dot"></div>
      <span class="note-text">${n.text.replace(/</g,'&lt;')}</span>
      <span class="note-meta">${n.ts}</span>
      <span class="note-del" onclick="deleteNote(${n.id})" title="Delete">✕</span>
    </div>`
  ).join('');
}
function toggleNotes() {
  const body = document.getElementById('notesBody');
  const icon = document.getElementById('notes-toggle-icon');
  body.classList.toggle('open');
  icon.textContent = body.classList.contains('open') ? '▲' : '▼';
  if (body.classList.contains('open')) renderNotes();
}
// Auto-open notes if there are any saved
if (getNotes().length > 0) {
  document.getElementById('notesBody').classList.add('open');
  document.getElementById('notes-toggle-icon').textContent = '▲';
  renderNotes();
}

render();
</script>
</body>
</html>
