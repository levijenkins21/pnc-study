<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Key Facts — Personal Auto</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e2e2e2;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:1.5rem 1rem;padding-bottom:5rem}
  .top-bar{width:100%;max-width:680px;display:flex;align-items:center;justify-content:space-between;margin-bottom:1.2rem}
  .top-label{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:#5b8dee}
  .top-actions{display:flex;gap:8px}
  .action-btn{padding:5px 12px;font-size:11px;font-weight:500;cursor:pointer;border-radius:7px;border:1px solid #2a2a2a;background:#1a1a1a;color:#888;transition:all .15s}
  .action-btn:hover{background:#252525;color:#ccc}
  .progress-row{width:100%;max-width:680px;margin-bottom:1.2rem}
  .progress-bar{width:100%;height:3px;background:#1a1a1a;border-radius:2px;margin-bottom:.5rem}
  .progress-fill{height:3px;background:#5b8dee;border-radius:2px;transition:width .4s ease}
  .progress-text{font-size:11px;color:#444;display:flex;justify-content:space-between}
  .stats-row{width:100%;max-width:680px;display:flex;gap:8px;margin-bottom:1.2rem}
  .stat-chip{flex:1;background:#141414;border:1px solid #1e1e1e;border-radius:9px;padding:8px 10px;text-align:center}
  .stat-num{font-size:18px;font-weight:700;color:#5b8dee}
  .stat-label{font-size:10px;color:#444;text-transform:uppercase;letter-spacing:.5px}
  .stat-chip.green .stat-num{color:#4aaa4a}
  .stat-chip.amber .stat-num{color:#c8a84b}
  .scene{width:100%;max-width:680px;height:420px;perspective:1000px;cursor:pointer;margin-bottom:1.2rem}
  .card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1)}
  .card.flipped{transform:rotateY(180deg)}
  .face{position:absolute;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;padding:1.6rem;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
  .front{background:#141414;border:1px solid #222}
  .back{background:#0d1a2e;border:1px solid #1e3a6e;transform:rotateY(180deg)}
  .face-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#5b8dee;margin-bottom:.4rem;flex-shrink:0}
  .face-term{font-size:16px;font-weight:700;color:#fff;margin-bottom:.6rem;line-height:1.25;flex-shrink:0}
  .face-def{font-size:13px;color:#aaa;line-height:1.65;overflow-y:auto}
  .face-def strong{color:#e2e2e2}
  .tap-hint{position:absolute;bottom:1rem;right:1.3rem;font-size:11px;color:#333}
  .back .face-label{color:#7aafff}
  .exam-q{font-size:13px;font-weight:600;color:#fff;margin-bottom:.6rem;line-height:1.35;flex-shrink:0}
  .answer-box{background:#0a1428;border:1px solid #1e3a6e;border-radius:10px;padding:9px 12px;margin-bottom:.6rem;font-size:12px;color:#aaa;line-height:1.6;overflow-y:auto}
  .answer-box strong{color:#e2e2e2}
  .hook-box{background:#1c1500;border:1px solid #3a2a00;border-radius:10px;padding:9px 12px;flex-shrink:0}
  .hook-label{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#c8a84b;margin-bottom:3px}
  .hook-text{font-size:12px;color:#f0d080;line-height:1.5}
  .btn-row{width:100%;max-width:680px;display:flex;gap:10px;margin-bottom:.8rem}
  .know-btn{flex:1;padding:13px;font-size:14px;font-weight:600;cursor:pointer;border-radius:12px;border:none;transition:all .15s}
  .btn-got{background:#0d2e0d;border:1px solid #1a4a1a;color:#4aaa4a}
  .btn-got:hover{background:#112e11;border-color:#2a6a2a}
  .btn-still{background:#2e1a00;border:1px solid #4a3000;color:#c8a84b}
  .btn-still:hover{background:#3a2200;border-color:#6a4400}
  .flip-hint{width:100%;max-width:680px;text-align:center;font-size:12px;color:#333;margin-bottom:.5rem}
  .done-screen{display:none;width:100%;max-width:680px;text-align:center;padding:2rem}
  .done-screen.visible{display:block}
  .done-title{font-size:24px;font-weight:700;color:#fff;margin-bottom:.5rem}
  .done-sub{font-size:14px;color:#888;margin-bottom:1.5rem}
  .done-stats{display:flex;gap:12px;justify-content:center;margin-bottom:1.5rem}
  .done-stat{background:#141414;border:1px solid #222;border-radius:12px;padding:1rem 1.5rem;text-align:center}
  .done-stat-num{font-size:28px;font-weight:700}
  .done-stat-label{font-size:11px;color:#555;text-transform:uppercase;letter-spacing:.5px}
  .restart-btn{padding:13px 32px;font-size:14px;font-weight:600;cursor:pointer;border-radius:12px;border:1px solid #1e3a6e;background:#0d1a2e;color:#5b8dee;margin:6px}
  .restart-btn:hover{background:#112244}
</style>
</head>
<body>
<div class="top-bar">
  <span class="top-label">Key Facts · Personal Auto</span>
  <div class="top-actions">
    <button class="action-btn" onclick="shuffleDeck()">⇄ Shuffle</button>
    <button class="action-btn" onclick="resetDeck()">↺ Reset</button>
  </div>
</div>
<div class="progress-row">
  <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>
  <div class="progress-text"><span id="progText"></span><span id="remaining"></span></div>
</div>
<div class="stats-row">
  <div class="stat-chip green"><div class="stat-num" id="gotCount">0</div><div class="stat-label">Got It</div></div>
  <div class="stat-chip"><div class="stat-num" id="totalCount">0</div><div class="stat-label">Total</div></div>
  <div class="stat-chip amber"><div class="stat-num" id="stillCount">0</div><div class="stat-label">Still Learning</div></div>
</div>
<div class="scene" onclick="flip()">
  <div class="card" id="card">
    <div class="face front">
      <div class="face-label" id="frontLabel"></div>
      <div class="face-term" id="frontTerm"></div>
      <div class="face-def" id="frontDef"></div>
      <div class="tap-hint">tap to flip →</div>
    </div>
    <div class="face back">
      <div class="face-label">Exam Question</div>
      <div class="exam-q" id="examQ"></div>
      <div class="answer-box" id="answerBox"></div>
      <div class="hook-box"><div class="hook-label">Memory Hook</div><div class="hook-text" id="hookText"></div></div>
    </div>
  </div>
</div>
<div class="flip-hint" id="flipHint">Read the card, then tap to flip</div>
<div class="btn-row" id="btnRow" style="opacity:.3;pointer-events:none">
  <button class="know-btn btn-still" onclick="mark(false)">↩ Still Learning</button>
  <button class="know-btn btn-got" onclick="mark(true)">✓ Got It</button>
</div>
<div class="done-screen" id="doneScreen">
  <div class="done-title">Round Complete! 🎯</div>
  <div class="done-sub" id="doneSub"></div>
  <div class="done-stats">
    <div class="done-stat"><div class="done-stat-num" style="color:#4aaa4a" id="doneGot">0</div><div class="done-stat-label">Got It</div></div>
    <div class="done-stat"><div class="done-stat-num" style="color:#c8a84b" id="doneStill">0</div><div class="done-stat-label">Still Learning</div></div>
  </div>
  <button class="restart-btn" id="drillBtn" onclick="drillMissed()">Drill Still Learning</button>
  <button class="restart-btn" onclick="resetDeck()">Start Over (All Cards)</button>
  <br><br>
  <a href="PC_Dashboard.html" style="font-size:13px;color:#444;text-decoration:none">← Back to Dashboard</a>
</div>
<a href="PC_Dashboard.html" style="position:fixed;bottom:16px;left:16px;padding:8px 16px;background:#141414;border:1px solid #2a2a2a;border-radius:8px;color:#888;font-size:12px;text-decoration:none;z-index:999">← Home</a>

<script>
const ALL_CARDS = [
  {
    label:"PAP · Liability",
    term:"PAP Liability — BI and PD, Negligence Required",
    def:"PAP liability covers <strong>bodily injury and property damage to others</strong> for which the insured is proven to be <strong>negligent</strong>.<br><br>The <strong>insured's own injuries are not covered</strong> under liability.",
    examQ:"What must be proven for PAP liability to pay, and whose injuries are covered?",
    answer:"The insured must be proven <strong>negligent</strong>. Liability covers BI and PD to <strong>others</strong> — not the insured's own injuries.",
    hook:"Liability = other people's pain when you're to blame. Your own injuries? Wrong coverage — go to medical payments."
  },
  {
    label:"PAP · Liability",
    term:"Auto Assigned Risk Plan — Rejected Drivers, All Insurers",
    def:"The <strong>Auto Assigned Risk Plan</strong> gives high-risk drivers who have been <strong>rejected in the standard market</strong> a way to obtain coverage.<br><br><strong>All authorized insurers</strong> selling auto insurance must participate.",
    examQ:"Who must participate in the Auto Assigned Risk Plan?",
    answer:"<strong>All authorized insurers</strong> selling auto insurance. No opting out — if you sell auto in Kansas, you participate.",
    hook:"Every auto insurer plays. Think of it like a sports draft — the league (state) requires all teams (insurers) to take their share of risky players."
  },
  {
    label:"PAP · Supplementary Payments",
    term:"Supplementary Payments — Loss of Earnings Exception",
    def:"Supplementary payments under a PAP do <strong>NOT</strong> cover the insured's loss of earnings <strong>except</strong> when the insured attends a <strong>hearing or trial at the insurer's request</strong>.<br><br>The insured's own <strong>injuries are never covered</strong> under supplementary payments.",
    examQ:"Under what ONE circumstance do PAP supplementary payments cover the insured's lost earnings?",
    answer:"Only when the insured attends a <strong>hearing or trial at the insurer's request</strong>. That's the only exception.",
    hook:"Lost wages from supplementary payments = only when the insurer drags you to court. Insurer calls you in → insurer pays your time. Otherwise, no lost wages."
  },
  {
    label:"PAP · Liability",
    term:"Radios & Tape Decks — Permanently Installed in Dash",
    def:"A PAP covers radios and tape decks only if they are <strong>permanently installed in the dash</strong> of the vehicle.",
    examQ:"Does a PAP cover a removable radio or a dash-mounted radio?",
    answer:"Only a <strong>permanently installed</strong> dash unit is covered. Removable or portable units are not.",
    hook:"Bolted in = covered. Popped out = not covered. If it comes out with your hand, it's not part of the car — PAP doesn't see it."
  },
  {
    label:"PAP · Medical Payments",
    term:"Auto Med Pay — What It Covers, What It Doesn't",
    def:"Medical payments on a PAP:<br>• Covers <strong>necessary medical AND funeral expenses</strong> from an accident<br>• Covers the <strong>insured and passengers</strong><br>• Is <strong>no-fault</strong> — pays regardless of who caused the accident<br>• Is <strong>optional coverage</strong><br>• Does <strong>NOT pay lost wages</strong><br>• Does <strong>NOT cover pedestrians</strong>",
    examQ:"Does auto med pay cover lost wages or pedestrians?",
    answer:"<strong>No to both.</strong> Med pay covers medical and funeral expenses for insured and passengers only — no lost wages, no pedestrians.",
    hook:"Med pay = medical and funeral, no wages, no walkers. It covers people IN the car (plus you), not people hit outside it, and never your lost income."
  },
  {
    label:"PAP · Medical Payments",
    term:"At-Fault Driver's Injuries = Med Pay",
    def:"On a PAP, if the insured is the <strong>at-fault driver</strong>, their own injuries are covered under the <strong>medical payments</strong> section — not under liability.",
    examQ:"If the insured causes an accident and is injured, which PAP coverage pays for their injuries?",
    answer:"<strong>Medical payments</strong> — not liability. Liability only pays others. Med pay is no-fault and covers the insured regardless of fault.",
    hook:"At-fault = your injuries go to med pay. Liability handles others. You hurt yourself in a crash you caused? Med pay has you, not liability."
  },
  {
    label:"PAP · Physical Damage",
    term:"Coverage D — Collision vs. Other Than Collision",
    def:"<strong>Coverage D</strong> on a PAP is physical damage coverage for the insured's own car. It is:<br>• <strong>Optional</strong><br>• Written on an <strong>ACV basis</strong><br>• Subject to a <strong>deductible</strong><br>• Divided into <strong>collision</strong> and <strong>other than collision</strong> (comprehensive)",
    examQ:"What valuation basis applies to Coverage D on a PAP?",
    answer:"<strong>ACV (Actual Cash Value)</strong> — minus depreciation. Coverage D is optional and always has a deductible.",
    hook:"Coverage D = ACV with a deductible, split two ways. D for Damage. ACV = what it's worth NOW, not what you paid. Deductible = your share."
  },
  {
    label:"PAP · Physical Damage",
    term:"Collision vs. Other Than Collision — What Goes Where",
    def:"<strong>Collision</strong> covers: hitting another object, <strong>rollover, and upset</strong>.<br><br><strong>Other than collision (comprehensive)</strong> covers: everything else — hitting a deer, bird strikes, hail, theft, fire, flood, etc.<br><br>Examples:<br>• Hitting a pole → <strong>collision</strong><br>• Hitting a deer → <strong>other than collision</strong><br>• Bird hits windshield → <strong>other than collision</strong>",
    examQ:"Is hitting a deer a collision or other than collision loss?",
    answer:"<strong>Other than collision.</strong> Hitting a pole = collision. Hitting an animal = other than collision (comprehensive).",
    hook:"Collision = you hit something you could steer around. Deer, birds, hail — those are acts of nature or chance, so they're 'other than collision.' Pole = you drove into it."
  },
  {
    label:"PAP · Physical Damage",
    term:"Towing & Labor — Optional, Per Occurrence",
    def:"<strong>Towing and labor</strong> is an <strong>optional coverage</strong> on the PAP that costs extra.<br><br>The limit pays on a <strong>per event / per occurrence basis</strong>.",
    examQ:"On a PAP, how does the towing and labor limit apply?",
    answer:"<strong>Per occurrence (per event)</strong> — each separate breakdown or tow is its own event, subject to the limit each time.",
    hook:"Towing pays per tow. Each time you need a tow, the limit resets. It's optional and extra — not automatically included."
  },
  {
    label:"PAP · Physical Damage",
    term:"Owner's PAP = Primary | Driver's PAP = Excess",
    def:"When two PAP policies could apply to the same accident:<br>• The <strong>owner's PAP is always primary</strong><br>• The <strong>driver's PAP (if different) is always excess</strong>",
    examQ:"Whose PAP is primary when the owner's car is driven by someone else who has their own PAP?",
    answer:"The <strong>owner's PAP is primary</strong>. The driver's PAP is excess — it pays only after the owner's policy is exhausted.",
    hook:"Owner = primary, driver = backup. It's your car, your policy goes first. Think: whose name is on the title? That's the primary."
  },
  {
    label:"PAP · UM / UIM",
    term:"Uninsured Motorist — 3 Types of Uninsured Drivers",
    def:"An <strong>uninsured motorist</strong> includes:<br>1. A <strong>hit-and-run driver</strong><br>2. A driver whose <strong>insurer has gone bankrupt</strong><br>3. A driver who does <strong>NOT carry the state minimum limits</strong>",
    examQ:"Name three types of drivers that qualify as 'uninsured' under a PAP UM endorsement.",
    answer:"<strong>Hit-and-run, bankrupt insurer, and below-minimum limits.</strong> All three count as uninsured for UM purposes.",
    hook:"HBB = Hit-and-run, Bankrupt insurer, Below minimums. Three ways to be 'uninsured' even if you technically have a policy."
  },
  {
    label:"PAP · UM / UIM",
    term:"UIM — For Drivers With Inadequate Limits",
    def:"<strong>Underinsured motorist (UIM)</strong> coverage protects the insured when they are in an accident with someone who is <strong>at-fault but has inadequate liability limits</strong> — not zero, just not enough.",
    examQ:"What's the difference between UM and UIM coverage?",
    answer:"<strong>UM</strong> = the other driver has NO insurance (or counts as uninsured). <strong>UIM</strong> = the other driver has insurance but not ENOUGH to cover your damages.",
    hook:"UM = zero. UIM = too little. Think: Uninsured = nobody home. Underinsured = they showed up but brought pocket change."
  },
  {
    label:"PAP · Exclusions",
    term:"No PAP Coverage in Mexico",
    def:"A PAP does <strong>NOT provide coverage in Mexico</strong>. Mexico requires its own separate insurance.",
    examQ:"Does a PAP cover an accident that occurs in Mexico?",
    answer:"<strong>No.</strong> Mexico is excluded. You must purchase a separate Mexican auto policy for coverage there.",
    hook:"PAP stops at the border. Mexico = no coverage — buy Mexican insurance before you cross. No exceptions."
  },
  {
    label:"PAP · Exclusions",
    term:"PAP Excludes Insured's Property in Transit",
    def:"A PAP does <strong>NOT cover the insured's own property</strong> that is being transported in the vehicle.",
    examQ:"If the insured's laptop is damaged in a car accident, does the PAP cover it?",
    answer:"<strong>No.</strong> The PAP excludes the insured's personal property in transit. That would need homeowners or renters insurance.",
    hook:"PAP covers the car, not the cargo. Your stuff in the trunk? That's a homeowners claim, not an auto claim."
  },
  {
    label:"PAP · Exclusions",
    term:"Small Pickups OK — No Motorcycles, Dump Trucks, Farm Implements",
    def:"A PAP will cover <strong>small pick-up trucks</strong>, even if used for farming or ranching.<br><br>A PAP will NOT cover:<br>• <strong>Motorcycles</strong><br>• <strong>Dump trucks</strong><br>• <strong>Farm implements driven on the highway</strong>",
    examQ:"Will a PAP cover a small pickup used on a farm?",
    answer:"<strong>Yes.</strong> Small pickups are covered even for farming. But motorcycles, dump trucks, and farm implements on the highway are excluded.",
    hook:"PAP loves pickup trucks, even farm ones. But no bikes, no dump trucks, no tractors on the highway. Small + truck = fine. Big + specialty = find another policy."
  },
  {
    label:"PAP · Exclusions",
    term:"Other Than Collision Exclusions — Wear, Freeze, Breakdown",
    def:"On a PAP, the <strong>other than collision (comprehensive)</strong> coverage excludes:<br>• <strong>Wear and tear</strong><br>• <strong>Freezing</strong><br>• <strong>Mechanical breakdown</strong>",
    examQ:"Name three things excluded from PAP other than collision coverage.",
    answer:"<strong>Wear and tear, freezing, and mechanical breakdown.</strong> These are maintenance issues — not sudden, accidental losses.",
    hook:"WFM excluded from comprehensive: Wear, Freeze, Mechanical. Think 'What's For Maintenance?' — those three aren't accidents, they're neglect."
  },
  {
    label:"PAP · Exclusions",
    term:"No Livery or Taxi Use — Carpools Are Covered",
    def:"A PAP does <strong>NOT cover autos used as taxis or livery</strong> (vehicles for hire).<br><br>However, <strong>carpools are covered</strong> — driving coworkers to share the commute is not livery.",
    examQ:"Is a carpool covered under a standard PAP?",
    answer:"<strong>Yes — carpools are covered.</strong> Using your car as a taxi or for-hire livery service is excluded, but sharing a ride to work is fine.",
    hook:"Carpool = fine. Taxi = no. If you're charging strangers per ride (Uber, taxi), that's livery — excluded. If you're splitting gas with coworkers, PAP covers it."
  }
];

let deck=[],current=0,gotIt=0,stillLearning=0,isFlipped=false,hasFlipped=false;
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function shuffleDeck(){deck=shuffle([...ALL_CARDS]);current=0;gotIt=0;stillLearning=0;show();renderCard()}
function resetDeck(){deck=[...ALL_CARDS];current=0;gotIt=0;stillLearning=0;show();renderCard()}
function drillMissed(){const m=deck.filter(c=>c._missed);if(!m.length){resetDeck();return}deck=shuffle(m.map(c=>({...c,_missed:false})));current=0;gotIt=0;stillLearning=0;show();renderCard()}
function show(){document.getElementById('doneScreen').classList.remove('visible');document.querySelector('.scene').style.display='';document.querySelector('.progress-row').style.display='';document.querySelector('.stats-row').style.display='';document.getElementById('flipHint').style.display='';document.getElementById('btnRow').style.display=''}
function renderCard(){
  if(current>=deck.length){showDone();return}
  const c=deck[current];isFlipped=false;hasFlipped=false;
  document.getElementById('card').classList.remove('flipped');
  document.getElementById('frontLabel').textContent=c.label;
  document.getElementById('frontTerm').textContent=c.term;
  document.getElementById('frontDef').innerHTML=c.def;
  document.getElementById('examQ').textContent=c.examQ;
  document.getElementById('answerBox').innerHTML=c.answer;
  document.getElementById('hookText').textContent=c.hook;
  const b=document.getElementById('btnRow');b.style.opacity='.3';b.style.pointerEvents='none';
  document.getElementById('flipHint').textContent='Read the card, then tap to flip';
  document.getElementById('fill').style.width=Math.round(current/deck.length*100)+'%';
  document.getElementById('progText').textContent=`Card ${current+1} of ${deck.length}`;
  document.getElementById('remaining').textContent=`${deck.length-current} remaining`;
  document.getElementById('gotCount').textContent=gotIt;
  document.getElementById('totalCount').textContent=ALL_CARDS.length;
  document.getElementById('stillCount').textContent=stillLearning;
}
function flip(){isFlipped=!isFlipped;document.getElementById('card').classList.toggle('flipped',isFlipped);if(isFlipped&&!hasFlipped){hasFlipped=true;const b=document.getElementById('btnRow');b.style.opacity='1';b.style.pointerEvents='auto';document.getElementById('flipHint').textContent='How did you do?'}}
function mark(knew){if(knew){gotIt++;deck[current]._missed=false}else{stillLearning++;deck[current]._missed=true}current++;renderCard()}
function showDone(){
  document.querySelector('.scene').style.display='none';document.querySelector('.progress-row').style.display='none';document.querySelector('.stats-row').style.display='none';document.getElementById('flipHint').style.display='none';document.getElementById('btnRow').style.display='none';
  document.getElementById('doneGot').textContent=gotIt;document.getElementById('doneStill').textContent=stillLearning;
  const pct=Math.round(gotIt/deck.length*100);
  document.getElementById('doneSub').textContent=pct===100?'Perfect round! Every card locked in. 🔒':`${pct}% this round — ${stillLearning} card${stillLearning!==1?'s':''} to drill.`;
  document.getElementById('drillBtn').style.display=stillLearning>0?'inline-block':'none';
  document.getElementById('doneScreen').classList.add('visible');
}
resetDeck();
</script>
</body>
</html>
