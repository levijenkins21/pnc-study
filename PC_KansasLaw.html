<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kansas State Law — P&C Study</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0a0a0a;--surface:#0a0f1a;--surface2:#0f1520;
  --border:#1a2030;--border2:#1e2840;
  --gold:#c8a84b;--gold-dim:rgba(200,168,75,.12);
  --blue:#60a5fa;--blue-dim:rgba(96,165,250,.1);
  --green:#4aaa4a;--green-dim:rgba(74,170,74,.12);
  --red:#aa4a4a;--red-dim:rgba(170,74,74,.12);
  --text:#e2e2e2;--muted:#556;--muted2:#2a3040;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent;user-select:none;}
#progress-rail{position:fixed;top:0;left:0;width:100%;height:3px;background:var(--border);z-index:100;}
#progress-fill{height:100%;background:var(--blue);width:0%;transition:width .4s ease;}
.header{padding:20px 20px 0;padding-top:22px;}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.back-link{color:var(--muted);font-size:12px;text-decoration:none;}
.deck-tag{font-size:10px;font-weight:600;letter-spacing:1px;color:var(--blue);background:var(--blue-dim);border:1px solid rgba(96,165,250,.25);padding:3px 10px;border-radius:20px;}
.header h1{font-size:22px;font-weight:700;color:#fff;margin-bottom:2px;}
.header-sub{font-size:12px;color:var(--muted);}
.ks-badge{display:inline-flex;align-items:center;gap:6px;background:var(--blue-dim);border:1px solid rgba(96,165,250,.2);border-radius:8px;padding:6px 12px;margin-top:8px;margin-bottom:0;}
.ks-badge span{font-size:11px;color:var(--blue);font-weight:600;}
.mode-tabs{display:flex;padding:0 20px;margin-top:16px;border-bottom:1px solid var(--border);}
.mode-tab{font-size:12px;font-weight:500;color:var(--muted);padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit;}
.mode-tab.active{color:var(--blue);border-bottom-color:var(--blue);}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border-bottom:1px solid var(--border);}
.stat-cell{background:var(--bg);padding:12px 6px;text-align:center;}
.stat-val{font-size:24px;font-weight:700;color:var(--blue);line-height:1;}
.stat-val.g{color:var(--green);}
.stat-val.r{color:var(--red);}
.stat-lbl{font-size:9px;font-weight:600;letter-spacing:1px;color:var(--muted);margin-top:2px;text-transform:uppercase;}
#flash-view{padding:16px 16px 80px;}
.mode-banner{display:none;background:rgba(170,74,74,.12);border:1px solid rgba(170,74,74,.25);border-radius:8px;padding:8px 14px;margin-bottom:12px;font-size:11px;color:var(--red);text-align:center;font-weight:600;letter-spacing:.5px;}
.mode-banner.visible{display:block;}
.card-nav-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.card-pos{font-size:12px;color:var(--muted);}
.card-pos strong{color:var(--text);}
.skip-btn{background:none;border:none;color:var(--muted2);font-size:11px;cursor:pointer;font-family:inherit;}
.card-scene{perspective:1200px;margin-bottom:10px;cursor:pointer;touch-action:pan-y;}
.card{position:relative;width:100%;min-height:260px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1);border-radius:12px;}
.card.flipped{transform:rotateY(180deg);}
.card-face{position:absolute;top:0;left:0;right:0;min-height:260px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;padding:18px 16px;display:flex;flex-direction:column;pointer-events:none;}
.card-front{background:var(--surface);border:1px solid var(--border2);box-shadow:0 4px 20px rgba(0,0,0,.5);}
.card-back{background:#050d1a;border:1px solid #0d2040;box-shadow:0 4px 20px rgba(0,0,0,.5);transform:rotateY(180deg);}
.cat-pill{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;letter-spacing:.5px;padding:3px 10px;border-radius:20px;margin-bottom:10px;width:fit-content;background:var(--blue-dim);border:1px solid rgba(96,165,250,.2);color:var(--blue);}
.card-label{font-size:9px;font-weight:600;letter-spacing:2px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;}
.card-q{font-size:15px;line-height:1.75;color:var(--text);font-weight:400;flex:1;}
.flip-cue{margin-top:12px;text-align:center;font-size:10px;color:var(--muted2);}
.card-a{font-size:13px;line-height:1.9;color:var(--text);flex:1;}
.card-a strong{color:var(--blue);font-weight:700;font-size:15px;}
.card-a .num{display:inline-block;font-size:28px;font-weight:700;color:var(--blue);line-height:1.2;margin-bottom:4px;}
.card-a .rule{margin-top:8px;padding:8px 10px;background:rgba(96,165,250,.06);border-left:3px solid var(--blue);border-radius:0 6px 6px 0;font-size:12px;line-height:1.6;color:#90b8e8;}
.mem-box{margin-top:10px;background:rgba(74,170,74,.07);border:1px solid rgba(74,170,74,.15);border-radius:8px;padding:10px 12px;}
.mem-label{font-size:9px;font-weight:600;letter-spacing:1px;color:var(--green);margin-bottom:3px;text-transform:uppercase;}
.mem-text{font-size:11px;color:#5fb85f;line-height:1.6;}
.swipe-hint{position:absolute;inset:0;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;letter-spacing:2px;opacity:0;pointer-events:none;z-index:5;transition:opacity .1s;}
.swipe-hint.knew{background:rgba(74,170,74,.15);color:var(--green);border:2px solid rgba(74,170,74,.3);}
.swipe-hint.missed{background:rgba(170,74,74,.12);color:var(--red);border:2px solid rgba(170,74,74,.25);}
.flip-btn-wrap{margin-bottom:10px;}
.flip-btn{width:100%;background:var(--surface2);border:1px solid var(--border2);color:var(--text);font-size:14px;font-weight:600;padding:13px;border-radius:8px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s;}
.flip-btn:active{background:var(--border);}
.answer-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.answer-btns.hidden{display:none;}
.ans-btn{border:1px solid;font-size:14px;font-weight:700;padding:13px 16px;border-radius:8px;cursor:pointer;font-family:inherit;transition:transform .1s;}
.ans-btn:active{transform:scale(0.97);}
.btn-missed{background:var(--red-dim);border-color:rgba(170,74,74,.3);color:var(--red);}
.btn-knew{background:var(--green-dim);border-color:rgba(74,170,74,.3);color:var(--green);}
.bottom-nav{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:4px;}
.nav-btn{background:var(--surface2);border:1px solid var(--border2);color:var(--text);font-size:14px;font-weight:600;padding:12px;border-radius:8px;cursor:pointer;font-family:inherit;}
.nav-btn:active:not(:disabled){background:var(--border);}
.nav-btn:disabled{opacity:.25;cursor:not-allowed;}
.nav-btn.primary{background:var(--blue);border-color:var(--blue);color:#050a14;}
.nav-btn.primary:active{background:#4090e0;}
.kb-hint{text-align:center;font-size:10px;color:var(--muted2);margin-top:6px;}
#list-view{display:none;padding:12px 16px 80px;}
.cat-hdr{display:flex;align-items:center;gap:8px;padding:14px 0 8px;border-bottom:1px solid var(--border);margin-bottom:10px;margin-top:6px;}
.cat-icon{font-size:15px;}.cat-lbl{font-size:11px;font-weight:600;letter-spacing:1px;color:var(--muted);text-transform:uppercase;}.cat-count{font-size:18px;font-weight:700;color:var(--muted2);margin-left:auto;}
.list-card{background:var(--surface);border:1px solid var(--border2);border-radius:8px;padding:14px 16px;margin-bottom:8px;}
.list-q{font-size:12px;color:var(--muted);margin-bottom:6px;line-height:1.6;}
.list-a{font-size:13px;color:var(--text);line-height:1.75;margin-bottom:6px;}
.list-a strong{color:var(--blue);}
.list-mem{font-size:11px;color:#5fb85f;line-height:1.6;border-top:1px solid rgba(74,170,74,.1);padding-top:6px;}
#score-view{display:none;padding:28px 20px;text-align:center;}
.score-ring-wrap{position:relative;width:160px;height:160px;margin:0 auto 20px;}
.score-ring-wrap svg{transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:var(--border);stroke-width:12;}
.ring-fill{fill:none;stroke:var(--blue);stroke-width:12;stroke-linecap:round;transition:stroke-dasharray 1s ease;}
.ring-fill.good{stroke:var(--green);}
.score-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.score-pct{font-size:48px;font-weight:700;color:#fff;line-height:1;}
.score-of{font-size:10px;font-weight:600;letter-spacing:1px;color:var(--muted);margin-top:2px;}
.score-breakdown{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.score-block{background:var(--surface);border:1px solid var(--border2);border-radius:8px;padding:14px;}
.score-block-val{font-size:32px;font-weight:700;line-height:1;margin-bottom:4px;}
.score-block-val.g{color:var(--green);}
.score-block-val.r{color:var(--red);}
.score-block-lbl{font-size:10px;font-weight:600;letter-spacing:1px;color:var(--muted);text-transform:uppercase;}
.score-msg{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:20px;}
.score-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.score-btn{border:none;font-size:13px;font-weight:700;padding:13px;border-radius:8px;cursor:pointer;font-family:inherit;}
.btn-restart{background:var(--surface2);border:1px solid var(--border2);color:var(--text);}
.btn-missed-only{background:var(--red-dim);border:1px solid rgba(170,74,74,.3);color:var(--red);}
.btn-missed-only:disabled{opacity:.3;cursor:not-allowed;}
</style>
</head>
<body>
<div id="progress-rail"><div id="progress-fill"></div></div>
<div class="header">
  <div class="header-top">
    <a class="back-link" href="PC_Dashboard.html">← Dashboard</a>
    <span class="deck-tag" id="deck-tag">KANSAS LAW</span>
  </div>
  <h1>🏛️ Kansas State Law</h1>
  <div class="header-sub">Low-hanging fruit — pure memorization, guaranteed points</div>
</div>
<div class="mode-tabs">
  <button class="mode-tab active" onclick="setMode('flash',this)">Flashcards</button>
  <button class="mode-tab" onclick="setMode('list',this)">Review All</button>
</div>
<div class="stats-row">
  <div class="stat-cell"><div class="stat-val" id="s-total">0</div><div class="stat-lbl">Total</div></div>
  <div class="stat-cell"><div class="stat-val g" id="s-knew">0</div><div class="stat-lbl">Knew It</div></div>
  <div class="stat-cell"><div class="stat-val r" id="s-missed">0</div><div class="stat-lbl">Missed</div></div>
  <div class="stat-cell"><div class="stat-val" id="s-pct">—</div><div class="stat-lbl">Score</div></div>
</div>
<div id="flash-view">
  <div class="mode-banner" id="mode-banner">REVIEWING MISSED CARDS</div>
  <div class="card-nav-row">
    <div class="card-pos"><strong id="cur-num">1</strong> / <span id="tot-num">0</span></div>
    <button class="skip-btn" onclick="nextCard()">Skip →</button>
  </div>
  <div class="card-scene" id="card-scene">
    <div class="card" id="card">
      <div class="card-face card-front" id="cf-front"></div>
      <div class="card-face card-back" id="cf-back"></div>
    </div>
    <div class="swipe-hint knew" id="sh-knew">✓ KNEW IT</div>
    <div class="swipe-hint missed" id="sh-missed">✕ MISSED</div>
  </div>
  <div class="flip-btn-wrap">
    <button class="flip-btn" id="flip-btn" onclick="flipCard()">
      <span>↻</span><span id="flip-label">Reveal Answer</span>
    </button>
  </div>
  <div class="answer-btns hidden" id="ans-btns">
    <button class="ans-btn btn-missed" onclick="markCard(false)">✕ Missed It</button>
    <button class="ans-btn btn-knew" onclick="markCard(true)">✓ Knew It</button>
  </div>
  <div class="bottom-nav">
    <button class="nav-btn" id="prev-btn" onclick="prevCard()" disabled>◀ Prev</button>
    <button class="nav-btn primary" id="next-btn" onclick="nextCard()">Next ▶</button>
  </div>
  <div class="kb-hint">Space = flip · K = knew · M = missed · ← → navigate</div>
</div>
<div id="list-view"></div>
<div id="score-view">
  <div class="score-ring-wrap">
    <svg width="160" height="160" viewBox="0 0 160 160">
      <circle class="ring-bg" cx="80" cy="80" r="66"/>
      <circle class="ring-fill" id="ring-fill" cx="80" cy="80" r="66" stroke-dasharray="0 415"/>
    </svg>
    <div class="score-center">
      <div class="score-pct" id="fin-pct">0%</div>
      <div class="score-of" id="fin-of">OF 0</div>
    </div>
  </div>
  <div class="score-breakdown">
    <div class="score-block"><div class="score-block-val g" id="fin-knew">0</div><div class="score-block-lbl">Knew It</div></div>
    <div class="score-block"><div class="score-block-val r" id="fin-missed">0</div><div class="score-block-lbl">Still Learning</div></div>
  </div>
  <div class="score-msg" id="score-msg"></div>
  <div class="score-actions">
    <button class="score-btn btn-restart" onclick="restart(false)">Full Deck</button>
    <button class="score-btn btn-missed-only" id="btn-missed-only" onclick="restart(true)">Review Missed</button>
  </div>
</div>

<script>
const CATS={
  auto:'🚗 Auto & PIP',
  licensing:'📋 Licensing',
  penalties:'⚠️ Fines & Penalties',
  notice:'📬 Notice Requirements',
  orgs:'🏛️ Organizations',
  producers:'🤝 Producers & Agents',
  rates:'📊 Rate Filing',
};

const ALL_CARDS=[
  // ── AUTO & PIP ──
  {c:'auto',
   q:'What are the minimum auto liability limits required in Kansas?',
   a:'<div class="num">25 / 50 / 25</div><div class="rule">$25,000 per person (BI) · $50,000 per accident (BI) · $25,000 per accident (PD)</div>',
   m:'"25-50-25 in Kansas." Person / Accident / Property Damage. Say it three times.'},
  {c:'auto',
   q:'Is PIP (Personal Injury Protection) mandatory in Kansas?',
   a:'<strong>Yes — mandatory</strong> on all Kansas auto liability policies.<br><br>Kansas is a no-fault state. PIP pays regardless of who caused the accident.',
   m:'"Kansas = no-fault = PIP required." Every auto policy must include it.'},
  {c:'auto',
   q:'What are the four PIP benefit limits in Kansas?',
   a:'<strong>Medical expenses:</strong> $4,500<br><strong>Disability income:</strong> $900/month (up to 1 year)<br><strong>Survivor benefit:</strong> $25/day (up to $4,500 total)<br><strong>Funeral expenses:</strong> $2,000',
   m:'"4,500 · 900 · 25 · 2,000." Medical biggest, funeral smallest. Survivor = $25/day capped at $4,500.'},
  {c:'auto',
   q:'What is the time limit for filing a PIP claim in Kansas?',
   a:'<strong>2 years from the date of injury.</strong><br><br>Claims not submitted within 2 years of the injury date are not payable.',
   m:'"PIP = 2 years." Clock starts at injury date, not accident report or treatment date.'},
  {c:'auto',
   q:'When an insurer cancels an auto liability policy for reasons OTHER than nonpayment, what must the insurer tell the insured?',
   a:'The insurer must notify the insured about possible eligibility for coverage through the <strong>Kansas Automobile Insurance Plan (KAIP).</strong><br><br>Note: Nonpayment cancellation does NOT trigger this notice.',
   m:'"Cancelled (not nonpayment) → tell them about KAIP." The KAIP notice only applies when something other than nonpayment caused the cancel.'},
  {c:'auto',
   q:'What is the Kansas Automobile Insurance Plan (KAIP)?',
   a:'The <strong>assigned risk pool</strong> for drivers who cannot obtain auto insurance in the voluntary market.<br><br>High-risk drivers are assigned to insurers participating in the plan.',
   m:'"KAIP = last resort auto coverage for high-risk drivers." Insurers must participate and accept assigned drivers.'},

  // ── LICENSING ──
  {c:'licensing',
   q:'How often must a Kansas insurance producer renew their license?',
   a:'<strong>Biennially — every 2 years.</strong>',
   m:'"Biennial = every 2 years." Bi = 2. Same as binoculars (2 lenses).'},
  {c:'licensing',
   q:'How many CE credit hours are required each renewal period in Kansas?',
   a:'<strong>24 credit hours</strong> per 2-year renewal period.',
   m:'"24 hours of CE every 2 years." One day of training = a full renewal period covered.'},
  {c:'licensing',
   q:'How many of the 24 CE hours must be in ethics?',
   a:'<strong>3 hours in ethics</strong> every renewal period.',
   m:'"3 ethics hours." Out of 24 total, 3 must be ethics. Not 2, not 4 — 3.'},
  {c:'licensing',
   q:'For what reasons may a temporary insurance license be issued in Kansas?',
   a:'Valid reasons: <strong>disability</strong> of the agent, <strong>military service</strong>, or <strong>death</strong> of an agent (for business continuity).<br><br><strong>NOT valid: retirement.</strong> Retirement is planned — no emergency exists.',
   m:'"Disability, military, death — yes. Retirement — no." You planned to retire, so no temp license needed.'},
  {c:'licensing',
   q:'After the initial temporary license period, how long can it be extended in Kansas?',
   a:'One additional period of <strong>180 days</strong> (at the Commissioner\'s discretion under special circumstances).',
   m:'"Temp license extension = 180 days." Six months. Not 60, not 90 — 180.'},
  {c:'licensing',
   q:'What does "authorized insurer" mean in Kansas?',
   a:'<strong>Admitted.</strong> An authorized/admitted insurer has met Kansas financial requirements and is approved to transact insurance in the state.<br><br>Unauthorized = non-admitted = surplus/excess lines.',
   m:'"Authorized = admitted = state-approved." Unauthorized = surplus lines.'},

  // ── FINES & PENALTIES ──
  {c:'penalties',
   q:'What is the fine for each WILLFUL violation of Kansas statutes regarding unfair methods of competition?',
   a:'<strong>$5,000 per willful violation.</strong>',
   m:'"$5k per willful violation." Memorize both the per-violation amount AND the aggregate cap.'},
  {c:'penalties',
   q:'What is the MAXIMUM aggregate fine for willful violations of insurance statutes in Kansas?',
   a:'<strong>$50,000 maximum aggregate.</strong><br><br>At $5,000 per violation, the ceiling is hit after 10 violations.',
   m:'"$50k aggregate cap." $5k × 10 = $50k ceiling. Both numbers appear on the exam.'},
  {c:'penalties',
   q:'What premium tax must excess (surplus) lines agents remit to the State of Kansas?',
   a:'<strong>6% of the gross premium.</strong><br><br>Gross = total premium received. Paid by the excess lines agent to the state.',
   m:'"Excess lines = 6% gross." Gross not net. 6%.'},

  // ── NOTICE REQUIREMENTS ──
  {c:'notice',
   q:'How many days advance written notice must an insurer give when nonrenewing a COMMERCIAL insurance policy in Kansas?',
   a:'<strong>60 days</strong> advance written notice to the first named insured before expiration.',
   m:'"Commercial nonrenewal = 60 days." Personal lines may differ. Commercial = 60.'},
  {c:'notice',
   q:'Under a BOP, if an insurer nonrenews for nonpayment of premium, how many days before expiration must the mortgageholder be notified?',
   a:'<strong>10 days</strong> before the policy expires.',
   m:'"Nonpayment mortgageholder notice = 10 days." Shortest window. Nonpayment is the quickest exit for the insurer.'},
  {c:'notice',
   q:'Personal auto cancellation for NONPAYMENT of premium — how many days notice to the insured?',
   a:'<strong>10 days</strong> written notice.',
   m:'"Nonpayment = 10 days." Short window for nonpayment. Other reasons get more time.'},
  {c:'notice',
   q:'Personal auto cancellation for reasons OTHER than nonpayment — how many days notice?',
   a:'<strong>30 days</strong> written notice.',
   m:'"Other reasons = 30 days." Nonpayment = 10. Everything else = 30.'},

  // ── ORGANIZATIONS ──
  {c:'orgs',
   q:'Is membership in KIGA (Kansas Insurance Guaranty Association) required or optional for admitted P&C insurers?',
   a:'<strong>REQUIRED.</strong> All admitted P&C insurers in Kansas must be members of KIGA. No exceptions.',
   m:'"KIGA = mandatory." Every admitted P&C insurer must join. No opt-out.'},
  {c:'orgs',
   q:'What does KIGA do?',
   a:'KIGA <strong>pays covered claims</strong> of insolvent member insurers, up to specified limits.<br><br>Protects policyholders when their insurer goes bankrupt. Funded by assessments on member insurers.',
   m:'"KIGA = safety net when an insurer fails." Your insurer goes broke → KIGA steps in.'},
  {c:'orgs',
   q:'Is membership in the Kansas FAIR Plan required or optional for admitted insurers?',
   a:'<strong>OPTIONAL.</strong> Insurers choose whether to participate in the FAIR Plan.<br><br>⚠️ Contrast: KIGA membership is REQUIRED. FAIR Plan is VOLUNTARY.',
   m:'"FAIR Plan = optional. KIGA = required." Don\'t mix these up — it\'s a classic exam trap.'},
  {c:'orgs',
   q:'What is the Kansas FAIR Plan?',
   a:'A <strong>voluntary pool</strong> providing property insurance to owners of hard-to-insure properties (typically urban areas) who cannot get coverage in the standard market.',
   m:'"FAIR Plan = last resort property insurance." Not auto — property. Membership is optional for insurers.'},

  // ── PRODUCERS & AGENTS ──
  {c:'producers',
   q:'Who does an insurance AGENT represent?',
   a:'An agent represents the <strong>insurance company.</strong><br><br>An agent is appointed by and acts on behalf of one or more insurers.',
   m:'"Agent = company side." Appointed BY the company. The company is the principal.'},
  {c:'producers',
   q:'Who does an insurance BROKER represent?',
   a:'A broker represents the <strong>insured/client.</strong><br><br>A broker shops the market on the client\'s behalf and is not appointed by any insurer.',
   m:'"Broker = client side." Hired BY you. Works for you, not the company.'},
  {c:'producers',
   q:'Is rebating ever allowed in Kansas, even if it benefits the client?',
   a:'<strong>Never.</strong> Rebating is always illegal regardless of intent or whether the client benefits.<br><br>Rebating = giving anything of monetary value as an inducement to purchase insurance.',
   m:'"No good-intention exception." Best interest doesn\'t legalize rebating. It\'s always illegal.'},
  {c:'producers',
   q:'Are dividends paid by a mutual insurer considered rebating?',
   a:'<strong>No — dividends from a mutual insurer are NOT a rebate.</strong><br><br>The policy itself discloses that dividends may be paid, so they are a contractual possibility — not a secret inducement.',
   m:'"Policy says dividends may come → not a rebate." Disclosed in the contract upfront = not corrupt.'},
  {c:'producers',
   q:'Is returning unused (unearned) premium to the insured considered rebating?',
   a:'<strong>No.</strong> Return of unearned premium is not rebating — it is simply returning money the insurer never earned because coverage was cancelled.',
   m:'"Returning YOUR money = not rebating." The insurer is just giving back what it didn\'t earn.'},
  {c:'producers',
   q:'What is twisting in Kansas insurance law?',
   a:'<strong>Misrepresenting</strong> the terms or benefits of an existing policy to induce an insured to <strong>lapse, forfeit, or replace</strong> that policy with another.',
   m:'"Twisting = lying to make someone switch." If you twist the truth to get them to replace their policy, it\'s twisting.'},

  // ── RATE FILING ──
  {c:'rates',
   q:'What three requirements must Kansas insurance rates meet?',
   a:'Rates must be:<br><strong>1. Adequate</strong> — sufficient to pay claims<br><strong>2. Not excessive</strong> — not too high<br><strong>3. Not unfairly discriminatory</strong> — similar risks pay similar rates',
   m:'"Adequate, not excessive, not unfairly discriminatory." Three-part test. All three must be met.'},
  {c:'rates',
   q:'Which types of commercial insurance are EXEMPT from Kansas rate filing requirements?',
   a:'Exempt: <strong>inland marine, highly protected risks (HPR), boiler and machinery.</strong><br><br>Also exempt: large commercial risks that meet specific size/premium criteria.',
   m:'"Inland marine, HPR, boiler and machinery = exempt." Specialized or hard-to-rate risks get filing exemptions.'},
  {c:'rates',
   q:'Are small commercial risks that are manually rated exempt from Kansas rate filing rules?',
   a:'<strong>No — NOT exempt.</strong><br><br>Small commercial risks that use manual (standard) rates must comply with rate filing requirements. Only large or specialized commercial risks qualify for exemptions.',
   m:'"Manual-rated small commercial = NOT exempt." Only large/specialized commercial gets the pass. Everyday small business = must file.'},
];

const TOTAL=ALL_CARDS.length;
let deck=[...ALL_CARDS];
let cur=0,flipped=false;
let scores=new Array(TOTAL).fill(null);
let deckIndices=[...Array(TOTAL).keys()];
let touchStartX=0,isDragging=false;
const CIRC=2*Math.PI*66;

document.getElementById('s-total').textContent=TOTAL;
document.getElementById('tot-num').textContent=TOTAL;
document.getElementById('fin-of').textContent='OF '+TOTAL;
buildListView();setupSwipe();setupKeyboard();renderCard();updateStats();

function renderCard(){
  if(cur>=deck.length){showScore();return;}
  const c=deck[cur];
  flipped=false;
  const card=document.getElementById('card');
  card.style.transition='none';
  card.style.transform='translateX(0) rotate(0deg)';
  card.style.opacity='1';
  card.classList.remove('flipped');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{card.style.transition='';card.style.transform='';}));
  document.getElementById('cf-front').innerHTML=`
    <div class="cat-pill">🏛️ ${CATS[c.c]||c.c}</div>
    <div class="card-label">Question</div>
    <div class="card-q">${c.q}</div>
    <div class="flip-cue">Tap card or "Reveal Answer" ↓</div>`;
  document.getElementById('cf-back').innerHTML=`
    <div class="cat-pill">🏛️ ${CATS[c.c]||c.c}</div>
    <div class="card-label">Answer</div>
    <div class="card-a">${c.a}</div>
    <div class="mem-box"><div class="mem-label">💡 Lock It In</div><div class="mem-text">${c.m}</div></div>`;
  document.getElementById('cur-num').textContent=cur+1;
  document.getElementById('tot-num').textContent=deck.length;
  document.getElementById('ans-btns').className='answer-btns hidden';
  document.getElementById('prev-btn').disabled=cur===0;
  document.getElementById('next-btn').textContent=cur===deck.length-1?'Finish':'Next ▶';
  document.getElementById('sh-knew').style.opacity='0';
  document.getElementById('sh-missed').style.opacity='0';
  document.getElementById('flip-label').textContent='Reveal Answer';
  document.getElementById('progress-fill').style.width=((cur/deck.length)*100)+'%';
}

function flipCard(){
  flipped=!flipped;
  const card=document.getElementById('card');
  if(flipped){
    card.classList.add('flipped');
    document.getElementById('ans-btns').className='answer-btns';
    document.getElementById('flip-label').textContent='Back to Question';
  } else {
    card.classList.remove('flipped');
    document.getElementById('ans-btns').className='answer-btns hidden';
    document.getElementById('flip-label').textContent='Reveal Answer';
  }
}
document.getElementById('card-scene').addEventListener('click',()=>flipCard());

function markCard(knew){
  const origIdx=deckIndices[cur]!==undefined?deckIndices[cur]:cur;
  scores[origIdx]=knew;updateStats();
  animateExit(knew?'right':'left');
  setTimeout(()=>{cur++;renderCard();},350);
}
function nextCard(){if(cur>=deck.length-1){showScore();return;}animateExit('left');setTimeout(()=>{cur++;renderCard();},350);}
function prevCard(){if(cur<=0)return;cur--;renderCard();}
function animateExit(dir){
  const card=document.getElementById('card');
  const x=dir==='right'?120:-120;
  card.style.transition='transform .35s ease,opacity .35s ease';
  card.style.transform=`translateX(${x}px) rotate(${dir==='right'?6:-6}deg)`;
  card.style.opacity='0';
}
function setupSwipe(){
  const s=document.getElementById('card-scene');
  s.addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX;isDragging=true;},{passive:true});
  s.addEventListener('touchmove',e=>{
    if(!isDragging||!flipped)return;
    const dx=e.touches[0].clientX-touchStartX;
    const card=document.getElementById('card');
    card.style.transition='none';
    card.style.transform=`rotateY(180deg) translateX(${-dx}px) rotate(${dx/25}deg)`;
    const sk=document.getElementById('sh-knew'),sm=document.getElementById('sh-missed');
    if(dx>40){sk.style.opacity=Math.min((dx-40)/60,1)+'';sm.style.opacity='0';}
    else if(dx<-40){sm.style.opacity=Math.min((-dx-40)/60,1)+'';sk.style.opacity='0';}
    else{sk.style.opacity='0';sm.style.opacity='0';}
  },{passive:true});
  s.addEventListener('touchend',e=>{
    if(!isDragging)return;isDragging=false;
    if(!flipped)return;
    const dx=e.changedTouches[0].clientX-touchStartX;
    if(dx>80){markCard(true);}
    else if(dx<-80){markCard(false);}
    else{
      const card=document.getElementById('card');
      card.style.transition='transform .3s ease';
      card.style.transform='rotateY(180deg)';
      document.getElementById('sh-knew').style.opacity='0';
      document.getElementById('sh-missed').style.opacity='0';
    }
  },{passive:true});
}
function setupKeyboard(){
  document.addEventListener('keydown',e=>{
    if(e.target.tagName==='INPUT')return;
    if(e.key===' '||e.key==='Enter'){e.preventDefault();flipCard();}
    else if(e.key==='ArrowRight')nextCard();
    else if(e.key==='ArrowLeft')prevCard();
    else if((e.key==='k'||e.key==='K')&&flipped)markCard(true);
    else if((e.key==='m'||e.key==='M')&&flipped)markCard(false);
  });
}
function updateStats(){
  const knew=scores.filter(s=>s===true).length;
  const missed=scores.filter(s=>s===false).length;
  const seen=scores.filter(s=>s!==null).length;
  const pct=seen>0?Math.round(knew/seen*100):null;
  document.getElementById('s-knew').textContent=knew;
  document.getElementById('s-missed').textContent=missed;
  document.getElementById('s-pct').textContent=pct!==null?pct+'%':'—';
}
function showScore(){
  const knew=scores.filter(s=>s===true).length;
  const missedCards=scores.map((s,i)=>s===false?i:null).filter(i=>i!==null);
  const seen=scores.filter(s=>s!==null).length;
  const pct=seen>0?Math.round(knew/seen*100):0;
  document.getElementById('flash-view').style.display='none';
  document.getElementById('score-view').style.display='block';
  document.getElementById('progress-fill').style.width='100%';
  document.getElementById('fin-pct').textContent=pct+'%';
  document.getElementById('fin-knew').textContent=knew;
  document.getElementById('fin-missed').textContent=missedCards.length;
  const ring=document.getElementById('ring-fill');
  ring.style.strokeDasharray=`${(pct/100)*CIRC} ${CIRC}`;
  if(pct>=80)ring.classList.add('good');else ring.classList.remove('good');
  const msgs=['Keep drilling — these numbers take reps.','Getting there. Hit the missed ones again.','Solid — most of Kansas is locked in.','Strong. Nearly exam-ready on state law.','Kansas locked. Free points tomorrow.'];
  document.getElementById('score-msg').textContent=msgs[pct>=100?4:pct>=80?3:pct>=60?2:pct>=40?1:0];
  const btn=document.getElementById('btn-missed-only');
  btn.disabled=missedCards.length===0;
  btn.textContent=`Review Missed (${missedCards.length})`;
}
function restart(missedOnly){
  document.getElementById('score-view').style.display='none';
  document.getElementById('flash-view').style.display='block';
  document.getElementById('ring-fill').classList.remove('good');
  if(missedOnly){
    const mi=scores.map((s,i)=>s===false?i:null).filter(i=>i!==null);
    deck=mi.map(i=>ALL_CARDS[i]);deckIndices=mi;
    mi.forEach(i=>scores[i]=null);
    document.getElementById('mode-banner').className='mode-banner visible';
    document.getElementById('deck-tag').textContent='MISSED CARDS';
  } else {
    deck=[...ALL_CARDS];deckIndices=[...Array(TOTAL).keys()];
    scores=new Array(TOTAL).fill(null);
    document.getElementById('mode-banner').className='mode-banner';
    document.getElementById('deck-tag').textContent='KANSAS LAW';
  }
  cur=0;flipped=false;renderCard();updateStats();
}
function setMode(m,btn){
  document.querySelectorAll('.mode-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('flash-view').style.display=m==='flash'?'block':'none';
  document.getElementById('list-view').style.display=m==='list'?'block':'none';
  document.getElementById('score-view').style.display='none';
}
function buildListView(){
  const cats=[...new Set(ALL_CARDS.map(c=>c.c))];
  let html='';
  cats.forEach(cat=>{
    const cards=ALL_CARDS.filter(c=>c.c===cat);
    html+=`<div class="cat-hdr"><span class="cat-icon">🏛️</span><span class="cat-lbl">${CATS[cat]||cat}</span><span class="cat-count">${cards.length}</span></div>`;
    cards.forEach(c=>{
      html+=`<div class="list-card"><div class="list-q">${c.q}</div><div class="list-a">${c.a}</div><div class="list-mem">💡 ${c.m}</div></div>`;
    });
  });
  document.getElementById('list-view').innerHTML=html;
}
</script>
</body>
</html>
