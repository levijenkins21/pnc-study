<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P&C — Ch.4 FX Recap Flashcards</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e2e2e2;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:1rem}
  .top{width:100%;max-width:640px;margin-bottom:1rem}
  .label{font-size:11px;letter-spacing:2px;color:#5b8dee;text-transform:uppercase;margin-bottom:4px}
  h1{font-size:20px;font-weight:600;color:#fff;margin-bottom:.3rem}
  .sub{font-size:12px;color:#555;margin-bottom:.8rem}
  .controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:.7rem}
  select{background:#1a1a1a;border:1px solid #2a2a2a;color:#e2e2e2;padding:7px 10px;border-radius:8px;font-size:13px;cursor:pointer}
  .btn-sm{padding:7px 14px;font-size:12px;font-weight:500;cursor:pointer;border-radius:8px;border:1px solid #2a2a2a;background:#1a1a1a;color:#e2e2e2;transition:background .15s}
  .btn-sm:hover{background:#222}
  .prog-wrap{background:#1e1e1e;border-radius:2px;height:3px;margin-bottom:.4rem}
  .prog-fill{height:3px;background:#5b8dee;border-radius:2px;transition:width .3s}
  .stats{font-size:12px;color:#555;display:flex;gap:16px;margin-bottom:1rem}
  .stat-val{color:#e2e2e2;font-weight:600}
  .card-wrap{width:100%;max-width:640px;perspective:1000px;cursor:pointer;margin-bottom:1rem}
  .card-inner{position:relative;min-height:260px;transition:transform .45s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
  .card-wrap.flipped .card-inner{transform:rotateY(180deg)}
  .face{position:absolute;width:100%;min-height:260px;border-radius:16px;padding:1.75rem;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center}
  .front{background:#141414;border:1px solid #222}
  .back{background:#0d1a2e;border:1px solid #1e3a6e;transform:rotateY(180deg)}
  .face-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#444;margin-bottom:.6rem;text-align:center}
  .back .face-label{color:#1e3a6e}
  .q-text{font-size:17px;font-weight:500;color:#fff;line-height:1.4;text-align:center}
  .section-tag{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#5b8dee;margin-top:.7rem;text-align:center}
  .answer{font-size:15px;color:#ccc;line-height:1.6;text-align:center}
  .answer strong{color:#5b8dee}
  .nav-row{width:100%;max-width:640px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:1rem}
  .counter{font-size:13px;color:#555;text-align:center;flex:1}
  .nav-btn{padding:10px 22px;font-size:13px;font-weight:500;cursor:pointer;border-radius:8px;border:1px solid #2a2a2a;background:#1a1a1a;color:#e2e2e2;transition:background .15s}
  .nav-btn:hover{background:#222}
  .nav-btn:disabled{opacity:.3;cursor:default}
  .know-row{width:100%;max-width:640px;display:none;gap:10px;margin-bottom:1rem}
  .card-wrap.flipped ~ .know-row{display:flex}
  .know-btn{flex:1;padding:11px;font-size:13px;font-weight:600;cursor:pointer;border-radius:10px;border:none;transition:opacity .15s}
  .know-btn.yes{background:#0a2e0a;color:#4aaa4a;border:1px solid #1a4a1a}
  .know-btn.no{background:#2e0a0a;color:#c05050;border:1px solid #4a1a1a}
  .know-btn:hover{opacity:.8}
  .done-screen{display:none;width:100%;max-width:640px;background:#141414;border:1px solid #222;border-radius:16px;padding:2rem;text-align:center}
  .done-screen.show{display:block}
  @media(max-width:480px){.q-text{font-size:15px}.answer{font-size:14px}.face{padding:1.4rem}}
</style>
</head>
<body>

<div class="top">
  <div class="label">P&C Exam · Chapter 4</div>
  <h1>FX Recap Flashcards</h1>
  <div class="sub">Key facts from the chapter recap — tap to flip</div>
  <div class="controls">
    <select id="sectionFilter" onchange="filterSection()">
      <option value="all">All Topics</option>
      <option value="Auto">Auto</option>
      <option value="CGL">CGL</option>
      <option value="BOP">BOP</option>
      <option value="WC">Workers Comp</option>
      <option value="Crime">Crime</option>
      <option value="PL">Professional Liability</option>
      <option value="Umbrella">Umbrella &amp; Excess</option>
      <option value="Bonds">Bonds</option>
    </select>
    <button class="btn-sm" onclick="shuffle()">🔀 Shuffle</button>
    <button class="btn-sm" onclick="resetDeck()">↺ Reset</button>
  </div>
  <div class="prog-wrap"><div class="prog-fill" id="prog"></div></div>
  <div class="stats">
    <span>Card <span class="stat-val" id="cardNum">1</span> of <span class="stat-val" id="cardTotal">0</span></span>
    <span>✓ <span class="stat-val" id="knewCount" style="color:#4aaa4a">0</span></span>
    <span>✗ <span class="stat-val" id="stillCount" style="color:#c05050">0</span></span>
  </div>
</div>

<div class="card-wrap" id="cardWrap" onclick="flip()">
  <div class="card-inner">
    <div class="face front">
      <div class="face-label">Question — tap to reveal answer</div>
      <div class="q-text" id="qText"></div>
      <div class="section-tag" id="sTag"></div>
    </div>
    <div class="face back">
      <div class="face-label">Answer</div>
      <div class="answer" id="aText"></div>
    </div>
  </div>
</div>

<div class="know-row" id="knowRow">
  <button class="know-btn yes" onclick="markKnew()">✓ Knew it</button>
  <button class="know-btn no" onclick="markLearning()">✗ Still learning</button>
</div>

<div class="nav-row">
  <button class="nav-btn" id="prevBtn" onclick="prev()">← Prev</button>
  <span class="counter" id="counter"></span>
  <button class="nav-btn" id="nextBtn" onclick="next()">Next →</button>
</div>

<div class="done-screen" id="doneScreen">
  <div style="font-size:32px;margin-bottom:.5rem">🎉</div>
  <div style="font-size:20px;font-weight:600;color:#fff;margin-bottom:.5rem">Deck complete!</div>
  <div id="doneStats" style="font-size:14px;color:#aaa;margin-bottom:1.2rem"></div>
  <button class="btn-sm" onclick="restartDeck()" style="padding:10px 24px;font-size:14px">Start Over</button>
</div>

<a href="PC_Dashboard.html" style="position:fixed;bottom:16px;left:16px;padding:8px 16px;background:#141414;border:1px solid #2a2a2a;border-radius:8px;color:#888;font-size:12px;font-family:-apple-system,sans-serif;text-decoration:none;z-index:999">← Home</a>

<script>
const ALL_CARDS = [
  // ── AUTO ──────────────────────────────────────────────────────
  {s:"Auto", q:"What are the 6 parts of the Personal Auto Policy (PAP)?", a:"Part A – Liability · Part B – Medical Payments · Part C – Uninsured Motorist · Part D – Physical Damage · Part E – Duties After Loss · Part F – General Provisions"},
  {s:"Auto", q:"What is a 'nonowned' auto under the PAP?", a:"A private vehicle operated or in the custody of the named insured that is NOT titled to the insured."},
  {s:"Auto", q:"What is a 'temporary substitute' auto under the PAP?", a:"An auto or trailer not owned by the insured, used while the insured vehicle is out of service due to breakdown, repair, loss, or destruction."},
  {s:"Auto", q:"PAP Part A (Liability) — what does it pay for?", a:"Bodily injury and property damage to others, plus defense costs and costs from settlement or defense of the insured."},
  {s:"Auto", q:"Name 4 common exclusions under PAP Part A (Liability).", a:"(1) Intentional injury/damage · (2) Use of auto without permission · (3) Commercial-type vehicle used in business · (4) Damage to property being transported"},
  {s:"Auto", q:"PAP Part B (Medical Payments) — what is the time limit for expenses to be rendered?", a:"Medical expenses must be rendered within 3 years of the accident."},
  {s:"Auto", q:"How does UIM coverage calculate the amount it pays?", a:"UIM coverage = Insured's UIM limits MINUS the at-fault driver's BI limits. Pays the gap up to the insured's UIM limit."},
  {s:"Auto", q:"PAP Part D — what is the waiting period for transportation expenses after a NON-THEFT loss?", a:"24 hours after the loss."},
  {s:"Auto", q:"PAP Part D — what is the waiting period for transportation expenses after a THEFT?", a:"48 hours after the theft."},
  {s:"Auto", q:"What is the PAP policy territory?", a:"United States, U.S. territories and possessions, and Canada."},
  {s:"Auto", q:"PAP Part F — if two policies cover the same loss, what does the insurer pay?", a:"The HIGHEST LIMIT of insurance among the applicable policies — not the combined total."},
  {s:"Auto", q:"What does the 'Drive Other Car' (DOC) endorsement do?", a:"Extends liability and physical damage coverage to a nonowned vehicle the insured uses — applies to company-supplied, rented, leased, or borrowed vehicles."},
  {s:"Auto", q:"What does the Commercial Auto Coverage Form (CACF) exclude that the Garage Coverage Form handles?", a:"Truckers, garages, and motor carriers — those are separate forms. The CACF covers standard commercial auto exposures."},
  {s:"Auto", q:"What are the 6 sections of the Garage Coverage Form?", a:"I – Covered Autos · II – Liability (Garage Ops & Covered Autos) · III – Garagekeepers · IV – Physical Damage · V – Garage Conditions · VI – Definitions"},
  {s:"Auto", q:"What does Garagekeepers coverage (Section III of the Garage Form) cover?", a:"Damage to customer autos left in the insured's care — covers comprehensive, specified cause of loss, and collision."},
  // ── CGL ───────────────────────────────────────────────────────
  {s:"CGL", q:"Name the 3 coverages in the CGL Coverage Form.", a:"Coverage A – Bodily Injury & Property Damage · Coverage B – Personal and Advertising Injury · Coverage C – Medical Payments"},
  {s:"CGL", q:"What is 'premises and operations' exposure under the CGL?", a:"Liability arising from ownership, maintenance, or use of the insured's premises and business operations conducted there."},
  {s:"CGL", q:"What is 'products and completed operations' exposure under the CGL?", a:"Injuries or damage occurring AFTER the insured has completed its job and left the site, or after relinquishing control of a product."},
  {s:"CGL", q:"What does CGL Coverage B (Personal and Advertising Injury) cover?", a:"Non-physical injury: libel, slander, false arrest, wrongful eviction, malicious prosecution, copyright/slogan infringement in ads, invasion of privacy."},
  {s:"CGL", q:"What are CGL supplementary payments?", a:"Additional amounts paid BEYOND the policy limits — includes bail bonds, loss of earnings, court costs, and interest payments."},
  {s:"CGL", q:"Name the 4 types of 'Who is Insured' entities under the CGL.", a:"(1) Individual/sole proprietor · (2) Partnership/joint venture · (3) LLC or trust · (4) Organization other than partnership, JV, or LLC"},
  {s:"CGL", q:"What is the difference between per occurrence and aggregate limits in the CGL?", a:"Per occurrence = max per accident. Aggregate = most the insurer pays for ALL losses in the policy period. (Products/completed ops has its own separate aggregate.)"},
  // ── BOP ───────────────────────────────────────────────────────
  {s:"BOP", q:"Can BOP liability be written without property coverage (monoline)?", a:"NO — BOP cannot be written on a monoline basis. Liability must be packaged with property coverage."},
  {s:"BOP", q:"What does BOP cover?", a:"Bodily injury, property damage, personal injury, advertising injury, and medical expenses."},
  {s:"BOP", q:"BOP medical payments — what is the time limit and where must the accident occur?", a:"Must be incurred within 1 year of accident, on or near the insured premises."},
  {s:"BOP", q:"Name 5 BOP exclusions.", a:"Expected/intended injury · Contractual liability · Liquor liability · Pollution · Professional services · Electronic data · War · Mobile equipment"},
  {s:"BOP", q:"BOP — who is insured for an LLC?", a:"The named insured and its members."},
  {s:"BOP", q:"BOP — who is insured for a corporation?", a:"Named insured, executive officers, and directors."},
  {s:"BOP", q:"BOP aggregate limit — how is it calculated?", a:"Aggregate = 2× the occurrence limit. Applies separately to (1) products/completed ops and (2) BI, PD, personal/advertising injury, and medical expenses."},
  {s:"BOP", q:"Name 4 BOP General Conditions.", a:"(1) Bankruptcy doesn't relieve obligations · (2) Duties after occurrence: notify insurer, submit legal papers, cooperate · (3) No legal action against insurer without complying with policy terms · (4) Separation of insured — limits paid once per occurrence"},
  // ── WC ────────────────────────────────────────────────────────
  {s:"WC", q:"What is the difference between work-related and non-work-related injury under WC?", a:"Work-related = injury or occupational disease resulting DURING employment (covered). Non-work-related = ordinary disease or injury suffered by the general public (NOT covered)."},
  {s:"WC", q:"What does 'Other States' Insurance' (Part 3C) do under the WC policy?", a:"Allows coverage for employees working in states OTHER than the one where the policy was written. Those states must be listed for coverage to apply."},
  {s:"WC", q:"What is FELA and what is its time limit?", a:"Federal Employers Liability Act — allows railroad employees to sue employers for negligence. Actions must begin within 3 years from the cause of action."},
  {s:"WC", q:"What is the 'exclusive remedy' doctrine in Workers Compensation?", a:"Employees CANNOT seek damages outside of WC law, unless the claim falls into a gap situation not covered by WC. WC is the sole remedy."},
  {s:"WC", q:"How is the WC premium determined?", a:"Rating bureau classification rate applied to each $100 of payroll. Adjusted by experience modification factor. Premium discount applies when total standard premium exceeds $5,000."},
  {s:"WC", q:"What is retrospective rating under WC?", a:"Final premium is based on the insured's ACTUAL LOSS EXPERIENCE during the policy term — subject to minimum and maximum premium limits."},
  {s:"WC", q:"What are participating policies under WC?", a:"Policies eligible for dividends for the insured, dependent on associated underwriting requirements (loss performance)."},
  // ── CRIME ────────────────────────────────────────────────────
  {s:"Crime", q:"What is the difference between a discovery form and a loss-sustained form in crime coverage?", a:"Discovery form: covers losses that OCCURRED AT ANY TIME and are DISCOVERED during the policy period. Loss-sustained form: loss must occur AND be discovered during the policy period."},
  {s:"Crime", q:"What types of entities does commercial crime coverage serve?", a:"Commercial and government entities."},
  // ── PROFESSIONAL LIABILITY ────────────────────────────────────
  {s:"PL", q:"On what basis is professional liability usually written?", a:"Claims-made basis."},
  {s:"PL", q:"What does E&O (Errors & Omissions) protect?", a:"Insurance agents and brokers from financial loss due to a lawsuit from an insured — covers mistakes in advice, failure to place coverage, etc."},
  {s:"PL", q:"What does D&O (Directors & Officers) coverage protect against?", a:"Losses arising from WRONGFUL ACTS by directors and officers while acting in their official capacity."},
  {s:"PL", q:"What does EPLI cover?", a:"Employer liability for: refusal to employ, termination, demotion, failure to promote, negative evaluation, and similar employment practices."},
  {s:"PL", q:"What does Cyber Liability cover?", a:"Cyber risks and data breaches — covers network security liability, data restoration, cyber extortion, business income loss, and related exposures."},
  // ── UMBRELLA / EXCESS ─────────────────────────────────────────
  {s:"Umbrella", q:"What is the difference between an umbrella and an excess policy?", a:"Umbrella (stand-alone): coverage can be greater OR less than underlying — can cover gaps. Excess (follow form): mirrors the underlying policy exactly and only increases the dollar limits."},
  {s:"Umbrella", q:"What is a personal umbrella also called?", a:"Catastrophe insurance."},
  {s:"Umbrella", q:"What is the minimum coverage amount for a personal umbrella?", a:"$1,000,000 in additional coverage above the underlying policies."},
  {s:"Umbrella", q:"What is the SIR (Self-Insured Retention) under an umbrella policy?", a:"The amount the insured must pay out of pocket before the umbrella responds to losses NOT covered by any underlying policy. No SIR applies when primary coverage is in effect."},
  {s:"Umbrella", q:"If the insured's underlying insurance lapses, what does the umbrella pay?", a:"Only what it WOULD HAVE PAID if the underlying insurance were still in effect. The insured absorbs the lapsed underlying amount."},
  {s:"Umbrella", q:"What is the minimum limit of liability for a commercial umbrella?", a:"The policy specifies a minimum limit of liability (varies by policy — the insured pays the SIR before the umbrella pays for certain losses)."},
  // ── BONDS ────────────────────────────────────────────────────
  {s:"Bonds", q:"In a surety bond, who are the three parties?", a:"Principal (obligor) — makes the promise, buys the bond. Obligee (insured) — receives the promise, bond paid to if principal defaults. Guarantor (surety) — bonding company that guarantees performance and pays if principal defaults."},
  {s:"Bonds", q:"What is the bond 'penalty'?", a:"The set limit for which the surety is liable — the maximum the bonding company will pay if the principal defaults."},
  {s:"Bonds", q:"What is a fidelity bond used for?", a:"To guarantee HONESTY AND TRUST — not performance. Covers employee dishonesty such as theft and embezzlement."},
  {s:"Bonds", q:"What is the difference between a commercial blanket bond and a blanket position bond?", a:"Commercial blanket: covers ALL employees, limit applies PER LOSS. Blanket position: covers ALL employees, limit applies PER EMPLOYEE."},
  {s:"Bonds", q:"What is an individual fidelity bond?", a:"Covers ONE specific employee only."},
  {s:"Bonds", q:"What is a named schedule bond?", a:"Covers SEVERAL SPECIFICALLY NAMED employees — each listed by name on the bond."},
  {s:"Bonds", q:"What is a position schedule bond?", a:"Covers anyone holding a SCHEDULED POSITION (by job title) — coverage follows the position, not a specific person."},
];

let deck = [];
let cur = 0;
let knew = 0;
let learning = 0;
let flipped = false;

function filterSection() {
  const val = document.getElementById('sectionFilter').value;
  deck = val === 'all' ? [...ALL_CARDS] : ALL_CARDS.filter(c => c.s === val);
  cur = 0; knew = 0; learning = 0; flipped = false;
  showCard(); updateStats();
}

function shuffle() {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  cur = 0; knew = 0; learning = 0;
  showCard(); updateStats();
}

function resetDeck() { filterSection(); }

function showCard() {
  const done = document.getElementById('doneScreen');
  const wrap = document.getElementById('cardWrap');
  const navRow = document.querySelector('.nav-row');
  const knowRow = document.getElementById('knowRow');

  if (cur >= deck.length) {
    done.classList.add('show');
    wrap.style.display = 'none';
    navRow.style.display = 'none';
    knowRow.style.display = 'none';
    document.getElementById('doneStats').textContent =
      'Knew it: ' + knew + ' · Still learning: ' + learning + ' · Total: ' + deck.length;
    return;
  }

  done.classList.remove('show');
  wrap.style.display = 'block';
  navRow.style.display = 'flex';

  const card = deck[cur];
  document.getElementById('qText').textContent = card.q;
  document.getElementById('sTag').textContent = card.s;
  document.getElementById('aText').innerHTML = card.a.replace(/·/g, '<br>·');

  flipped = false;
  wrap.classList.remove('flipped');
  knowRow.style.display = 'none';

  document.getElementById('cardNum').textContent = cur + 1;
  document.getElementById('cardTotal').textContent = deck.length;
  document.getElementById('prog').style.width = Math.round((cur / deck.length) * 100) + '%';
  document.getElementById('prevBtn').disabled = cur === 0;
  document.getElementById('nextBtn').disabled = cur >= deck.length - 1;
  document.getElementById('counter').textContent = (cur + 1) + ' / ' + deck.length;
}

function flip() {
  flipped = !flipped;
  const wrap = document.getElementById('cardWrap');
  const knowRow = document.getElementById('knowRow');
  wrap.classList.toggle('flipped', flipped);
  knowRow.style.display = flipped ? 'flex' : 'none';
}

function markKnew() { knew++; updateStats(); next(); }
function markLearning() { learning++; updateStats(); next(); }
function updateStats() {
  document.getElementById('knewCount').textContent = knew;
  document.getElementById('stillCount').textContent = learning;
}
function next() { cur++; showCard(); }
function prev() { if (cur > 0) { cur--; showCard(); } }
function restartDeck() {
  cur = 0; knew = 0; learning = 0;
  document.getElementById('doneScreen').classList.remove('show');
  document.getElementById('cardWrap').style.display = 'block';
  document.querySelector('.nav-row').style.display = 'flex';
  showCard(); updateStats();
}

filterSection();
</script>
</body>
</html>
