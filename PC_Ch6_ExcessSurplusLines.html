<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P&C — Ch6: Excess & Surplus Lines</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e2e2e2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem}
  .deck{width:100%;max-width:680px}
  .progress-bar{width:100%;height:3px;background:#1a1a1a;border-radius:2px;margin-bottom:1.5rem}
  .progress-fill{height:3px;background:#5b8dee;border-radius:2px;transition:width .4s ease}
  .card{background:#141414;border:1px solid #222;border-radius:20px;padding:2.2rem 2rem;min-height:360px;display:flex;flex-direction:column;justify-content:center;margin-bottom:1.2rem;position:relative}
  .card-label{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:#5b8dee;margin-bottom:.6rem}
  .card-title{font-size:20px;font-weight:700;color:#fff;margin-bottom:.9rem;line-height:1.25}
  .card-body{font-size:14px;color:#aaa;line-height:1.75}
  .card-body strong{color:#e2e2e2;font-weight:600}
  .card-body p+p{margin-top:.7rem}
  .info-grid{display:flex;flex-direction:column;gap:8px;margin-top:.6rem}
  .info-row{background:#1a1a1a;border:1px solid #242424;border-radius:10px;padding:10px 13px}
  .info-label{font-size:11px;font-weight:600;color:#5b8dee;letter-spacing:.5px;margin-bottom:2px;text-transform:uppercase}
  .info-val{font-size:13px;color:#bbb;line-height:1.5}
  .warn-box{background:#1a1200;border:1px solid #3a2a00;border-radius:10px;padding:11px 13px;margin-top:.8rem}
  .warn-box p{font-size:13px;color:#c8a84b;line-height:1.55}
  .num-card{background:#0d1a2e;border:1px solid #1e3a6e;border-radius:10px;padding:11px 13px;display:flex;align-items:center;gap:12px}
  .num-big{font-size:22px;font-weight:700;color:#5b8dee;flex-shrink:0;min-width:76px;text-align:center;line-height:1.1}
  .num-desc{font-size:13px;color:#aaa;line-height:1.45}
  .num-desc strong{color:#e2e2e2}
  ul.bullet{padding-left:1.1rem;display:flex;flex-direction:column;gap:5px;margin-top:.4rem}
  ul.bullet li{font-size:13px;color:#999;line-height:1.45}
  ul.bullet li strong{color:#ddd}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:.6rem}
  .mini-card{background:#1a1a1a;border:1px solid #242424;border-radius:9px;padding:9px 11px}
  .mini-label{font-size:10px;color:#5b8dee;font-weight:600;letter-spacing:.5px;margin-bottom:2px;text-transform:uppercase}
  .mini-val{font-size:12px;color:#bbb;line-height:1.4}
  .slide-num{position:absolute;top:1.1rem;right:1.4rem;font-size:11px;color:#333}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .nav-btn{padding:11px 28px;font-size:14px;font-weight:500;cursor:pointer;border-radius:10px;border:1px solid #2a2a2a;background:#1a1a1a;color:#e2e2e2;transition:background .15s}
  .nav-btn:hover{background:#252525}
  .nav-btn:disabled{opacity:.3;cursor:default}
  .nav-btn.primary{background:#0d1a2e;border-color:#1e3a6e;color:#5b8dee}
  .nav-btn.primary:hover{background:#112244}
  .counter{font-size:12px;color:#444;text-align:center;flex:1}
</style>
</head>
<body>
<div class="deck">
  <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>
  <div class="card" id="card">
    <div class="slide-num" id="slideNum"></div>
    <div id="content"></div>
  </div>
  <div class="nav">
    <button class="nav-btn" id="prevBtn" onclick="go(-1)">← Back</button>
    <span class="counter" id="counter"></span>
    <button class="nav-btn primary" id="nextBtn" onclick="go(1)">Next →</button>
  </div>
</div>
<a href="PC_Dashboard.html" style="position:fixed;bottom:16px;left:16px;padding:8px 16px;background:#141414;border:1px solid #2a2a2a;border-radius:8px;color:#888;font-size:12px;font-family:-apple-system,sans-serif;text-decoration:none;z-index:999">← Home</a>

<script>
const SLIDES = [
  {
    label: "Chapter 6 · Excess & Surplus Lines",
    title: "What Is Excess & Surplus Lines?",
    body: `<p>E&S coverage provides risk protection for parties who have sought insurance through <strong>authorized insurers</strong> and — after <strong>diligent efforts</strong> — have been unable to procure it.</p>
<div class="info-grid" style="margin-top:.8rem">
  <div class="info-row"><div class="info-label">Surplus Lines Licensee</div><div class="info-val">Procures insurance on behalf of an insured from a <strong>qualified unadmitted (nonadmitted) insurer</strong>.</div></div>
  <div class="info-row"><div class="info-label">Who Can Get a License</div><div class="info-val">Any agent or broker <strong>already licensed for P&C insurance</strong> may apply to the Commissioner for an excess coverage license — allowing placement with non-authorized Kansas insurers.</div></div>
</div>
<div class="warn-box"><p>💡 E&S is the market of last resort — the insured must first try and fail to get coverage in the admitted market.</p></div>`
  },
  {
    label: "E&S Lines · Producer Obligations",
    title: "Annual Filing & Tax Requirements",
    body: `<div class="info-grid">
  <div class="num-card"><div class="num-big">March 1</div><div class="num-desc"><strong>Annual report deadline</strong> — producer must file on or before March 1 each year confirming coverage was not available from authorized insurers after a diligent search.</div></div>
  <div class="num-card"><div class="num-big">6%</div><div class="num-desc"><strong>Tax on gross premiums</strong> — producers must pay the Commissioner a tax of 6% of total gross premiums charged during the preceding year.</div></div>
</div>
<div class="warn-box" style="margin-top:.8rem"><p>⚠️ <strong>Rate differential alone is not grounds</strong> for placing a risk with a nonadmitted carrier. If an admitted carrier would accept the risk at a different rate, that risk must go to the admitted market.</p></div>`
  },
  {
    label: "E&S Lines · Eligible Insurers",
    title: "Commissioner's List of Approved Nonadmitted Insurers",
    body: `<p>The Commissioner maintains a list of unauthorized insurers who have filed a certified copy of their most recent annual statement.</p>
<div class="info-grid" style="margin-top:.8rem">
  <div class="num-card"><div class="num-big">$4.5M</div><div class="num-desc"><strong>Minimum capital or surplus</strong> — the insurer's annual statement must show at least $4,500,000 in capital or surplus to appear on the Commissioner's approved list.</div></div>
  <div class="info-row"><div class="info-label">Placement Restriction</div><div class="info-val">Excess lines agents <strong>cannot</strong> place insurance on a Kansas risk with any insurer <strong>not on the Commissioner's list</strong>.</div></div>
  <div class="info-row"><div class="info-label">Insolvency Protection</div><div class="info-val">Producers who place business with approved nonadmitted insurers are <strong>relieved of responsibility</strong> if the insurer subsequently becomes insolvent.</div></div>
</div>`
  },
  {
    label: "E&S Lines · Required Disclosures",
    title: "What the Producer Must Tell the Insured",
    body: `<p>Before placing business with an unauthorized insurer, the excess lines agent must obtain the insured's <strong>written consent</strong> and provide these notices:</p>
<ul class="bullet" style="margin-top:.6rem">
  <li>Coverage will be obtained from an insurer <strong>not authorized to do business in Kansas</strong></li>
  <li>The insurer's name appears on an <strong>approved list issued by the Commissioner</strong></li>
  <li>The insurer's financial condition, policy forms, rates and trade practices are <strong>NOT subject to the Commissioner's review or jurisdiction</strong></li>
  <li>The <strong>state's Guaranty Association protection does NOT apply</strong> to the nonadmitted insurer's policyholders</li>
  <li>Any other information deemed necessary by the Commissioner</li>
</ul>`
  },
  {
    label: "E&S Lines · Binding Coverage",
    title: "Emergency Binding & Confirmation",
    body: `<div class="info-grid">
  <div class="num-card"><div class="num-big">30 days</div><div class="num-desc">If coverage must be bound immediately, the agent may do so — but must obtain the insured's <strong>written confirmation within 30 days</strong> after binding.</div></div>
</div>
<div class="warn-box" style="margin-top:.8rem"><p>💡 Written consent before binding is preferred. Emergency binding is allowed, but the 30-day written confirmation window closes it out properly.</p></div>`
  },
  {
    label: "Numbers to Memorize",
    title: "E&S Lines — Key Numbers",
    body: `<div class="two-col">
  <div class="mini-card"><div class="mini-label">Annual Filing</div><div class="mini-val">Due <strong>March 1</strong> each year</div></div>
  <div class="mini-card"><div class="mini-label">Premium Tax</div><div class="mini-val"><strong>6%</strong> of total gross premiums from prior year</div></div>
  <div class="mini-card"><div class="mini-label">Min. Capital/Surplus</div><div class="mini-val"><strong>$4,500,000</strong> to be on Commissioner's approved list</div></div>
  <div class="mini-card"><div class="mini-label">Emergency Binding</div><div class="mini-val">Written confirmation within <strong>30 days</strong> after binding</div></div>
  <div class="mini-card"><div class="mini-label">Guaranty Association</div><div class="mini-val"><strong>Does NOT apply</strong> to nonadmitted insurer policyholders</div></div>
  <div class="mini-card"><div class="mini-label">Rate Differential</div><div class="mini-val"><strong>Not valid</strong> reason to use nonadmitted insurer</div></div>
</div>`
  }
];

let cur = 0;
function render() {
  const s = SLIDES[cur];
  document.getElementById('content').innerHTML =
    `<div class="card-label">${s.label}</div><div class="card-title">${s.title}</div><div class="card-body">${s.body}</div>`;
  document.getElementById('fill').style.width = ((cur + 1) / SLIDES.length * 100) + '%';
  document.getElementById('counter').textContent = (cur + 1) + ' of ' + SLIDES.length;
  document.getElementById('slideNum').textContent = (cur + 1) + ' / ' + SLIDES.length;
  document.getElementById('prevBtn').disabled = cur === 0;
  document.getElementById('nextBtn').textContent = cur === SLIDES.length - 1 ? '✓ Done' : 'Next →';
  document.getElementById('nextBtn').onclick = cur === SLIDES.length - 1
    ? () => window.location.href = 'PC_Dashboard.html'
    : () => go(1);
}
function go(dir) { cur = Math.max(0, Math.min(SLIDES.length - 1, cur + dir)); render(); }
render();
</script>
</body>
</html>
