<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P&C — Chapter 5: Introduction</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e2e2e2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem}
  .deck{width:100%;max-width:680px}
  .progress-bar{width:100%;height:3px;background:#1a1a1a;border-radius:2px;margin-bottom:1.5rem}
  .progress-fill{height:3px;background:#5b8dee;border-radius:2px;transition:width .4s ease}
  .card{background:#141414;border:1px solid #222;border-radius:20px;padding:2.5rem 2rem;min-height:340px;display:flex;flex-direction:column;justify-content:center;margin-bottom:1.2rem;position:relative}
  .card-label{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:#5b8dee;margin-bottom:.6rem}
  .card-title{font-size:22px;font-weight:700;color:#fff;margin-bottom:1rem;line-height:1.25}
  .card-body{font-size:15px;color:#aaa;line-height:1.75}
  .card-body strong{color:#e2e2e2;font-weight:600}
  .card-body .highlight{color:#5b8dee;font-weight:600}
  .term-grid{display:flex;flex-direction:column;gap:10px;margin-top:.5rem}
  .term-row{background:#1a1a1a;border:1px solid #242424;border-radius:10px;padding:11px 14px}
  .term-name{font-size:13px;font-weight:600;color:#5b8dee;margin-bottom:3px}
  .term-def{font-size:13px;color:#999;line-height:1.5}
  .warn-box{background:#1a1200;border:1px solid #3a2a00;border-radius:10px;padding:12px 14px;margin-top:1rem}
  .warn-box p{font-size:13px;color:#c8a84b;line-height:1.55}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .nav-btn{padding:11px 28px;font-size:14px;font-weight:500;cursor:pointer;border-radius:10px;border:1px solid #2a2a2a;background:#1a1a1a;color:#e2e2e2;transition:background .15s}
  .nav-btn:hover{background:#252525}
  .nav-btn:disabled{opacity:.3;cursor:default}
  .nav-btn.primary{background:#0d1a2e;border-color:#1e3a6e;color:#5b8dee}
  .nav-btn.primary:hover{background:#112244}
  .counter{font-size:12px;color:#444;text-align:center;flex:1}
  .slide-num{position:absolute;top:1.2rem;right:1.5rem;font-size:11px;color:#333;letter-spacing:1px}
</style>
</head>
<body>
<div class="deck">
  <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>

  <div class="card" id="card">
    <div class="slide-num" id="slideNum"></div>
    <div id="content"></div>
  </div>

  <div class="nav">
    <button class="nav-btn" id="prevBtn" onclick="go(-1)">← Back</button>
    <span class="counter" id="counter"></span>
    <button class="nav-btn primary" id="nextBtn" onclick="go(1)">Next →</button>
  </div>
</div>

<a href="PC_Dashboard.html" style="position:fixed;bottom:16px;left:16px;padding:8px 16px;background:#141414;border:1px solid #2a2a2a;border-radius:8px;color:#888;font-size:12px;font-family:-apple-system,sans-serif;text-decoration:none;z-index:999">← Home</a>

<script>
const SLIDES = [
  {
    label: "Chapter 5 · Kansas State Regulations",
    title: "State-Specific Insurance Law",
    body: `<p>Everything covered up to this point has applied to the insurance industry as a whole. Chapter 5 shifts focus to <strong>Kansas-specific regulations</strong> — the rules that govern how insurance is sold, supervised, and enforced in this state.</p>
<p style="margin-top:.9rem">You'll learn about:</p>
<ul style="margin-top:.5rem;padding-left:1.2rem;display:flex;flex-direction:column;gap:6px;font-size:14px;color:#aaa">
  <li>The Kansas Department of Insurance and the Commissioner's duties</li>
  <li>Licensing laws for producers and insurers</li>
  <li>Unfair trade practices and prohibited conduct</li>
  <li>Key time limits and dollar amounts you <em>must</em> memorize for the exam</li>
</ul>`
  },
  {
    label: "Study Note",
    title: "What to Focus On",
    body: `<p>This chapter is <strong>definition and number heavy</strong>. The Kansas exam will test specific time limits (days to respond, file, act) and specific dollar amounts (fines, fees, bond amounts).</p>
<div class="warn-box"><p>⚠️ <strong>Memorize the numbers.</strong> Time limits and dollar amounts appear frequently on the state exam. As they come up in each section, pay extra attention and review them before test day.</p></div>`
  },
  {
    label: "Terms to Know · Part 1",
    title: "Key Definitions",
    body: `<div class="term-grid">
  <div class="term-row"><div class="term-name">Cease and Desist</div><div class="term-def">To stop or discontinue a practice — typically ordered by the Commissioner when a violation is found.</div></div>
  <div class="term-row"><div class="term-name">Coercion</div><div class="term-def">A forceful act or threat aimed to influence a person to act against their will. An unfair trade practice.</div></div>
  <div class="term-row"><div class="term-name">Commissioner</div><div class="term-def">The head of the Kansas Department of Insurance. Elected official responsible for regulating the state's insurance industry.</div></div>
  <div class="term-row"><div class="term-name">Exempt</div><div class="term-def">Not subject to an obligation — some entities or transactions may be exempt from certain insurance regulations.</div></div>
</div>`
  },
  {
    label: "Terms to Know · Part 2",
    title: "Key Definitions (continued)",
    body: `<div class="term-grid">
  <div class="term-row"><div class="term-name">Home Office</div><div class="term-def">The insurer's headquarters — its principal place of business. Used to determine where a company is "domestic," "foreign," or "alien."</div></div>
  <div class="term-row"><div class="term-name">Inducement</div><div class="term-def">An offer that attempts to influence the other party — can be an unfair trade practice if used improperly (e.g., rebating).</div></div>
  <div class="term-row"><div class="term-name">Insolvent</div><div class="term-def">Unable to meet financial obligations. An insolvent insurer cannot pay claims — regulators step in to protect policyholders.</div></div>
  <div class="term-row"><div class="term-name">Reciprocity</div><div class="term-def">A mutual interchange of rights and privileges between states — e.g., Kansas honors licenses from states that honor Kansas licenses.</div></div>
</div>`
  },
  {
    label: "Terms to Know · Part 3",
    title: "Key Definitions (continued)",
    body: `<div class="term-grid">
  <div class="term-row"><div class="term-name">Statute</div><div class="term-def">A formal written law enacted by the legislature. Insurance statutes can be found in the Kansas Insurance Code — these are the rules that govern the industry.</div></div>
  <div class="term-row"><div class="term-name">Subpoena</div><div class="term-def">An official order for someone to appear as a witness or submit testimony or evidence. The Commissioner has subpoena power during investigations.</div></div>
</div>
<div class="warn-box" style="margin-top:1rem"><p>💡 <strong>Tip:</strong> Know who the Commissioner is and what powers they have — subpoena power, cease and desist orders, and license revocation are all Commissioner tools that the exam tests.</p></div>`
  },
  {
    label: "Chapter 5 · Overview",
    title: "Coming Up in Chapter 5",
    body: `<p>As you go through each section, pay close attention to:</p>
<div class="term-grid" style="margin-top:.8rem">
  <div class="term-row"><div class="term-name">📋 The Insurance Department</div><div class="term-def">Structure, Commissioner's role, powers, and duties under Kansas law.</div></div>
  <div class="term-row"><div class="term-name">🪪 Licensing</div><div class="term-def">Requirements to become and stay licensed as a producer in Kansas — including continuing education and reciprocity.</div></div>
  <div class="term-row"><div class="term-name">⚠️ Unfair Trade Practices</div><div class="term-def">Prohibited conduct: misrepresentation, rebating, twisting, coercion, and more.</div></div>
  <div class="term-row"><div class="term-name">🔢 Numbers to Memorize</div><div class="term-def">Time limits, fine amounts, and dollar thresholds — flagged throughout each section.</div></div>
</div>`
  }
];

let cur = 0;

function render() {
  const s = SLIDES[cur];
  document.getElementById('content').innerHTML =
    `<div class="card-label">${s.label}</div><div class="card-title">${s.title}</div><div class="card-body">${s.body}</div>`;
  document.getElementById('fill').style.width = ((cur + 1) / SLIDES.length * 100) + '%';
  document.getElementById('counter').textContent = (cur + 1) + ' of ' + SLIDES.length;
  document.getElementById('slideNum').textContent = (cur + 1) + ' / ' + SLIDES.length;
  document.getElementById('prevBtn').disabled = cur === 0;
  document.getElementById('nextBtn').textContent = cur === SLIDES.length - 1 ? '✓ Done' : 'Next →';
  document.getElementById('nextBtn').onclick = cur === SLIDES.length - 1
    ? () => window.location.href = 'PC_Dashboard.html'
    : () => go(1);
}

function go(dir) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, cur + dir));
  render();
}

render();
</script>
</body>
</html>
