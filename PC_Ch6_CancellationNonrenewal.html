<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P&C — Ch6: Cancellation & Nonrenewal</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e2e2e2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem}
  .deck{width:100%;max-width:680px}
  .progress-bar{width:100%;height:3px;background:#1a1a1a;border-radius:2px;margin-bottom:1.5rem}
  .progress-fill{height:3px;background:#5b8dee;border-radius:2px;transition:width .4s ease}
  .card{background:#141414;border:1px solid #222;border-radius:20px;padding:2.2rem 2rem;min-height:360px;display:flex;flex-direction:column;justify-content:center;margin-bottom:1.2rem;position:relative}
  .card-label{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:#5b8dee;margin-bottom:.6rem}
  .card-title{font-size:20px;font-weight:700;color:#fff;margin-bottom:.9rem;line-height:1.25}
  .card-body{font-size:14px;color:#aaa;line-height:1.75}
  .card-body strong{color:#e2e2e2;font-weight:600}
  .card-body p+p{margin-top:.7rem}
  .info-grid{display:flex;flex-direction:column;gap:8px;margin-top:.6rem}
  .info-row{background:#1a1a1a;border:1px solid #242424;border-radius:10px;padding:10px 13px}
  .info-label{font-size:11px;font-weight:600;color:#5b8dee;letter-spacing:.5px;margin-bottom:2px;text-transform:uppercase}
  .info-val{font-size:13px;color:#bbb;line-height:1.5}
  .warn-box{background:#1a1200;border:1px solid #3a2a00;border-radius:10px;padding:11px 13px;margin-top:.8rem}
  .warn-box p{font-size:13px;color:#c8a84b;line-height:1.55}
  .num-card{background:#0d1a2e;border:1px solid #1e3a6e;border-radius:10px;padding:11px 13px;display:flex;align-items:center;gap:12px}
  .num-big{font-size:24px;font-weight:700;color:#5b8dee;flex-shrink:0;min-width:64px;text-align:center;line-height:1.1}
  .num-desc{font-size:13px;color:#aaa;line-height:1.45}
  .num-desc strong{color:#e2e2e2}
  ul.bullet{padding-left:1.1rem;display:flex;flex-direction:column;gap:5px;margin-top:.4rem}
  ul.bullet li{font-size:13px;color:#999;line-height:1.45}
  ul.bullet li strong{color:#ddd}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:.6rem}
  .mini-card{background:#1a1a1a;border:1px solid #242424;border-radius:9px;padding:9px 11px}
  .mini-label{font-size:10px;color:#5b8dee;font-weight:600;letter-spacing:.5px;margin-bottom:2px;text-transform:uppercase}
  .mini-val{font-size:12px;color:#bbb;line-height:1.4}
  .slide-num{position:absolute;top:1.1rem;right:1.4rem;font-size:11px;color:#333}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .nav-btn{padding:11px 28px;font-size:14px;font-weight:500;cursor:pointer;border-radius:10px;border:1px solid #2a2a2a;background:#1a1a1a;color:#e2e2e2;transition:background .15s}
  .nav-btn:hover{background:#252525}
  .nav-btn:disabled{opacity:.3;cursor:default}
  .nav-btn.primary{background:#0d1a2e;border-color:#1e3a6e;color:#5b8dee}
  .nav-btn.primary:hover{background:#112244}
  .counter{font-size:12px;color:#444;text-align:center;flex:1}
</style>
</head>
<body>
<div class="deck">
  <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>
  <div class="card" id="card">
    <div class="slide-num" id="slideNum"></div>
    <div id="content"></div>
  </div>
  <div class="nav">
    <button class="nav-btn" id="prevBtn" onclick="go(-1)">← Back</button>
    <span class="counter" id="counter"></span>
    <button class="nav-btn primary" id="nextBtn" onclick="go(1)">Next →</button>
  </div>
</div>
<a href="PC_Dashboard.html" style="position:fixed;bottom:16px;left:16px;padding:8px 16px;background:#141414;border:1px solid #2a2a2a;border-radius:8px;color:#888;font-size:12px;font-family:-apple-system,sans-serif;text-decoration:none;z-index:999">← Home</a>

<script>
const SLIDES = [
  {
    label: "Chapter 6 · Cancellation & Nonrenewal",
    title: "General Cancellation Rule — Fire & Casualty",
    body: `<p>Any fire or casualty policy that allows the insurer to cancel must include a provision notifying the insured in writing at least <strong>30 days before the cancellation effective date</strong>.</p>
<div class="info-grid" style="margin-top:.8rem">
  <div class="num-card"><div class="num-big">30 days</div><div class="num-desc"><strong>Minimum written notice</strong> required before cancellation — must specify the cancellation date in clear language.</div></div>
  <div class="info-row"><div class="info-label">Does NOT Apply To</div><div class="info-val">Health, accident, or hospitalization policies · Crop-hail policies · Policies cancelled for <strong>nonpayment of premium</strong></div></div>
</div>`
  },
  {
    label: "Business & Professional P&C · Cancellation",
    title: "When a Business Policy Can Be Cancelled",
    body: `<div class="info-grid">
  <div class="num-card"><div class="num-big">90 days</div><div class="num-desc">A business/professional P&C policy in effect for <strong>90 days or more</strong> can only be cancelled for specific valid reasons.</div></div>
</div>
<p style="margin-top:.8rem;font-size:13px;color:#aaa">Valid reasons for cancellation after 90 days:</p>
<ul class="bullet">
  <li><strong>Nonpayment of premium</strong></li>
  <li><strong>Material misrepresentation</strong> in obtaining the policy</li>
  <li>Insured's <strong>violation of a material term or condition</strong> of the policy</li>
  <li><strong>Unfavorable underwriting factors</strong> specific to the insured that were not present at inception</li>
  <li>Commissioner determines continuation would place insurer in a <strong>hazardous financial condition</strong></li>
  <li>Commissioner determines insurer no longer has <strong>adequate reinsurance</strong></li>
</ul>`
  },
  {
    label: "Business & Professional P&C · Nonrenewal",
    title: "Nonrenewal of Business Policies",
    body: `<div class="info-grid">
  <div class="num-card"><div class="num-big">60 days</div><div class="num-desc"><strong>Minimum written notice</strong> required when an insurer refuses to renew or substitute similar coverage for a business or professional policy.</div></div>
  <div class="info-row"><div class="info-label">Notice Delivery</div><div class="info-val">Must be sent to the named insured at their <strong>last known address</strong>. May also be given to the insured's agent.</div></div>
  <div class="info-row"><div class="info-label">Written Explanation Required</div><div class="info-val">Insurer must provide a <strong>written explanation specifically detailing the reasons</strong> for cancellation or nonrenewal. The insurer has no liability for statements made in good faith in the cancellation notice.</div></div>
</div>`
  },
  {
    label: "Auto Liability · Special Provisions",
    title: "Which Auto Policies Get Special Protection",
    body: `<p>Special cancellation/nonrenewal rules apply to auto policies issued to <strong>individuals or married couples</strong> where the insured vehicle is:</p>
<ul class="bullet" style="margin-top:.6rem">
  <li>A <strong>private passenger or station wagon</strong> not used as a public/livery conveyance or rented to others</li>
  <li>Any other <strong>4-wheel vehicle with a load capacity of 1,500 lbs or less</strong> not used in the insured's occupation, business, or profession (other than farming)</li>
</ul>
<div class="info-grid" style="margin-top:.8rem">
  <div class="info-row"><div class="info-label">Does NOT Apply To Policies</div><div class="info-val">Issued by the <strong>Kansas Automobile Assigned Risk Plan</strong> · Insuring <strong>more than 4 vehicles</strong> · Issued to garages, auto sales agencies, repair shops, service stations, or public parking lots</div></div>
</div>`
  },
  {
    label: "Auto Liability · Nonrenewal",
    title: "Auto Policy Nonrenewal Rules",
    body: `<div class="info-grid">
  <div class="num-card"><div class="num-big">30 days</div><div class="num-desc"><strong>Minimum written notice</strong> when denying renewal of an auto policy — sent to the named insured's last known address.</div></div>
</div>
<p style="margin-top:.8rem;font-size:13px;color:#aaa">Nonrenewal is only valid for these reasons:</p>
<ul class="bullet">
  <li>Commissioner orders insurer to <strong>reduce premium volume</strong> to preserve financial integrity</li>
  <li>Insurer <strong>ceases to transact business</strong> in Kansas</li>
  <li>Competent medical evidence that insured has a <strong>physical or mental disability</strong> impairing safe operation</li>
  <li><strong>Unfavorable underwriting factors</strong> that couldn't have been determined at original issuance or last renewal</li>
  <li>Policy has been in effect for a <strong>period of five years</strong></li>
  <li>A valid reason for <strong>cancellation</strong> also exists</li>
</ul>`
  },
  {
    label: "Auto Liability · Cancellation",
    title: "Auto Policy Cancellation — After 60 Days",
    body: `<p>When an auto policy has been in effect for at least <strong>60 days</strong> (or is a renewal), the insurer may NOT cancel solely because of the <strong>age of the insured</strong> unless one of these occurs:</p>
<ul class="bullet" style="margin-top:.6rem">
  <li><strong>Nonpayment of premium</strong> (including installments under a premium finance agreement)</li>
  <li>Insurance was obtained through <strong>fraudulent misrepresentation</strong></li>
  <li>Insured violates any <strong>terms and conditions</strong> of the policy</li>
  <li>Named insured or any household operator has their <strong>driver's license suspended or revoked</strong></li>
  <li>Insured is subject to <strong>epilepsy or heart attacks</strong> and cannot produce a physician's certificate of safe driving ability</li>
  <li>Named insured or household operator has been <strong>convicted within the last 36 months</strong> of qualifying offenses (see next slide)</li>
</ul>`
  },
  {
    label: "Auto Liability · Convictions",
    title: "Convictions That Allow Cancellation",
    body: `<p>Cancellation is allowed if the named insured or any household/customary operator has been convicted within the last <strong>36 months</strong> of:</p>
<div class="info-grid" style="margin-top:.8rem">
  <div class="info-row"><div class="info-label">Any Felony</div><div class="info-val">Conviction of any felony within the last 36 months</div></div>
  <div class="info-row"><div class="info-label">DUI / DWI</div><div class="info-val">Driving under the influence of drugs or alcohol</div></div>
  <div class="info-row"><div class="info-label">Third Moving Violation</div><div class="info-val">Conviction of a <strong>3rd moving violation within 18 months</strong></div></div>
</div>
<div class="warn-box"><p>📝 Three separate lookback windows: <strong>36 months</strong> for felony/DUI · <strong>18 months</strong> for the 3-violation rule.</p></div>`
  },
  {
    label: "Auto Liability · KAIP Notice",
    title: "Kansas Automobile Insurance Plan Notice",
    body: `<div class="info-grid">
  <div class="info-row"><div class="info-label">Required Notification</div><div class="info-val">When an auto liability policy is <strong>cancelled or nonrenewed for any reason other than nonpayment of premium</strong>, the insurer must notify the insured of their possible eligibility for coverage through the <strong>Kansas Automobile Insurance Plan (KAIP)</strong>.</div></div>
</div>
<div class="warn-box" style="margin-top:.8rem"><p>💡 KAIP is the state's assigned risk plan — a safety net for drivers who can't obtain coverage in the standard market. Nonpayment cancellations don't require this notice.</p></div>`
  },
  {
    label: "Numbers to Memorize",
    title: "Cancellation & Nonrenewal — Key Numbers",
    body: `<div class="two-col">
  <div class="mini-card"><div class="mini-label">General Cancellation</div><div class="mini-val"><strong>30 days</strong> written notice (fire/casualty)</div></div>
  <div class="mini-card"><div class="mini-label">Business P&C Protection</div><div class="mini-val">After <strong>90 days</strong> — restricted cancellation</div></div>
  <div class="mini-card"><div class="mini-label">Business Nonrenewal Notice</div><div class="mini-val"><strong>60 days</strong> written notice</div></div>
  <div class="mini-card"><div class="mini-label">Auto Nonrenewal Notice</div><div class="mini-val"><strong>30 days</strong> written notice</div></div>
  <div class="mini-card"><div class="mini-label">Auto Protection Threshold</div><div class="mini-val">After <strong>60 days</strong> — age-based cancellation restricted</div></div>
  <div class="mini-card"><div class="mini-label">Auto Load Capacity</div><div class="mini-val"><strong>1,500 lbs</strong> or less for special provisions</div></div>
  <div class="mini-card"><div class="mini-label">Felony / DUI Lookback</div><div class="mini-val"><strong>36 months</strong></div></div>
  <div class="mini-card"><div class="mini-label">Moving Violations</div><div class="mini-val">3rd violation within <strong>18 months</strong></div></div>
  <div class="mini-card"><div class="mini-label">Auto Nonrenewal — 5 Yrs</div><div class="mini-val">Policy in effect for <strong>5 years</strong> = valid nonrenewal reason</div></div>
</div>`
  }
];

let cur = 0;
function render() {
  const s = SLIDES[cur];
  document.getElementById('content').innerHTML =
    `<div class="card-label">${s.label}</div><div class="card-title">${s.title}</div><div class="card-body">${s.body}</div>`;
  document.getElementById('fill').style.width = ((cur + 1) / SLIDES.length * 100) + '%';
  document.getElementById('counter').textContent = (cur + 1) + ' of ' + SLIDES.length;
  document.getElementById('slideNum').textContent = (cur + 1) + ' / ' + SLIDES.length;
  document.getElementById('prevBtn').disabled = cur === 0;
  document.getElementById('nextBtn').textContent = cur === SLIDES.length - 1 ? '✓ Done' : 'Next →';
  document.getElementById('nextBtn').onclick = cur === SLIDES.length - 1
    ? () => window.location.href = 'PC_Dashboard.html'
    : () => go(1);
}
function go(dir) { cur = Math.max(0, Math.min(SLIDES.length - 1, cur + dir)); render(); }
render();
</script>
</body>
</html>
