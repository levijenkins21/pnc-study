<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Key Numbers & Limits — P&C Study</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0a0a0a;--surface:#141414;--surface2:#1a1a1a;
  --border:#222;--border2:#2a2a2a;
  --gold:#c8a84b;--gold-dim:rgba(200,168,75,.15);
  --green:#4aaa4a;--green-dim:rgba(74,170,74,.12);
  --red:#aa4a4a;--red-dim:rgba(170,74,74,.12);
  --text:#e2e2e2;--muted:#555;--muted2:#333;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent;user-select:none;}

#progress-rail{position:fixed;top:0;left:0;width:100%;height:3px;background:var(--border);z-index:100;}
#progress-fill{height:100%;background:var(--gold);width:0%;transition:width .4s ease;}

.header{padding:20px 20px 0;padding-top:22px;}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.back-link{color:var(--muted);font-size:12px;text-decoration:none;}
.deck-tag{font-size:10px;font-weight:600;letter-spacing:1px;color:var(--gold);background:var(--gold-dim);border:1px solid rgba(200,168,75,.25);padding:3px 10px;border-radius:20px;}
.header h1{font-size:22px;font-weight:700;color:#fff;margin-bottom:2px;}
.header-sub{font-size:12px;color:var(--muted);}

.mode-tabs{display:flex;padding:0 20px;margin-top:16px;border-bottom:1px solid var(--border);}
.mode-tab{font-size:12px;font-weight:500;color:var(--muted);padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit;}
.mode-tab.active{color:var(--gold);border-bottom-color:var(--gold);}

.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border-bottom:1px solid var(--border);}
.stat-cell{background:var(--bg);padding:12px 6px;text-align:center;}
.stat-val{font-size:24px;font-weight:700;color:var(--gold);line-height:1;}
.stat-val.g{color:var(--green);}
.stat-val.r{color:var(--red);}
.stat-lbl{font-size:9px;font-weight:600;letter-spacing:1px;color:var(--muted);margin-top:2px;text-transform:uppercase;}

/* ── FLASHCARD VIEW ── */
#flash-view{padding:16px 16px 80px;}
.mode-banner{display:none;background:rgba(170,74,74,.12);border:1px solid rgba(170,74,74,.25);border-radius:8px;padding:8px 14px;margin-bottom:12px;font-size:11px;color:var(--red);text-align:center;font-weight:600;letter-spacing:.5px;}
.mode-banner.visible{display:block;}
.card-nav-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.card-pos{font-size:12px;color:var(--muted);}
.card-pos strong{color:var(--text);}
.skip-btn{background:none;border:none;color:var(--muted2);font-size:11px;cursor:pointer;font-family:inherit;}

/* ── 3D CARD ── */
.card-scene{perspective:1200px;margin-bottom:10px;cursor:pointer;touch-action:pan-y;}
.card{position:relative;width:100%;min-height:280px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1);border-radius:12px;}
.card.flipped{transform:rotateY(180deg);}
.card-face{position:absolute;top:0;left:0;right:0;min-height:280px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;padding:20px 18px;display:flex;flex-direction:column;}
.card-front{background:var(--surface);border:1px solid var(--border2);box-shadow:0 4px 20px rgba(0,0,0,.4);}
.card-back{background:#0a140a;border:1px solid #1a301a;box-shadow:0 4px 20px rgba(0,0,0,.4);transform:rotateY(180deg);}

.topic-pill{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;letter-spacing:.5px;padding:3px 10px;border-radius:20px;margin-bottom:12px;width:fit-content;}
.tp-auto{background:rgba(129,140,248,.1);border:1px solid rgba(129,140,248,.2);color:#818cf8;}
.tp-property{background:rgba(200,168,75,.1);border:1px solid rgba(200,168,75,.2);color:#c8a84b;}
.tp-liability{background:rgba(170,74,74,.1);border:1px solid rgba(170,74,74,.2);color:#f87171;}
.tp-general{background:rgba(85,85,85,.15);border:1px solid rgba(85,85,85,.3);color:#888;}
.tp-state{background:rgba(96,165,250,.1);border:1px solid rgba(96,165,250,.2);color:#60a5fa;}
.tp-flood{background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.2);color:#38bdf8;}
.tp-formula{background:rgba(192,132,252,.1);border:1px solid rgba(192,132,252,.2);color:#c084fc;}

/* FRONT */
.card-label{font-size:9px;font-weight:600;letter-spacing:2px;color:var(--muted);margin-bottom:10px;text-transform:uppercase;}
.card-q{font-size:15px;line-height:1.75;color:var(--text);font-weight:500;flex:1;}
.recall-prompt{margin-top:14px;background:rgba(200,168,75,.06);border:1px solid rgba(200,168,75,.12);border-radius:8px;padding:10px 14px;text-align:center;}
.recall-prompt-text{font-size:11px;color:#8a7030;font-weight:500;}

/* BACK */
.num-reveal{font-size:56px;font-weight:700;color:var(--gold);line-height:1;margin:8px 0 4px;letter-spacing:-1px;}
.num-unit{font-size:20px;font-weight:500;color:#9a7828;margin-left:3px;}
.rule-text{font-size:12px;line-height:1.75;color:var(--text);margin-top:8px;}
.rule-text strong{color:var(--gold);}
.mem-box{margin-top:10px;background:rgba(74,170,74,.07);border:1px solid rgba(74,170,74,.15);border-radius:8px;padding:10px 12px;}
.mem-label{font-size:9px;font-weight:600;letter-spacing:1px;color:var(--green);margin-bottom:3px;text-transform:uppercase;}
.mem-text{font-size:11px;color:#5fb85f;line-height:1.6;}

/* Swipe overlays */
.swipe-hint{position:absolute;inset:0;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;letter-spacing:2px;opacity:0;pointer-events:none;z-index:5;transition:opacity .1s;}
.swipe-hint.knew{background:rgba(74,170,74,.15);color:var(--green);border:2px solid rgba(74,170,74,.3);}
.swipe-hint.missed{background:rgba(170,74,74,.12);color:var(--red);border:2px solid rgba(170,74,74,.25);}

/* FLIP BUTTON — always visible, prominent */
.flip-btn-wrap{margin-bottom:10px;}
.flip-btn{
  width:100%;background:var(--surface2);border:1px solid var(--border2);
  color:var(--text);font-size:14px;font-weight:600;padding:13px;
  border-radius:8px;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:background .15s;
}
.flip-btn:active{background:var(--border);}
.flip-btn-icon{font-size:16px;transition:transform .3s;}
.flip-btn.flipped .flip-btn-icon{transform:rotateY(180deg);}

/* Answer buttons */
.answer-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.answer-btns.hidden{display:none;}
.ans-btn{border:1px solid;font-size:14px;font-weight:700;padding:13px 16px;border-radius:8px;cursor:pointer;font-family:inherit;transition:transform .1s;}
.ans-btn:active{transform:scale(0.97);}
.btn-missed{background:var(--red-dim);border-color:rgba(170,74,74,.3);color:var(--red);}
.btn-knew{background:var(--green-dim);border-color:rgba(74,170,74,.3);color:var(--green);}

.bottom-nav{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:4px;}
.nav-btn{background:var(--surface2);border:1px solid var(--border2);color:var(--text);font-size:14px;font-weight:600;padding:12px;border-radius:8px;cursor:pointer;font-family:inherit;}
.nav-btn:active:not(:disabled){background:var(--border);}
.nav-btn:disabled{opacity:.25;cursor:not-allowed;}
.nav-btn.primary{background:var(--gold);border-color:var(--gold);color:#0a0a0a;}
.nav-btn.primary:active{background:#b09040;}
.kb-hint{text-align:center;font-size:10px;color:var(--muted2);margin-top:6px;}

/* ── LIST VIEW ── */
#list-view{display:none;padding:12px 16px 80px;}
.cat-hdr{display:flex;align-items:center;gap:8px;padding:14px 0 8px;border-bottom:1px solid var(--border);margin-bottom:10px;margin-top:6px;}
.cat-icon{font-size:15px;}
.cat-lbl{font-size:11px;font-weight:600;letter-spacing:1px;color:var(--muted);text-transform:uppercase;}
.cat-count{font-size:18px;font-weight:700;color:var(--muted2);margin-left:auto;}
.list-card{background:var(--surface);border:1px solid var(--border2);border-radius:8px;padding:14px 16px;margin-bottom:8px;}
.list-num{font-size:30px;font-weight:700;color:var(--gold);line-height:1;margin-bottom:4px;}
.list-q{font-size:11px;color:var(--muted);margin-bottom:6px;}
.list-rule{font-size:12px;color:var(--text);line-height:1.7;margin-bottom:6px;}
.list-mem{font-size:11px;color:#5fb85f;line-height:1.6;border-top:1px solid rgba(74,170,74,.1);padding-top:6px;}

/* ── SCORE VIEW ── */
#score-view{display:none;padding:28px 20px;text-align:center;}
.score-ring-wrap{position:relative;width:160px;height:160px;margin:0 auto 20px;}
.score-ring-wrap svg{transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:var(--border);stroke-width:12;}
.ring-fill{fill:none;stroke:var(--gold);stroke-width:12;stroke-linecap:round;transition:stroke-dasharray 1s ease;}
.ring-fill.good{stroke:var(--green);}
.score-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.score-pct{font-size:48px;font-weight:700;color:#fff;line-height:1;}
.score-of{font-size:10px;font-weight:600;letter-spacing:1px;color:var(--muted);margin-top:2px;}
.score-breakdown{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.score-block{background:var(--surface);border:1px solid var(--border2);border-radius:8px;padding:14px;}
.score-block-val{font-size:32px;font-weight:700;line-height:1;margin-bottom:4px;}
.score-block-val.g{color:var(--green);}
.score-block-val.r{color:var(--red);}
.score-block-lbl{font-size:10px;font-weight:600;letter-spacing:1px;color:var(--muted);text-transform:uppercase;}
.score-msg{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:20px;}
.score-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.score-btn{border:none;font-size:13px;font-weight:700;padding:13px;border-radius:8px;cursor:pointer;font-family:inherit;}
.btn-restart{background:var(--surface2);border:1px solid var(--border2);color:var(--text);}
.btn-missed-only{background:var(--red-dim);border:1px solid rgba(170,74,74,.3);color:var(--red);}
.btn-missed-only:disabled{opacity:.3;cursor:not-allowed;}
</style>
</head>
<body>

<div id="progress-rail"><div id="progress-fill"></div></div>

<div class="header">
  <div class="header-top">
    <a class="back-link" href="PC_Dashboard.html">← Dashboard</a>
    <span class="deck-tag" id="deck-tag">KEY NUMBERS</span>
  </div>
  <h1>Numbers & Limits</h1>
  <div class="header-sub">Every dollar, day, and percentage the exam tests</div>
</div>

<div class="mode-tabs">
  <button class="mode-tab active" onclick="setMode('flash',this)">Flashcards</button>
  <button class="mode-tab" onclick="setMode('list',this)">Quick Ref</button>
</div>

<div class="stats-row">
  <div class="stat-cell"><div class="stat-val" id="s-total">0</div><div class="stat-lbl">Total</div></div>
  <div class="stat-cell"><div class="stat-val g" id="s-knew">0</div><div class="stat-lbl">Knew It</div></div>
  <div class="stat-cell"><div class="stat-val r" id="s-missed">0</div><div class="stat-lbl">Missed</div></div>
  <div class="stat-cell"><div class="stat-val" id="s-pct">—</div><div class="stat-lbl">Score</div></div>
</div>

<div id="flash-view">
  <div class="mode-banner" id="mode-banner">REVIEWING MISSED CARDS</div>
  <div class="card-nav-row">
    <div class="card-pos"><strong id="cur-num">1</strong> / <span id="tot-num">0</span></div>
    <button class="skip-btn" onclick="nextCard()">Skip →</button>
  </div>

  <div class="card-scene" id="card-scene">
    <div class="card" id="card">
      <div class="card-face card-front" id="cf-front"></div>
      <div class="card-face card-back" id="cf-back"></div>
    </div>
    <div class="swipe-hint knew" id="sh-knew">✓ KNEW IT</div>
    <div class="swipe-hint missed" id="sh-missed">✕ MISSED</div>
  </div>

  <!-- Dedicated flip button — always visible -->
  <div class="flip-btn-wrap">
    <button class="flip-btn" id="flip-btn" onclick="flipCard()">
      <span class="flip-btn-icon">↻</span>
      <span id="flip-btn-label">Reveal Answer</span>
    </button>
  </div>

  <div class="answer-btns hidden" id="ans-btns">
    <button class="ans-btn btn-missed" onclick="markCard(false)">✕ Missed It</button>
    <button class="ans-btn btn-knew" onclick="markCard(true)">✓ Knew It</button>
  </div>

  <div class="bottom-nav">
    <button class="nav-btn" id="prev-btn" onclick="prevCard()" disabled>◀ Prev</button>
    <button class="nav-btn primary" id="next-btn" onclick="nextCard()">Next ▶</button>
  </div>
  <div class="kb-hint">Space = flip · K = knew · M = missed · ← → navigate</div>
</div>

<div id="list-view"></div>

<div id="score-view">
  <div class="score-ring-wrap">
    <svg width="160" height="160" viewBox="0 0 160 160">
      <circle class="ring-bg" cx="80" cy="80" r="66"/>
      <circle class="ring-fill" id="ring-fill" cx="80" cy="80" r="66" stroke-dasharray="0 415"/>
    </svg>
    <div class="score-center">
      <div class="score-pct" id="fin-pct">0%</div>
      <div class="score-of" id="fin-of">OF 0</div>
    </div>
  </div>
  <div class="score-breakdown">
    <div class="score-block"><div class="score-block-val g" id="fin-knew">0</div><div class="score-block-lbl">Knew It</div></div>
    <div class="score-block"><div class="score-block-val r" id="fin-missed">0</div><div class="score-block-lbl">Still Learning</div></div>
  </div>
  <div class="score-msg" id="score-msg"></div>
  <div class="score-actions">
    <button class="score-btn btn-restart" onclick="restart(false)">Run Full Deck</button>
    <button class="score-btn btn-missed-only" id="btn-missed-only" onclick="restart(true)">Review Missed</button>
  </div>
</div>

<script>
const ALL_CARDS = [
  // ── AUTO ──
  {t:'auto',num:'$20/day',unit:'',q:'Transportation expense after theft: how much per day, and what\'s the maximum total payout?',r:'<strong>$20 per day</strong>, up to a maximum of <strong>$600 total</strong> (30 days × $20).',m:'"$20 × 30 days = $600." The trap answers are $30/day or $500 max — both wrong. Lock in $20/$600.'},
  {t:'auto',num:'48 hours',unit:'',q:'How long after your car is stolen before transportation expense coverage kicks in?',r:'Coverage starts <strong>48 hours</strong> after the theft — and only if the car hasn\'t been recovered.',m:'"Two full days before the clock starts." 48 hours = 2 days. Not 24, not 72.'},
  {t:'auto',num:'25 / 50 / 15',unit:'',q:'Explain what a 25/50/15 split limit means on an auto policy.',r:'<strong>$25,000</strong> max per injured person · <strong>$50,000</strong> max per accident (all injured people combined) · <strong>$15,000</strong> max for property damage.',m:'"Apply in order: per-person cap first, then total accident cap, then PD." One person can never get more than $25k, even if $50k is available.'},
  {t:'auto',num:'3 / 18 months',unit:'',q:'In Kansas, what moving violation history allows an insurer to cancel an auto policy that\'s been in force 50+ days?',r:'<strong>3 moving violations within 18 months.</strong> Both the count and the window matter.',m:'"Three strikes in a year and a half." Speeding, red light, failure to yield — all count. Parking tickets don\'t.'},
  {t:'auto',num:'UM = BI',unit:'',q:'In Kansas, how must uninsured motorist (UM) limits compare to bodily injury (BI) liability limits?',r:'UM limits must <strong>equal</strong> the BI liability limits. They cannot be lower.',m:'"UM = BI, same protection both ways." You can\'t protect others more than you protect yourself.'},

  // ── PROPERTY ──
  {t:'property',num:'80%',unit:'',q:'What coinsurance percentage must a homeowner maintain to receive full replacement cost coverage?',r:'Must insure the dwelling to at least <strong>80% of its replacement cost</strong> at the time of loss. Insure for less and YOU become a co-insurer on every claim.',m:'"80 or you share the blow." Under-insure by even $1 and every claim is partially yours.'},
  {t:'formula',num:'Have ÷ Need × Loss',unit:'',q:'Walk through the coinsurance formula. House worth $100k, insured for $60k, loss of $40k. What does the insurer pay?',r:'Need = 80% × $100k = <strong>$80k</strong><br>Have = $60k<br><strong>60 ÷ 80 × $40,000 = $30,000</strong><br><br>The insured eats the other $10k.',m:'"Have divided by Need, times the Loss." Always calculate Need first. The shortfall comes out of YOUR pocket.'},
  {t:'property',num:'$500 / $1,000',unit:'',q:'Homeowners policy: what\'s the per-tree limit for removal, and what\'s the total max?',r:'<strong>$500 per tree</strong> and <strong>$1,000 total maximum</strong> per loss event — regardless of how many trees.<br><br>Coverage only applies if the tree is blocking the driveway or damaged a covered structure.',m:'"$500 a tree, $1,000 ceiling." 4 trees at $600 each = $2,400 claimed → you get $1,000. Two caps, both enforced.'},
  {t:'property',num:'RC − D',unit:'',q:'What is the formula for Actual Cash Value (ACV)?',r:'<strong>Replacement Cost minus Depreciation.</strong><br><br>ACV = what it costs to buy new today, minus a deduction for age and wear.',m:'"New price minus old age." ACV is always less than replacement cost. The older the item, the bigger the gap.'},
  {t:'property',num:'A · B · C · D',unit:'',q:'What do Coverage A, B, C, and D stand for in a homeowners or dwelling policy?',r:'<strong>A</strong> = Dwelling (main structure)<br><strong>B</strong> = Other Structures (detached garage, fence)<br><strong>C</strong> = Contents (personal property)<br><strong>D</strong> = Loss of Use / Fair Rental Value',m:'"All Buildings Cover Dwellings." A=house, B=outbuildings, C=contents, D=displacement costs.'},
  {t:'property',num:'DP-1 / 2 / 3',unit:'',q:'What are the three dwelling policy forms, and what type of coverage does each provide?',r:'<strong>DP-1</strong> = Basic Form — named perils only, ACV settlement<br><strong>DP-2</strong> = Broad Form — named perils, replacement cost<br><strong>DP-3</strong> = Special Form — open perils on dwelling',m:'"1 = Bare, 2 = Broad, 3 = Special." Each level is a step up. DP-1 is the most restrictive.'},
  {t:'property',num:'DP-2 & DP-3 only',unit:'',q:'In which dwelling policy forms is Coverage E (Additional Living Expense) automatically included?',r:'Coverage E is <strong>automatic in DP-2 and DP-3 only.</strong> DP-1 does NOT include it — the basic form is bare bones.',m:'"Basic (DP-1) = no living expense." You need at least DP-2 to get the hotel money.'},
  {t:'property',num:'HO-3 vs HO-5',unit:'',q:'What is the key difference between HO-3 and HO-5 for personal property (contents) coverage?',r:'<strong>HO-3</strong> = contents covered on named perils basis only<br><strong>HO-5</strong> = contents covered on open perils basis<br><br>Both cover the dwelling structure on open perils.',m:'"HO-5 is the upgrade — open peril everywhere." HO-3 covers contents only if the cause is on the list. HO-5 covers unless excluded.'},

  // ── FLOOD / NFIP ──
  {t:'flood',num:'$250,000',unit:'building',q:'Under the NFIP, what is the maximum flood coverage available for a single-family dwelling structure?',r:'<strong>$250,000</strong> for the building under the National Flood Insurance Program.',m:'"Quarter million for the structure." Easy anchor. Contents is always less.'},
  {t:'flood',num:'$100,000',unit:'contents',q:'Under the NFIP, what is the maximum contents coverage for a single-family dwelling?',r:'<strong>$100,000</strong> for personal property under NFIP.',m:'"$250k building, $100k stuff." Building is always 2.5× the contents limit.'},

  // ── FAIR PLAN ──
  {t:'state',num:'$400,000',unit:'dwelling cap',q:'What is the maximum dwelling coverage available under the Kansas FAIR Plan?',r:'The lesser of market value, ACV, or <strong>$400,000.</strong> The cap prevents over-insuring high-risk properties.',m:'"FAIR Plan = $400k ceiling." If someone quotes you $500k or $250k, they\'re wrong.'},
  {t:'state',num:'$10,000',unit:'theft max',q:'What is the Kansas FAIR Plan\'s maximum coverage for theft of personal property?',r:'<strong>$10,000</strong> maximum for theft coverage under the FAIR Plan.',m:'"FAIR Plan theft = $10k, that\'s it." The FAIR Plan is limited by design — it\'s a last resort.'},

  // ── KANSAS STATE LAW ──
  {t:'state',num:'30 days',unit:'',q:'How far in advance must personal lines insurance rates be filed with the Kansas Insurance Department before use?',r:'At least <strong>30 days prior to use.</strong> If disapproved within those 30 days, they cannot be used.',m:'"30 days before you charge them." File → wait → use. Skip the wait and you\'re in violation.'},
  {t:'state',num:'10 days',unit:'',q:'After an insured requests a proof of loss form following a covered loss, how many days does the insurer have to provide it?',r:'The insurer must deliver the form within <strong>10 days</strong> of the request.',m:'"10 days — no stalling." The insurer can\'t delay the claims process by sitting on forms.'},
  {t:'state',num:'3 years',unit:'',q:'How long does the premium discount last after completing an approved motor vehicle accident prevention course in Kansas?',r:'The discount applies for <strong>3 years</strong> following course completion.',m:'"Defensive driving = 3-year discount." Not 1 year, not 2 years. 3 years.'},
  {t:'state',num:'Odd / Even',unit:'birth year',q:'How is a Kansas producer\'s CE biennium determined? When do odd-birth-year producers complete CE?',r:'Determined by <strong>birth year.</strong> Odd birth year → CE due in odd-numbered years. Even birth year → CE due in even-numbered years.',m:'"Born odd, study odd. Born even, study even." Your birth year locks your CE cycle forever.'},
  {t:'state',num:'KIGA',unit:'required',q:'What must ALL admitted P&C insurers in Kansas maintain as a condition of their certificate of authority?',r:'Membership in the <strong>Kansas Insurance Guaranty Association (KIGA)</strong> — no exceptions for admitted carriers.',m:'"Admitted in Kansas = KIGA member, period." If they\'re admitted, they\'re in KIGA. No opt-out.'},

  // ── LIABILITY ──
  {t:'liability',num:'$250/day',unit:'lost earnings',q:'CGL supplementary payments: what is the maximum per-day amount for the insured\'s lost earnings while attending a trial?',r:'<strong>$250 per day</strong> for loss of earnings. The common wrong answer is $500/day.',m:'"$250 — not $500." The exam loves putting $500 in the choices. It\'s $250.'},
  {t:'liability',num:'$250',unit:'bail bond',q:'CGL supplementary payments: what is the maximum for bail bond costs to release the insured?',r:'<strong>$250</strong> for bail bonds. The common wrong answer is $2,000.',m:'"$250 bail — not $2,000." Both CGL supplementary payment numbers are $250. Easy to remember once you know they match.'},

  // ── GENERAL / FEDERAL ──
  {t:'general',num:'4 elements',unit:'',q:'What are the four required elements of a legally valid insurance contract?',r:'<strong>1. Offer & Acceptance</strong><br><strong>2. Consideration</strong> (premium in exchange for coverage)<br><strong>3. Competent Parties</strong> (both must have legal capacity)<br><strong>4. Legal Purpose</strong><br><br>Beneficiary\'s consent is NOT one of them.',m:'"OCCP — Offer, Consideration, Competent parties, Purpose." If you see "beneficiary\'s consent" in the choices, it\'s the wrong answer.'},
  {t:'general',num:'TRIA',unit:'',q:'What federal act requires all commercial insurers to offer terrorism coverage and shares the risk with the government?',r:'<strong>Terrorism Risk Insurance Act (TRIA).</strong><br><br>Covers commercial lines including workers comp. <strong>Excludes</strong> commercial auto, crop insurance, and burglary/theft.',m:'"TRIA = terrorism umbrella." Workers comp is IN. Commercial auto and crop are OUT. Know the exclusions.'},
  {t:'general',num:'FCRA',unit:'',q:'What federal act regulates consumer reports and credit reports used in insurance underwriting?',r:'<strong>Federal Fair Credit Reporting Act (FCRA).</strong> Governs consumer investigative reports used in underwriting decisions.',m:'"FCRA = Credit Files." Not TCPA (that\'s telemarketing), not BSA (that\'s money laundering).'},
];

// ── STATE ──
let deck=[...ALL_CARDS];
let cur=0,flipped=false;
let scores=new Array(ALL_CARDS.length).fill(null); // indexed by ALL_CARDS index
let deckIndices=[...Array(ALL_CARDS.length).keys()]; // which ALL_CARDS indices are in current deck
let reviewMode=false;
let touchStartX=0,isDragging=false;
const CIRC=2*Math.PI*66;

init();

function init(){
  document.getElementById('tot-num').textContent=deck.length;
  document.getElementById('s-total').textContent=ALL_CARDS.length;
  document.getElementById('fin-of').textContent='OF '+ALL_CARDS.length;
  buildListView();setupSwipe();setupKeyboard();renderCard();updateStats();
}

function renderCard(){
  if(cur>=deck.length){showScore();return;}
  const c=deck[cur];
  const tm=TOPIC_META[c.t]||TOPIC_META.general;
  flipped=false;

  const card=document.getElementById('card');
  card.style.transition='none';
  card.style.transform='translateX(0) rotate(0deg)';
  card.style.opacity='1';
  card.classList.remove('flipped');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{card.style.transition='';}));

  document.getElementById('cf-front').innerHTML=`
    <div class="topic-pill tp-${c.t}">${tm.icon} ${tm.label}</div>
    <div class="card-label">Recall the Number</div>
    <div class="card-q">${c.q}</div>
    <div class="recall-prompt">
      <div class="recall-prompt-text">Think of your answer, then tap Reveal ↓</div>
    </div>`;

  document.getElementById('cf-back').innerHTML=`
    <div class="topic-pill tp-${c.t}">${tm.icon} ${tm.label}</div>
    <div class="card-label">Answer</div>
    <div class="num-reveal">${c.num}<span class="num-unit">${c.unit||''}</span></div>
    <div class="rule-text">${c.r}</div>
    <div class="mem-box">
      <div class="mem-label">💡 Lock It In</div>
      <div class="mem-text">${c.m}</div>
    </div>`;

  document.getElementById('cur-num').textContent=cur+1;
  document.getElementById('tot-num').textContent=deck.length;
  document.getElementById('ans-btns').className='answer-btns hidden';
  document.getElementById('prev-btn').disabled=cur===0;
  document.getElementById('next-btn').textContent=cur===deck.length-1?'Finish':'Next ▶';
  document.getElementById('sh-knew').style.opacity='0';
  document.getElementById('sh-missed').style.opacity='0';

  const fb=document.getElementById('flip-btn');
  fb.classList.remove('flipped');
  document.getElementById('flip-btn-label').textContent='Reveal Answer';

  document.getElementById('progress-fill').style.width=((cur/deck.length)*100)+'%';
}

const TOPIC_META={
  auto:    {icon:'🚗',label:'Auto'},
  property:{icon:'🏠',label:'Property'},
  liability:{icon:'⚖️',label:'Liability'},
  general: {icon:'📋',label:'General'},
  state:   {icon:'🏛️',label:'Kansas State Law'},
  flood:   {icon:'🌊',label:'NFIP / Flood'},
  formula: {icon:'🧮',label:'Formula'},
};

function flipCard(){
  flipped=!flipped;
  const card=document.getElementById('card');
  const fb=document.getElementById('flip-btn');
  if(flipped){
    card.classList.add('flipped');
    document.getElementById('ans-btns').className='answer-btns';
    fb.classList.add('flipped');
    document.getElementById('flip-btn-label').textContent='Back to Question';
  } else {
    card.classList.remove('flipped');
    document.getElementById('ans-btns').className='answer-btns hidden';
    fb.classList.remove('flipped');
    document.getElementById('flip-btn-label').textContent='Reveal Answer';
  }
}

// Tap card also flips
document.getElementById('card-scene').addEventListener('click',()=>flipCard());

function markCard(knew){
  // Map to original index
  const origIdx=deckIndices[cur] !== undefined ? deckIndices[cur] : cur;
  scores[origIdx]=knew;
  updateStats();
  animateExit(knew?'right':'left');
  setTimeout(()=>{cur++;renderCard();},350);
}
function nextCard(){
  if(cur>=deck.length-1){showScore();return;}
  animateExit('left');setTimeout(()=>{cur++;renderCard();},350);
}
function prevCard(){if(cur<=0)return;cur--;renderCard();}
function animateExit(dir){
  const card=document.getElementById('card');
  const x=dir==='right'?120:-120;
  card.style.transition='transform .35s ease,opacity .35s ease';
  card.style.transform=`translateX(${x}px) rotate(${dir==='right'?6:-6}deg)`;
  card.style.opacity='0';
}

function setupSwipe(){
  const s=document.getElementById('card-scene');
  s.addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX;isDragging=true;},{passive:true});
  s.addEventListener('touchmove',e=>{
    if(!isDragging||!flipped)return;
    const dx=e.touches[0].clientX-touchStartX;
    const card=document.getElementById('card');
    card.style.transition='none';
    card.style.transform=`rotateY(180deg) translateX(${-dx}px) rotate(${dx/25}deg)`;
    const sk=document.getElementById('sh-knew'),sm=document.getElementById('sh-missed');
    if(dx>40){sk.style.opacity=Math.min((dx-40)/60,1)+'';sm.style.opacity='0';}
    else if(dx<-40){sm.style.opacity=Math.min((-dx-40)/60,1)+'';sk.style.opacity='0';}
    else{sk.style.opacity='0';sm.style.opacity='0';}
  },{passive:true});
  s.addEventListener('touchend',e=>{
    if(!isDragging)return;isDragging=false;
    if(!flipped)return;
    const dx=e.changedTouches[0].clientX-touchStartX;
    if(dx>80){markCard(true);}
    else if(dx<-80){markCard(false);}
    else{
      const card=document.getElementById('card');
      card.style.transition='transform .3s ease';
      card.style.transform='rotateY(180deg)';
      document.getElementById('sh-knew').style.opacity='0';
      document.getElementById('sh-missed').style.opacity='0';
    }
  },{passive:true});
}

function setupKeyboard(){
  document.addEventListener('keydown',e=>{
    if(e.target.tagName==='INPUT')return;
    if(e.key===' '||e.key==='Enter'){e.preventDefault();flipCard();}
    else if(e.key==='ArrowRight')nextCard();
    else if(e.key==='ArrowLeft')prevCard();
    else if((e.key==='k'||e.key==='K')&&flipped)markCard(true);
    else if((e.key==='m'||e.key==='M')&&flipped)markCard(false);
  });
}

function updateStats(){
  const knew=scores.filter(s=>s===true).length;
  const missed=scores.filter(s=>s===false).length;
  const seen=scores.filter(s=>s!==null).length;
  const pct=seen>0?Math.round(knew/seen*100):null;
  document.getElementById('s-knew').textContent=knew;
  document.getElementById('s-missed').textContent=missed;
  document.getElementById('s-pct').textContent=pct!==null?pct+'%':'—';
}

function showScore(){
  const knew=scores.filter(s=>s===true).length;
  const missedCards=scores.map((s,i)=>s===false?i:null).filter(i=>i!==null);
  const seen=scores.filter(s=>s!==null).length;
  const pct=seen>0?Math.round(knew/seen*100):0;

  document.getElementById('flash-view').style.display='none';
  document.getElementById('score-view').style.display='block';
  document.getElementById('progress-fill').style.width='100%';
  document.getElementById('fin-pct').textContent=pct+'%';
  document.getElementById('fin-knew').textContent=knew;
  document.getElementById('fin-missed').textContent=missedCards.length;
  document.getElementById('fin-of').textContent='OF '+seen;

  const ring=document.getElementById('ring-fill');
  ring.style.strokeDasharray=`${(pct/100)*CIRC} ${CIRC}`;
  if(pct>=80)ring.classList.add('good');else ring.classList.remove('good');

  const msgs=['Keep drilling — every rep builds the memory.','Getting there. The weak spots are mapped.','Solid. Run the missed ones once more.','Strong — almost locked in.','Perfect. These numbers are yours.'];
  document.getElementById('score-msg').textContent=msgs[pct>=100?4:pct>=80?3:pct>=60?2:pct>=40?1:0];

  const btn=document.getElementById('btn-missed-only');
  btn.disabled=missedCards.length===0;
  btn.textContent=`Review Missed (${missedCards.length})`;
}

function restart(missedOnly){
  document.getElementById('score-view').style.display='none';
  document.getElementById('flash-view').style.display='block';
  document.getElementById('ring-fill').classList.remove('good');

  if(missedOnly){
    const missedIndices=scores.map((s,i)=>s===false?i:null).filter(i=>i!==null);
    deck=missedIndices.map(i=>ALL_CARDS[i]);
    deckIndices=missedIndices;
    reviewMode=true;
    document.getElementById('mode-banner').className='mode-banner visible';
    document.getElementById('deck-tag').textContent='MISSED CARDS';
    // Reset only the missed scores
    missedIndices.forEach(i=>scores[i]=null);
  } else {
    deck=[...ALL_CARDS];
    deckIndices=[...Array(ALL_CARDS.length).keys()];
    reviewMode=false;
    scores=new Array(ALL_CARDS.length).fill(null);
    document.getElementById('mode-banner').className='mode-banner';
    document.getElementById('deck-tag').textContent='KEY NUMBERS';
  }

  cur=0;flipped=false;
  document.getElementById('s-total').textContent=ALL_CARDS.length;
  renderCard();updateStats();
}

function setMode(m,btn){
  document.querySelectorAll('.mode-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('flash-view').style.display=m==='flash'?'block':'none';
  document.getElementById('list-view').style.display=m==='list'?'block':'none';
  document.getElementById('score-view').style.display='none';
}

function buildListView(){
  const topics=[...new Set(ALL_CARDS.map(c=>c.t))];
  let html='';
  topics.forEach(t=>{
    const cards=ALL_CARDS.filter(c=>c.t===t);
    const tm=TOPIC_META[t]||TOPIC_META.general;
    html+=`<div class="cat-hdr"><span class="cat-icon">${tm.icon}</span><span class="cat-lbl">${tm.label}</span><span class="cat-count">${cards.length}</span></div>`;
    cards.forEach(c=>{
      html+=`<div class="list-card"><div class="list-num">${c.num} <span style="font-size:13px;color:#888;">${c.unit||''}</span></div><div class="list-q">${c.q}</div><div class="list-rule">${c.r}</div><div class="list-mem">💡 ${c.m}</div></div>`;
    });
  });
  document.getElementById('list-view').innerHTML=html;
}
</script>
</body>
</html>
