<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P&C — Ch5: Marketing Practices</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e2e2e2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem}
  .deck{width:100%;max-width:680px}
  .progress-bar{width:100%;height:3px;background:#1a1a1a;border-radius:2px;margin-bottom:1.5rem}
  .progress-fill{height:3px;background:#5b8dee;border-radius:2px;transition:width .4s ease}
  .card{background:#141414;border:1px solid #222;border-radius:20px;padding:2.2rem 2rem;min-height:360px;display:flex;flex-direction:column;justify-content:center;margin-bottom:1.2rem;position:relative}
  .card-label{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:#5b8dee;margin-bottom:.6rem}
  .card-title{font-size:20px;font-weight:700;color:#fff;margin-bottom:.9rem;line-height:1.25}
  .card-body{font-size:14px;color:#aaa;line-height:1.75}
  .card-body strong{color:#e2e2e2;font-weight:600}
  .card-body p+p{margin-top:.7rem}
  .info-grid{display:flex;flex-direction:column;gap:8px;margin-top:.6rem}
  .info-row{background:#1a1a1a;border:1px solid #242424;border-radius:10px;padding:10px 13px}
  .info-label{font-size:11px;font-weight:600;color:#5b8dee;letter-spacing:.5px;margin-bottom:2px;text-transform:uppercase}
  .info-val{font-size:13px;color:#bbb;line-height:1.5}
  .know-this{background:#1c1500;border:2px solid #c8a84b;border-radius:12px;padding:13px 15px;margin-top:.8rem}
  .know-this-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#c8a84b;font-weight:700;margin-bottom:5px}
  .know-this p{font-size:14px;color:#f0d080;line-height:1.6}
  .warn-box{background:#1a1200;border:1px solid #3a2a00;border-radius:10px;padding:11px 13px;margin-top:.8rem}
  .warn-box p{font-size:13px;color:#c8a84b;line-height:1.55}
  .bad-card{background:#1f0a0a;border:1px solid #3a1a1a;border-radius:10px;padding:11px 14px;margin-bottom:8px}
  .bad-title{font-size:12px;font-weight:700;color:#c05050;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
  .bad-def{font-size:13px;color:#bbb;line-height:1.5}
  ul.bullet{padding-left:1.1rem;display:flex;flex-direction:column;gap:5px;margin-top:.4rem}
  ul.bullet li{font-size:13px;color:#999;line-height:1.45}
  ul.bullet li strong{color:#ddd}
  .slide-num{position:absolute;top:1.1rem;right:1.4rem;font-size:11px;color:#333}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .nav-btn{padding:11px 28px;font-size:14px;font-weight:500;cursor:pointer;border-radius:10px;border:1px solid #2a2a2a;background:#1a1a1a;color:#e2e2e2;transition:background .15s}
  .nav-btn:hover{background:#252525}
  .nav-btn:disabled{opacity:.3;cursor:default}
  .nav-btn.primary{background:#0d1a2e;border-color:#1e3a6e;color:#5b8dee}
  .nav-btn.primary:hover{background:#112244}
  .counter{font-size:12px;color:#444;text-align:center;flex:1}
</style>
</head>
<body>
<div class="deck">
  <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>
  <div class="card" id="card">
    <div class="slide-num" id="slideNum"></div>
    <div id="content"></div>
  </div>
  <div class="nav">
    <button class="nav-btn" id="prevBtn" onclick="go(-1)">← Back</button>
    <span class="counter" id="counter"></span>
    <button class="nav-btn primary" id="nextBtn" onclick="go(1)">Next →</button>
  </div>
</div>
<a href="PC_Dashboard.html" style="position:fixed;bottom:16px;left:16px;padding:8px 16px;background:#141414;border:1px solid #2a2a2a;border-radius:8px;color:#888;font-size:12px;font-family:-apple-system,sans-serif;text-decoration:none;z-index:999">← Home</a>

<script>
const SLIDES = [
  {
    label: "Chapter 5 · Marketing Practices",
    title: "Unfair Trade Practices — Overview",
    body: `<p>Insurers and producers may not engage in any trade practice that is an <strong>unfair method of competition</strong> or an <strong>unfair or deceptive act</strong> in the business of insurance.</p>
<p>It is an unfair trade practice to <strong>knowingly</strong> engage in unfair methods with enough frequency to indicate a <strong>general business practice</strong>.</p>
<div class="info-grid" style="margin-top:.8rem">
  <div class="info-row"><div class="info-label">Consequence</div><div class="info-val">After a hearing, the Department may issue a <strong>cease and desist order</strong> and/or impose penalties for violation of insurance laws.</div></div>
</div>
<p style="margin-top:.8rem;font-size:13px;color:#888">The six prohibited practices:</p>
<ul class="bullet">
  <li>Misrepresentation</li>
  <li>False Advertising</li>
  <li>Rebating</li>
  <li>Defamation</li>
  <li>Boycott, Coercion & Intimidation</li>
  <li>Unfair Discrimination</li>
</ul>`
  },
  {
    label: "Unfair Trade Practice #1",
    title: "Misrepresentation",
    body: `<div class="bad-card">
  <div class="bad-title">Misrepresentation</div>
  <div class="bad-def">Issuing, publishing, or circulating any illustration or sales material that is <strong>false, misleading, or deceptive</strong> about policy benefits, terms, or dividend payments. Applies to <strong>written and verbal statements</strong>.</div>
</div>
<div class="info-grid" style="margin-top:.6rem">
  <div class="info-row"><div class="info-label">Examples</div><div class="info-val">Overstating policy benefits · Misquoting premiums · Making false promises about dividends · Misleading verbal sales pitches</div></div>
</div>
<div class="warn-box"><p>⚠️ Misrepresentation applies to <em>any</em> form of communication — not just written materials. A false verbal statement during a sales call counts.</p></div>`
  },
  {
    label: "Unfair Trade Practice #2",
    title: "False Advertising",
    body: `<div class="bad-card">
  <div class="bad-title">False Advertising</div>
  <div class="bad-def">Advertising or circulating any material that is <strong>untrue, deceptive, or misleading</strong> about the business of insurance or anyone who conducts it.</div>
</div>
<p style="margin-top:.8rem;font-size:13px;color:#aaa">False advertising specifically includes misrepresenting:</p>
<ul class="bullet">
  <li><strong>Terms, benefits, conditions, or advantages</strong> of any policy</li>
  <li>Any <strong>dividends</strong> to be received or previously paid out</li>
  <li><strong>Financial condition</strong> of any person or insurer</li>
  <li>The true purpose of an <strong>assignment or loan</strong> against a policy</li>
  <li>Representing a policy <strong>as a share of stock</strong></li>
  <li>Using names or titles that <strong>misrepresent the true nature</strong> of a policy</li>
  <li>Using a name that <strong>deceptively suggests</strong> an entity is an insurer</li>
</ul>`
  },
  {
    label: "Unfair Trade Practice #3",
    title: "Rebating",
    body: `<div class="bad-card">
  <div class="bad-title">Rebating</div>
  <div class="bad-def">Any <strong>inducement offered to the insured</strong> in the sale of insurance that is <strong>not specified in the policy</strong>. Both the <em>offer</em> and the <em>acceptance</em> of a rebate are illegal.</div>
</div>
<p style="margin-top:.8rem;font-size:13px;color:#aaa">Rebates may include:</p>
<ul class="bullet">
  <li>Rebates of <strong>premiums payable</strong> on the policy</li>
  <li>Special <strong>favors or services</strong></li>
  <li>Advantages in <strong>dividends or other benefits</strong></li>
  <li><strong>Stocks, bonds, securities</strong>, and their dividends or profits</li>
</ul>
<div class="know-this" style="margin-top:.8rem">
  <div class="know-this-label">⚠ Know This</div>
  <p>Both <strong>offering and accepting</strong> a rebate are illegal — not just the agent who gives it, but the client who takes it.</p>
</div>`
  },
  {
    label: "Unfair Trade Practice #4",
    title: "Defamation",
    body: `<div class="bad-card">
  <div class="bad-title">Defamation</div>
  <div class="bad-def">Making an <strong>oral or written statement</strong> intended to <strong>injure a person</strong> engaged in the insurance business, or making statements that are <strong>maliciously critical</strong> of the financial condition of any person or company.</div>
</div>
<div class="info-grid" style="margin-top:.8rem">
  <div class="info-row"><div class="info-label">Key Distinction</div><div class="info-val">Defamation targets a person or company's <em>reputation</em> — it's about damaging a competitor, not misleading a client.</div></div>
  <div class="info-row"><div class="info-label">Examples</div><div class="info-val">Spreading false rumors about a competitor's financial stability · Maliciously criticizing a rival insurer to steal clients</div></div>
</div>`
  },
  {
    label: "Unfair Trade Practice #5",
    title: "Boycott, Coercion & Intimidation",
    body: `<div class="bad-card">
  <div class="bad-title">Boycott, Coercion & Intimidation</div>
  <div class="bad-def">Any activity intended to <strong>restrict fair trade</strong> or <strong>create a monopoly</strong> — including unfair behavior toward clients, competing agents, and brokers.</div>
</div>
<div class="info-grid" style="margin-top:.8rem">
  <div class="info-row"><div class="info-label">Coercion — Specific Definition</div><div class="info-val">Requiring, as a <strong>condition to a loan</strong>, that the applicant purchase insurance from a <strong>specific insurer</strong>. This is a common exam scenario — tied selling is coercion.</div></div>
</div>
<div class="warn-box"><p>💡 Applies to influence over <strong>clients and competitors alike</strong> — not just forcing a policyholder's hand.</p></div>`
  },
  {
    label: "Unfair Trade Practice #6",
    title: "Unfair Discrimination",
    body: `<div class="bad-card">
  <div class="bad-title">Unfair Discrimination</div>
  <div class="bad-def">Discrimination in <strong>rates, premiums, or policy benefits</strong> for persons within the same class or with the same life expectancy.</div>
</div>
<p style="margin-top:.8rem;font-size:13px;color:#aaa">Discrimination may NOT be based on:</p>
<ul class="bullet">
  <li>Marital status</li>
  <li>Race or national origin</li>
  <li>Gender identity or sexual orientation</li>
  <li>Creed or ancestry</li>
</ul>
<div class="info-grid" style="margin-top:.8rem">
  <div class="info-row"><div class="info-label">Exception</div><div class="info-val">Distinctions made for a <strong>legitimate business purpose</strong> or <strong>required by law</strong> are permitted — not all distinctions are discrimination.</div></div>
</div>`
  },
  {
    label: "Section Summary",
    title: "The 6 Unfair Trade Practices",
    body: `<div class="info-grid">
  <div class="bad-card"><div class="bad-title">1. Misrepresentation</div><div class="bad-def">False or misleading statements about policy benefits, terms, or dividends — written or verbal</div></div>
  <div class="bad-card"><div class="bad-title">2. False Advertising</div><div class="bad-def">Untrue, deceptive, or misleading advertising about insurance products, people, or companies</div></div>
  <div class="bad-card"><div class="bad-title">3. Rebating</div><div class="bad-def">Offering inducements not in the policy — both offer AND acceptance are illegal</div></div>
  <div class="bad-card"><div class="bad-title">4. Defamation</div><div class="bad-def">Statements intended to injure or maliciously criticize a competitor's financial condition</div></div>
  <div class="bad-card"><div class="bad-title">5. Boycott, Coercion & Intimidation</div><div class="bad-def">Restricting fair trade or creating a monopoly — includes tying insurance to a loan</div></div>
  <div class="bad-card"><div class="bad-title">6. Unfair Discrimination</div><div class="bad-def">Different rates/benefits for people in the same class based on protected characteristics</div></div>
</div>`
  }
];

let cur = 0;

function render() {
  const s = SLIDES[cur];
  document.getElementById('content').innerHTML =
    `<div class="card-label">${s.label}</div><div class="card-title">${s.title}</div><div class="card-body">${s.body}</div>`;
  document.getElementById('fill').style.width = ((cur + 1) / SLIDES.length * 100) + '%';
  document.getElementById('counter').textContent = (cur + 1) + ' of ' + SLIDES.length;
  document.getElementById('slideNum').textContent = (cur + 1) + ' / ' + SLIDES.length;
  document.getElementById('prevBtn').disabled = cur === 0;
  document.getElementById('nextBtn').textContent = cur === SLIDES.length - 1 ? '✓ Done' : 'Next →';
  document.getElementById('nextBtn').onclick = cur === SLIDES.length - 1
    ? () => window.location.href = 'PC_Dashboard.html'
    : () => go(1);
}

function go(dir) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, cur + dir));
  render();
}

render();
</script>
</body>
</html>
