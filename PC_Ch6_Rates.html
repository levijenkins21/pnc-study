<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P&C — Ch6: Rates</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e2e2e2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem}
  .deck{width:100%;max-width:680px}
  .progress-bar{width:100%;height:3px;background:#1a1a1a;border-radius:2px;margin-bottom:1.5rem}
  .progress-fill{height:3px;background:#5b8dee;border-radius:2px;transition:width .4s ease}
  .card{background:#141414;border:1px solid #222;border-radius:20px;padding:2.2rem 2rem;min-height:360px;display:flex;flex-direction:column;justify-content:center;margin-bottom:1.2rem;position:relative}
  .card-label{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:#5b8dee;margin-bottom:.6rem}
  .card-title{font-size:20px;font-weight:700;color:#fff;margin-bottom:.9rem;line-height:1.25}
  .card-body{font-size:14px;color:#aaa;line-height:1.75}
  .card-body strong{color:#e2e2e2;font-weight:600}
  .card-body p+p{margin-top:.7rem}
  .info-grid{display:flex;flex-direction:column;gap:8px;margin-top:.6rem}
  .info-row{background:#1a1a1a;border:1px solid #242424;border-radius:10px;padding:10px 13px}
  .info-label{font-size:11px;font-weight:600;color:#5b8dee;letter-spacing:.5px;margin-bottom:2px;text-transform:uppercase}
  .info-val{font-size:13px;color:#bbb;line-height:1.5}
  .warn-box{background:#1a1200;border:1px solid #3a2a00;border-radius:10px;padding:11px 13px;margin-top:.8rem}
  .warn-box p{font-size:13px;color:#c8a84b;line-height:1.55}
  .num-card{background:#0d1a2e;border:1px solid #1e3a6e;border-radius:10px;padding:11px 13px;display:flex;align-items:center;gap:12px}
  .num-big{font-size:22px;font-weight:700;color:#5b8dee;flex-shrink:0;min-width:76px;text-align:center;line-height:1.1}
  .num-desc{font-size:13px;color:#aaa;line-height:1.45}
  .num-desc strong{color:#e2e2e2}
  ul.bullet{padding-left:1.1rem;display:flex;flex-direction:column;gap:5px;margin-top:.4rem}
  ul.bullet li{font-size:13px;color:#999;line-height:1.45}
  ul.bullet li strong{color:#ddd}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:.6rem}
  .mini-card{background:#1a1a1a;border:1px solid #242424;border-radius:9px;padding:9px 11px}
  .mini-label{font-size:10px;color:#5b8dee;font-weight:600;letter-spacing:.5px;margin-bottom:2px;text-transform:uppercase}
  .mini-val{font-size:12px;color:#bbb;line-height:1.4}
  .slide-num{position:absolute;top:1.1rem;right:1.4rem;font-size:11px;color:#333}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .nav-btn{padding:11px 28px;font-size:14px;font-weight:500;cursor:pointer;border-radius:10px;border:1px solid #2a2a2a;background:#1a1a1a;color:#e2e2e2;transition:background .15s}
  .nav-btn:hover{background:#252525}
  .nav-btn:disabled{opacity:.3;cursor:default}
  .nav-btn.primary{background:#0d1a2e;border-color:#1e3a6e;color:#5b8dee}
  .nav-btn.primary:hover{background:#112244}
  .counter{font-size:12px;color:#444;text-align:center;flex:1}
</style>
</head>
<body>
<div class="deck">
  <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>
  <div class="card" id="card">
    <div class="slide-num" id="slideNum"></div>
    <div id="content"></div>
  </div>
  <div class="nav">
    <button class="nav-btn" id="prevBtn" onclick="go(-1)">← Back</button>
    <span class="counter" id="counter"></span>
    <button class="nav-btn primary" id="nextBtn" onclick="go(1)">Next →</button>
  </div>
</div>
<a href="PC_Dashboard.html" style="position:fixed;bottom:16px;left:16px;padding:8px 16px;background:#141414;border:1px solid #2a2a2a;border-radius:8px;color:#888;font-size:12px;font-family:-apple-system,sans-serif;text-decoration:none;z-index:999">← Home</a>

<script>
const SLIDES = [
  {
    label: "Chapter 6 · Rates",
    title: "Rate Filing Requirements",
    body: `<p>Insurers must file with the Department of Insurance a manual including:</p>
<ul class="bullet" style="margin-top:.5rem">
  <li>Classifications, rules, and rates</li>
  <li>Rating plans</li>
  <li>Policy forms</li>
  <li>Any rate modifications intended to be used</li>
</ul>
<div class="info-grid" style="margin-top:.8rem">
  <div class="info-row"><div class="info-label">Rate Standard</div><div class="info-val">All rates must include sufficient information for the Commissioner to determine the rates are <strong>adequate, not excessive, and not unfairly discriminatory</strong>.</div></div>
</div>`
  },
  {
    label: "Chapter 6 · Rates",
    title: "Commercial vs. Personal Rate Filing Timing",
    body: `<div class="info-grid">
  <div class="num-card"><div class="num-big">Immediate</div><div class="num-desc"><strong>Commercial insurance rates</strong> may be used at the time the filing is made with the Commissioner — no waiting period.</div></div>
  <div class="num-card"><div class="num-big">30 days</div><div class="num-desc"><strong>Personal insurance rates</strong> must be on file with the Commissioner <strong>30 days before they become effective</strong>.</div></div>
  <div class="num-card"><div class="num-big">5 years</div><div class="num-desc">The Commissioner must <strong>examine rating organizations</strong> at least every 5 years.</div></div>
</div>`
  },
  {
    label: "Chapter 6 · Rates",
    title: "Risks Exempt from Rate Filing",
    body: `<p>Certain special risk categories are <strong>exempt from rate filing requirements</strong>:</p>
<ul class="bullet" style="margin-top:.6rem">
  <li><strong>Excess and umbrella</strong> risks</li>
  <li>Commercial risks for which <strong>manual rates do not exist</strong> or that are A-rated</li>
  <li><strong>Large risks</strong> (defined on the next slide)</li>
  <li>Special risks: <strong>Highly Protected Risks (HPR), commercial aviation, credit insurance, boiler and machinery, inland marine, fidelity, surety and guarantee bond risks</strong></li>
</ul>`
  },
  {
    label: "Chapter 6 · Rates",
    title: "What Qualifies as a 'Large Risk'",
    body: `<p>A risk qualifies as a <strong>large risk</strong> (exempt from filing) if any of the following apply:</p>
<div class="info-grid" style="margin-top:.8rem">
  <div class="num-card"><div class="num-big">$5M+</div><div class="num-desc"><strong>Total insured property values</strong> of $5,000,000 or more</div></div>
  <div class="num-card"><div class="num-big">$10M+</div><div class="num-desc"><strong>Total annual gross revenue</strong> of $10,000,000 or more</div></div>
  <div class="num-card"><div class="num-big">$50K+</div><div class="num-desc">Total premiums of $50,000+ for <strong>property insurance</strong> OR $50,000+ for <strong>general liability</strong></div></div>
  <div class="num-card"><div class="num-big">$100K+</div><div class="num-desc">Total premiums of $100,000+ for <strong>multiple lines policies</strong></div></div>
</div>
<div class="warn-box"><p>⚠️ Large risk exemption does <strong>NOT</strong> apply to Workers Compensation or employers liability coverage.</p></div>`
  },
  {
    label: "Chapter 6 · Rates",
    title: "Unfair Rate Discrimination",
    body: `<p>A rate is <strong>unfairly discriminatory</strong> if it clearly fails to reflect equitably the differences in expected losses and expenses within the same class.</p>
<div class="info-grid" style="margin-top:.8rem">
  <div class="info-row"><div class="info-label">NOT Unfair Discrimination</div><div class="info-val">Different premiums for policyholders with <strong>similar exposures but different expense or loss factors</strong> — as long as the rates reflect those differences with reasonable accuracy.</div></div>
  <div class="info-row"><div class="info-label">IS Unfair Discrimination</div><div class="info-val">Refusing insurance, refusing renewal, or limiting coverage for individuals <strong>within the same rating class</strong> · Charging different rates based solely on the <strong>geographic location</strong> of the risk within the same rating class</div></div>
</div>`
  },
  {
    label: "Numbers to Memorize",
    title: "Rates — Key Numbers",
    body: `<div class="two-col">
  <div class="mini-card"><div class="mini-label">Commercial Filing</div><div class="mini-val">Effective <strong>immediately</strong> upon filing</div></div>
  <div class="mini-card"><div class="mini-label">Personal Filing</div><div class="mini-val">Must be on file <strong>30 days</strong> before effective</div></div>
  <div class="mini-card"><div class="mini-label">Rating Org Exam</div><div class="mini-val">Commissioner examines every <strong>5 years</strong></div></div>
  <div class="mini-card"><div class="mini-label">Large Risk — Property</div><div class="mini-val"><strong>$5,000,000+</strong> insured value</div></div>
  <div class="mini-card"><div class="mini-label">Large Risk — Revenue</div><div class="mini-val"><strong>$10,000,000+</strong> annual gross revenue</div></div>
  <div class="mini-card"><div class="mini-label">Large Risk — Property Prem</div><div class="mini-val"><strong>$50,000+</strong> in property premiums</div></div>
  <div class="mini-card"><div class="mini-label">Large Risk — GL Premium</div><div class="mini-val"><strong>$50,000+</strong> in general liability premiums</div></div>
  <div class="mini-card"><div class="mini-label">Large Risk — Multi-Line</div><div class="mini-val"><strong>$100,000+</strong> in multiple lines premiums</div></div>
</div>
<div class="warn-box" style="margin-top:.8rem"><p>📝 WC and employers liability are <strong>never</strong> exempt from filing as large risks.</p></div>`
  }
];

let cur = 0;
function render() {
  const s = SLIDES[cur];
  document.getElementById('content').innerHTML =
    `<div class="card-label">${s.label}</div><div class="card-title">${s.title}</div><div class="card-body">${s.body}</div>`;
  document.getElementById('fill').style.width = ((cur + 1) / SLIDES.length * 100) + '%';
  document.getElementById('counter').textContent = (cur + 1) + ' of ' + SLIDES.length;
  document.getElementById('slideNum').textContent = (cur + 1) + ' / ' + SLIDES.length;
  document.getElementById('prevBtn').disabled = cur === 0;
  document.getElementById('nextBtn').textContent = cur === SLIDES.length - 1 ? '✓ Done' : 'Next →';
  document.getElementById('nextBtn').onclick = cur === SLIDES.length - 1
    ? () => window.location.href = 'PC_Dashboard.html'
    : () => go(1);
}
function go(dir) { cur = Math.max(0, Math.min(SLIDES.length - 1, cur + dir)); render(); }
render();
</script>
</body>
</html>
