<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P&C — Ch8: Kansas Workers Compensation</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e2e2e2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem}
  .deck{width:100%;max-width:680px}
  .progress-bar{width:100%;height:3px;background:#1a1a1a;border-radius:2px;margin-bottom:1.5rem}
  .progress-fill{height:3px;background:#5b8dee;border-radius:2px;transition:width .4s ease}
  .card{background:#141414;border:1px solid #222;border-radius:20px;padding:2.2rem 2rem;min-height:340px;display:flex;flex-direction:column;justify-content:center;margin-bottom:1.2rem;position:relative}
  .card-label{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:#5b8dee;margin-bottom:.6rem}
  .card-title{font-size:20px;font-weight:700;color:#fff;margin-bottom:.9rem;line-height:1.25}
  .card-body{font-size:14px;color:#aaa;line-height:1.75}
  .card-body strong{color:#e2e2e2;font-weight:600}
  .card-body p+p{margin-top:.7rem}
  .info-grid{display:flex;flex-direction:column;gap:8px;margin-top:.6rem}
  .info-row{background:#1a1a1a;border:1px solid #242424;border-radius:10px;padding:10px 13px}
  .info-label{font-size:11px;font-weight:600;color:#5b8dee;letter-spacing:.5px;margin-bottom:2px;text-transform:uppercase}
  .info-val{font-size:13px;color:#bbb;line-height:1.5}
  .know-box{background:#1c1500;border:2px solid #c8a84b;border-radius:10px;padding:12px 14px;margin-top:.8rem}
  .know-label{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#c8a84b;margin-bottom:5px}
  .know-box p{font-size:13px;color:#f0d080;line-height:1.55}
  .num-card{background:#0d1a2e;border:1px solid #1e3a6e;border-radius:10px;padding:11px 13px;display:flex;align-items:center;gap:12px}
  .num-big{font-size:20px;font-weight:700;color:#5b8dee;flex-shrink:0;min-width:90px;text-align:center;line-height:1.1}
  .num-desc{font-size:13px;color:#aaa;line-height:1.45}
  .num-desc strong{color:#e2e2e2}
  .red-item{background:#1a0a0a;border:1px solid #2e1a1a;border-radius:9px;padding:9px 13px;margin-bottom:6px;font-size:13px;color:#b07070;line-height:1.45}
  .red-item strong{color:#e2e2e2}
  .benefit-item{background:#1a1a1a;border:1px solid #242424;border-radius:9px;padding:8px 13px;margin-bottom:5px;font-size:13px;color:#bbb;line-height:1.4}
  .benefit-item strong{color:#e2e2e2}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:.6rem}
  .mini-card{background:#1a1a1a;border:1px solid #242424;border-radius:9px;padding:9px 11px}
  .mini-label{font-size:10px;color:#5b8dee;font-weight:600;letter-spacing:.5px;margin-bottom:2px;text-transform:uppercase}
  .mini-val{font-size:12px;color:#bbb;line-height:1.4}
  .slide-num{position:absolute;top:1.1rem;right:1.4rem;font-size:11px;color:#333}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .nav-btn{padding:11px 28px;font-size:14px;font-weight:500;cursor:pointer;border-radius:10px;border:1px solid #2a2a2a;background:#1a1a1a;color:#e2e2e2;transition:background .15s}
  .nav-btn:hover{background:#252525}
  .nav-btn:disabled{opacity:.3;cursor:default}
  .nav-btn.primary{background:#0d1a2e;border-color:#1e3a6e;color:#5b8dee}
  .nav-btn.primary:hover{background:#112244}
  .counter{font-size:12px;color:#444;text-align:center;flex:1}
</style>
</head>
<body>
<div class="deck">
  <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>
  <div class="card" id="card">
    <div class="slide-num" id="slideNum"></div>
    <div id="content"></div>
  </div>
  <div class="nav">
    <button class="nav-btn" id="prevBtn" onclick="go(-1)">← Back</button>
    <span class="counter" id="counter"></span>
    <button class="nav-btn primary" id="nextBtn" onclick="go(1)">Next →</button>
  </div>
</div>
<a href="PC_Dashboard.html" style="position:fixed;bottom:16px;left:16px;padding:8px 16px;background:#141414;border:1px solid #2a2a2a;border-radius:8px;color:#888;font-size:12px;font-family:-apple-system,sans-serif;text-decoration:none;z-index:999">← Home</a>

<script>
const SLIDES = [
  {
    label: "Chapter 8 · Workers Compensation",
    title: "WC Is Compulsory — Who Is Exempt?",
    body: `<p>Workers Compensation insurance is <strong>compulsory in Kansas</strong>. The following employers are exempt:</p>
<div style="margin-top:.7rem">
  <div class="red-item"><strong>Agricultural employers</strong></div>
  <div class="red-item">Employers with a <strong>total gross annual payroll of $20,000 or less</strong> in the preceding calendar year</div>
  <div class="red-item">Employers with <strong>no payroll for the calendar year</strong> who anticipate total payroll will <strong>not exceed $20,000</strong> in the current year</div>
  <div class="red-item"><strong>Real estate agents</strong> who act as independent contractors</div>
</div>
<div class="know-box"><div class="know-label">Know This</div><p>The payroll exemption threshold is <strong>$20,000</strong>. Agricultural employers and independent contractor real estate agents are always exempt — no payroll test required.</p></div>`
  },
  {
    label: "Chapter 8 · Workers Compensation",
    title: "How to Comply & Multiple Employers",
    body: `<div class="info-grid">
  <div class="info-row"><div class="info-label">How to Secure Coverage</div><div class="info-val">An employer may secure coverage from <strong>private insurers</strong> or apply to become an <strong>approved self-insurer</strong> on an individual or group basis.</div></div>
  <div class="info-row"><div class="info-label">Multiple Employer Rule</div><div class="info-val">If an individual employed by <strong>multiple employers</strong> suffers an injury that cannot be attributed to a particular employer, <strong>each employer must pay a proportionate amount</strong> of compensation.</div></div>
</div>`
  },
  {
    label: "Chapter 8 · WC Assigned Risk Plan",
    title: "Kansas WC Insurance Plan",
    body: `<p>When required WC insurance is <strong>not available through standard markets</strong>, an employer may apply to the <strong>Kansas Workers Compensation Insurance Plan</strong>.</p>
<div class="info-grid" style="margin-top:.8rem">
  <div class="info-row"><div class="info-label">How Participation Works</div><div class="info-val">All insurers authorized to write WC in Kansas share in Plan business <strong>in proportion to their voluntary business</strong> relative to the <strong>total WC market</strong>.</div></div>
</div>
<div class="know-box" style="margin-top:.8rem"><div class="know-label">Know This</div><p>Same proportional sharing structure as KAIP — assigned risk plans always divide risk by <strong>voluntary market share</strong>.</p></div>`
  },
  {
    label: "Chapter 8 · WC Benefits",
    title: "Workers Compensation Benefits",
    body: `<p>Benefits payable under Kansas WC coverage include:</p>
<div style="margin-top:.7rem">
  <div class="benefit-item"><strong>Medical expenses</strong> — <span style="color:#f0d080;font-weight:600">without dollar or time limitation</span></div>
  <div class="benefit-item"><strong>Temporary total disability</strong></div>
  <div class="benefit-item"><strong>Permanent total disability</strong></div>
  <div class="benefit-item"><strong>Partial disability</strong></div>
  <div class="benefit-item"><strong>Disfigurement benefits</strong></div>
  <div class="benefit-item"><strong>Rehabilitation benefits</strong></div>
  <div class="benefit-item"><strong>Survivor's benefits</strong></div>
  <div class="benefit-item"><strong>Burial allowance</strong> — <span style="color:#5b8dee;font-weight:600">$5,000</span></div>
</div>
<div class="know-box" style="margin-top:.8rem"><div class="know-label">Know This</div><p>Medical expenses under WC have <strong>no dollar limit and no time limit</strong>. Burial allowance is exactly <strong>$5,000</strong>.</p></div>`
  }
];

let cur = 0;
function render() {
  const s = SLIDES[cur];
  document.getElementById('content').innerHTML =
    `<div class="card-label">${s.label}</div><div class="card-title">${s.title}</div><div class="card-body">${s.body}</div>`;
  document.getElementById('fill').style.width = ((cur + 1) / SLIDES.length * 100) + '%';
  document.getElementById('counter').textContent = (cur + 1) + ' of ' + SLIDES.length;
  document.getElementById('slideNum').textContent = (cur + 1) + ' / ' + SLIDES.length;
  document.getElementById('prevBtn').disabled = cur === 0;
  document.getElementById('nextBtn').textContent = cur === SLIDES.length - 1 ? '✓ Done' : 'Next →';
  document.getElementById('nextBtn').onclick = cur === SLIDES.length - 1
    ? () => window.location.href = 'PC_Dashboard.html'
    : () => go(1);
}
function go(dir) { cur = Math.max(0, Math.min(SLIDES.length - 1, cur + dir)); render(); }
render();
</script>
</body>
</html>
